arning games need to be what we call 'fun enough.'", "Many new learning-game developers try to design an entertaining game.", "Unfortunately, that often makes learning harder rather than easier.", "Remember, you are not creating the next great commercial game to entertain your learners; you are creating a learning game in which success will be measured by the achievement of learning outcomes.", "Resist the temptation to create a ton of rules, pile on different game elements, and incorporate multiple dynamics to keep player interest high.", "Yes, the game should be engaging with a mild level of fun, but learning should be the goal.", "Focus on engagement rather than entertainment."], "hint": "학습용 게임은 재미보다 학습 목표에 집중해야 한다", "explain": "주제: 학습용 게임은 재미보다 학습 목표에 집중해야 한다. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 21, "q": "21번 지문", "sents": ["We are wonderfully made, yet we don't allow ourselves to participate in the wonder for which we were created.", "Instead of moving anywhere and everywhere, most of us spend our time moving nowhere.", "Many kids today are being held captive by 'smart' devices like phones and tablets.", "They are not going outside to play, they are not learning how to socialize and read physical cues from others.", "As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature.", "The point is we are getting further and further away from our design.", "We were made to move ―and through movement, we are meant to live extraordinary lives."], "hint": "스마트 기기에 갇혀 움직이지 않는 아이들과 움직임의 중요성", "explain": "주제: 스마트 기기에 갇혀 움직이지 않는 아이들과 움직임의 중요성. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 22, "q": "22번 지문", "sents": ["Perhaps you have heard of the Law of Attraction, which states that 'like attracts like' and that by focusing on positive or negative thoughts, one can bring about positive or negative results.", "The common flaw in our understanding of this law is that we believe all we have to do is think about or visualize something to manifest it.", "It is true that our thoughts and words are extremely magnetic.", "But the most powerful attractor is our belief system.", "You can create beautiful poster boards full of images of what you want; but if you don't truly believe you are enough, worthy, lovable, and deserving, then attracting a great career or relationship into your life may be more challenging."], "hint": "끌어당김의 법칙에서 가장 강력한 것은 믿음 체계", "explain": "주제: 끌어당김의 법칙에서 가장 강력한 것은 믿음 체계. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 23, "q": "23번 지문", "sents": ["It's important for humans to have many kinds of minds, because variation is critical for the survival of a species.", "One of Charles Darwin's greatest insights was that variation is a prerequisite for natural selection to work.", "Think about it: If there's a huge change in the environment, like a catastrophic drop in the food supply, a species without much variation might be completely wiped out.", "A species with great variation will more likely have some survivors after any catastrophe.", "Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we're less likely to be wiped out.", "This variation preserves the evolvability of our species."], "hint": "다양한 사고방식이 종의 생존에 중요한 이유", "explain": "주제: 다양한 사고방식이 종의 생존에 중요한 이유. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 24, "q": "24번 지문", "sents": ["Letting go of our need for control, being aware, is a lot about gathering the courage to face uncertainty.", "When we don't know, when things are uncertain, we often feel frightened and become inflexible.", "So we pretend that things are more predictable than they really are, even though we actually live with enormous uncertainty all the time.", "And there's nothing wrong with having plans.", "But there's a difference between planning and thinking all your plans have to come to fruition.", "American president Eisenhower once said: 'Plans are worthless, but planning is everything.'", "Imagine if we all used pencil instead of ink to write in our calendars and planners."], "hint": "통제 욕구를 내려놓고 불확실성에 유연하게 대처하기", "explain": "주제: 통제 욕구를 내려놓고 불확실성에 유연하게 대처하기. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 26, "q": "26번 지문", "sents": ["Paul Farmer was an American medical anthropologist and physician.", "He was born in 1959 in Massachusetts and grew up with an early awareness of social inequality.", "After graduating from Duke University, he began volunteer work at a hospital in Cangé, Haiti.", "He later returned to the United States and earned both a master's degree and a PhD in medical anthropology at Harvard University.", "In 1987, he co-founded Partners In Health, an organization that works in countries like Haiti, Rwanda, and Peru to provide medical treatment and strengthen public health systems.", "He received many major awards during his career, and after his death, he was also honored with the WHO Director-General's Global Health Leaders Award for his lifelong work to improve health for the poor."], "hint": "의료 인류학자 Paul Farmer의 생애", "explain": "주제: 의료 인류학자 Paul Farmer의 생애. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 29, "q": "29번 지문", "sents": ["To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food.", "There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration.", "Anaerobic energy is quicker and easier for our bodies to access, a kind of backup system when the body doesn't have enough oxygen.", "But anaerobic energy is inefficient and can be toxic, creating too much lactic acid.", "This explains why the first few minutes of an intense workout are often so miserable.", "This also explains why, after we're warmed up, exercise feels easier ―the body has switched from anaerobic to aerobic respiration."], "hint": "호흡 방식(유산소·무산소)과 운동 수행", "explain": "주제: 호흡 방식(유산소·무산소)과 운동 수행. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 30, "q": "30번 지문", "sents": ["Keep your paragraphs short.", "Writing is visual ―it catches the eye before it has a chance to catch the brain.", "Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read.", "Don't worry; the gains far outweigh the hazards.", "But don't go too far.", "A succession of tiny paragraphs is as annoying as a paragraph that's too long.", "I'm thinking of all those tiny paragraphs ―verbless wonders― written by modern journalists trying to make their articles quick 'n' easy.", "Actually they make the reader's job harder by chopping up a natural train of thought."], "hint": "문단은 짧게, 하지만 너무 잘게 쪼개지는 말 것", "explain": "주제: 문단은 짧게, 하지만 너무 잘게 쪼개지는 말 것. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}],
[{"type": "order", "num": 31, "q": "31번 지문", "sents": ["Our tastes are social.", "Even when you first drank milk, there was the milk, yes, but there was also the person behind the milk who will have presumably either made or messed up your relationship with food for the couple of decades after that.", "We learn to eat from our families and friends, at school and in work.", "We want these things not just because of what they are, but who we are.", "Tastes spread like this, person to person, like viruses, almost irrespective of the qualities of the food involved.", "We observe other people in their food lives, often judgmentally."], "hint": "입맛은 사회적으로 형성된다", "explain": "주제: 입맛은 사회적으로 형성된다. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 32, "q": "32번 지문", "sents": ["One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments.", "This may sound surprising, especially if you've ever felt overwhelmed by anger, fear, or sadness.", "But the Stoics taught that emotions aren't just automatic reactions.", "They're shaped by how we interpret events.", "For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening.", "Change the judgment, and you change the emotion.", "This doesn't mean suppressing how you feel; it means examining the story you tell yourself."], "hint": "감정은 판단에서 생긴다는 스토아 철학", "explain": "주제: 감정은 판단에서 생긴다는 스토아 철학. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 33, "q": "33번 지문", "sents": ["The ancient Greeks felt that the visual artist's goal was to copy visual experience.", "This approach appears in the realism of ancient Greek sculpture and pottery.", "This definition of art as copying reality has a problem, though.", "Jackson Pollock, a leader in the New York School of the 1950's, intentionally did not copy existing objects in his art.", "While painting these works, Pollock and his fellow artists would consciously avoid making marks that resembled recognizable objects.", "They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis―simple copying― does not sufficiently define art."], "hint": "예술을 '모방'으로 정의하는 관점의 한계", "explain": "주제: 예술을 '모방'으로 정의하는 관점의 한계. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 34, "q": "34번 지문", "sents": ["If our bodies know best, why are they easily injured when we do something so seemingly natural as running?", "On the one hand, running seems very easy, but that is only because our bodies are so very good at it.", "The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs.", "Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities.", "That doesn't mean our bodies don't know how to do it."], "hint": "달리기처럼 쉬워 보이는 동작 속 몸의 복잡한 지식", "explain": "주제: 달리기처럼 쉬워 보이는 동작 속 몸의 복잡한 지식. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 35, "q": "35번 지문", "sents": ["Our number one criterion for how we care for our pets should be, \"Is this what they actually need?\" rather than, \"What do I want?\"", "For example, we have encountered many dog owners who bathe their dogs religiously multiple times a week because they want to avoid the 'doggy' smell, but veterinary dermatologists warn against such practices, as they are not good for a dog's skin.", "Unless they have a skin condition for which a vet has prescribed medicated baths, most dogs don't need to be bathed on a regular basis.", "Even dogs with thick, heavy coats generally only need baths every 6 to 8 weeks."], "hint": "반려동물은 주인이 원하는 것보다 필요한 것 위주로 돌봐야 한다", "explain": "주제: 반려동물은 주인이 원하는 것보다 필요한 것 위주로 돌봐야 한다. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 36, "q": "36번 지문", "sents": ["The central concerns of mathematics are not numbers, but patterns, structures, symmetries and connections.", "Take, for example, the Sudoku puzzles that appear daily in newspapers.", "The objective is to complete a 9 × 9 grid, while ensuring that each row, column and block contains all the digits from 1 to 9 once.", "But the numerical values of the digits are irrelevant; what is important is that there are nine distinct symbols.", "They could be nine letters or nine shapes.", "It's the pattern that matters.", "One Irish daily paper publishes these puzzles with the statement 'There's no maths involved, simply use reasoning and logic!'", "If you can do Sudoku, you can do maths!"], "hint": "수학의 핵심은 숫자가 아니라 패턴", "explain": "주제: 수학의 핵심은 숫자가 아니라 패턴. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 37, "q": "37번 지문", "sents": ["Even before telescopes existed, people looked out into space and tried to understand the universe.", "In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea: that it was Earth that traveled around the Sun, not the other way around.", "Despite widespread objections, he published his theory in a book.", "Later astronomers built on Copernicus' work.", "Technological improvements led to the development of the telescope in the early 17th century.", "Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and confirmed that Copernicus' theory was correct."], "hint": "코페르니쿠스의 지동설과 망원경의 발달", "explain": "주제: 코페르니쿠스의 지동설과 망원경의 발달. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 38, "q": "38번 지문", "sents": ["To harness the full potential of units of measurement, we need some degree of consistency.", "Subjective measures contain useful knowledge, but this can be difficult to share, based as it is on an individual's experience.", "The historian of science Theodore M. Porter describes measurement as a 'technology of distance': a tool that uses shared rules to bridge differences of culture and geography.", "If measurement is another sort of language, then just as with words, individual units need reliable definitions in order to communicate.", "Imagine a disagreement over trade or tribute: it is a moment of conflict that demands greater consistency in measurement."], "hint": "측정 단위에는 일관된 정의가 필요하다", "explain": "주제: 측정 단위에는 일관된 정의가 필요하다. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 39, "q": "39번 지문", "sents": ["With millions of members in a colony, leaf-cutter ants cultivate their own food.", "Just like humans, they're farmers.", "Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest.", "However, the ants don't eat these leaves.", "Instead, smaller worker ants chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground 'gardens.'", "The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat.", "Just like humans, they have perfected an agricultural civilization."], "hint": "농사를 짓는 가위개미", "explain": "주제: 농사를 짓는 가위개미. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}, {"type": "order", "num": 40, "q": "40번 지문", "sents": ["From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships.", "The system monitors other people's reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status.", "The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low.", "When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation.", "It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance."], "hint": "자존감은 관계의 질을 감시하는 장치", "explain": "주제: 자존감은 관계의 질을 감시하는 장치. 지시어(this, that, they), 연결어(However, But, Instead, For example), 앞 문장에서 소개한 대상을 다시 받는 표현을 단서로 순서를 잡아 보세요."}],
[{"q": "20번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>Unfortunately, that often makes learning harder rather than easier.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Learning games need to be what we call 'fun enough.'  ( ① ) Many new learning-game developers try to design an entertaining game.  ( ② ) Remember, you are not creating the next great commercial game to entertain your learners; you are creating a learning game in which success will be measured by the achievement of learning outcomes.  ( ③ ) Resist the temptation to create a ton of rules, pile on different game elements, and incorporate multiple dynamics to keep player interest high.  ( ④ ) Yes, the game should be engaging with a mild level of fun, but learning should be the goal.  ( ⑤ ) Focus on engagement rather than entertainment.</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 1, "explain": "Unfortunately 뒤의 that은 앞 문장의 '재미있는 게임을 만들려는 시도'를 가리킨다. 그래서 개발자들이 재미있는 게임을 만들려 한다는 문장 바로 뒤에 와야 한다.", "fixed": true}, {"q": "21번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>We are wonderfully made, yet we don't allow ourselves to participate in the wonder for which we were created.  ( ① ) Instead of moving anywhere and everywhere, most of us spend our time moving nowhere.  ( ② ) Many kids today are being held captive by 'smart' devices like phones and tablets.  ( ③ ) They are not going outside to play, they are not learning how to socialize and read physical cues from others.  ( ④ ) The point is we are getting further and further away from our design.  ( ⑤ ) We were made to move ―and through movement, we are meant to live extraordinary lives.</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 3, "explain": "As a result는 앞 문장(아이들이 밖에서 놀지 않고 사회성을 배우지 않는다)의 결과를 이끈다. 그 결과 움직임 능력을 쌓지 못한다는 내용 뒤에 The point is ~로 요지가 정리된다.", "fixed": true}, {"q": "23번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>A species with great variation will more likely have some survivors after any catastrophe.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>It's important for humans to have many kinds of minds, because variation is critical for the survival of a species.  ( ① ) One of Charles Darwin's greatest insights was that variation is a prerequisite for natural selection to work.  ( ② ) Think about it: If there's a huge change in the environment, like a catastrophic drop in the food supply, a species without much variation might be completely wiped out.  ( ③ ) Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we're less likely to be wiped out.  ( ④ ) This variation preserves the evolvability of our species.  ( ⑤ )</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 2, "explain": "앞 문장에서 변이가 적은 종은 전멸할 수 있다고 했고, 주어진 문장은 그와 대조되는 '변이가 큰 종'을 설명한다. 그 뒤에 Thankfully로 인간 종의 다양성이 이어진다.", "fixed": true}, {"q": "24번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>But there's a difference between planning and thinking all your plans have to come to fruition.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Letting go of our need for control, being aware, is a lot about gathering the courage to face uncertainty.  ( ① ) When we don't know, when things are uncertain, we often feel frightened and become inflexible.  ( ② ) So we pretend that things are more predictable than they really are, even though we actually live with enormous uncertainty all the time.  ( ③ ) And there's nothing wrong with having plans.  ( ④ ) American president Eisenhower once said: 'Plans are worthless, but planning is everything.'  ( ⑤ ) Imagine if we all used pencil instead of ink to write in our calendars and planners.</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 3, "explain": "And there's nothing wrong with having plans(계획은 괜찮다) 뒤에 But으로 '계획하는 것과 계획이 꼭 이뤄져야 한다고 생각하는 것은 다르다'가 이어지고, 이를 Eisenhower의 말이 뒷받침한다.", "fixed": true}, {"q": "29번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>But anaerobic energy is inefficient and can be toxic, creating too much lactic acid.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food.  ( ① ) There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration.  ( ② ) Anaerobic energy is quicker and easier for our bodies to access, a kind of backup system when the body doesn't have enough oxygen.  ( ③ ) This explains why the first few minutes of an intense workout are often so miserable.  ( ④ ) This also explains why, after we're warmed up, exercise feels easier ―the body has switched from anaerobic to aerobic respiration.  ( ⑤ )</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 2, "explain": "앞 문장에서 무산소 에너지의 장점(빠르고 쉽다)을 말했고, 주어진 문장은 But으로 단점(비효율, 젖산)을 말한다. 뒤 문장의 This explains why ~ miserable이 이 단점을 받는다.", "fixed": true}, {"q": "30번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>But don't go too far.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Keep your paragraphs short.  ( ① ) Writing is visual ―it catches the eye before it has a chance to catch the brain.  ( ② ) Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read.  ( ③ ) Don't worry; the gains far outweigh the hazards.  ( ④ ) A succession of tiny paragraphs is as annoying as a paragraph that's too long.  ( ⑤ ) I'm thinking of all those tiny paragraphs ―verbless wonders― written by modern journalists trying to make their articles quick 'n' easy. Actually they make the reader's job harder by chopping up a natural train of thought.</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 3, "explain": "'걱정 마라, 이득이 더 크다' 뒤에 But don't go too far(너무 지나치지는 마라)로 방향을 틀고, 이어서 너무 짧은 문단도 짜증스럽다는 내용이 나온다.", "fixed": true}, {"q": "33번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>This definition of art as copying reality has a problem, though.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>The ancient Greeks felt that the visual artist's goal was to copy visual experience.  ( ① ) This approach appears in the realism of ancient Greek sculpture and pottery.  ( ② ) Jackson Pollock, a leader in the New York School of the 1950's, intentionally did not copy existing objects in his art.  ( ③ ) While painting these works, Pollock and his fellow artists would consciously avoid making marks that resembled recognizable objects.  ( ④ ) They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis―simple copying― does not sufficiently define art.  ( ⑤ )</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 1, "explain": "This definition of art as copying reality는 앞에 나온 그리스인의 '모방' 관점을 받는다. 그 뒤에 문제점의 예로 Pollock이 등장한다.", "fixed": true}, {"q": "37번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>Later astronomers built on Copernicus' work.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Even before telescopes existed, people looked out into space and tried to understand the universe.  ( ① ) In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea: that it was Earth that traveled around the Sun, not the other way around.  ( ② ) Despite widespread objections, he published his theory in a book.  ( ③ ) Technological improvements led to the development of the telescope in the early 17th century.  ( ④ ) Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and confirmed that Copernicus' theory was correct.  ( ⑤ )</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 2, "explain": "Later astronomers built on Copernicus' work(이후 천문학자들이 그의 연구를 발전시켰다)는 코페르니쿠스가 책을 출판했다는 내용 뒤, 망원경 개발과 갈릴레이의 확인 앞에 와야 시간 순서가 맞다.", "fixed": true}, {"q": "39번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>However, the ants don't eat these leaves.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>With millions of members in a colony, leaf-cutter ants cultivate their own food. Just like humans, they're farmers.  ( ① ) Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest.  ( ② ) Instead, smaller worker ants chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground 'gardens.'  ( ③ ) The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat.  ( ④ ) Just like humans, they have perfected an agricultural civilization.  ( ⑤ )</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 1, "explain": "However, the ants don't eat these leaves는 잎을 둥지로 가져온다는 내용 뒤에 와야 하고, 이어서 Instead로 잎의 실제 용도(곰팡이 재배)가 나온다.", "fixed": true}, {"q": "32번 지문 · 글의 흐름으로 보아, 주어진 문장이 들어가기에 가장 적절한 곳은?<div class='mat-wrap'><div class='mat-label'>주어진 문장</div><div class='mat-box'>This may sound surprising, especially if you've ever felt overwhelmed by anger, fear, or sadness.</div></div><div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments.  ( ① ) But the Stoics taught that emotions aren't just automatic reactions.  ( ② ) They're shaped by how we interpret events.  ( ③ ) For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening.  ( ④ ) Change the judgment, and you change the emotion.  ( ⑤ ) This doesn't mean suppressing how you feel; it means examining the story you tell yourself.</div></div>", "choices": ["①", "②", "③", "④", "⑤"], "correct": 0, "explain": "This may sound surprising은 '감정이 판단에서 생긴다'는 첫 문장을 받는다. 이어서 But the Stoics taught ~로 설명이 계속된다.", "fixed": true}],
[{"q": "21번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>We are wonderfully made, yet we don't allow ourselves to participate in the wonder for which we were created. Instead of moving anywhere and everywhere, most of us spend our time moving nowhere. Many kids today are being held captive by 'smart' devices like phones and tablets. They are not going outside to play, they are not learning how to socialize and read physical cues from others. As a result they are not learning or building their movement repertoire, the very thing that will help them learn, communicate, create, and become emotionally mature. The point is we are getting further and further away from our <u>　　　　　　</u>. We were made to move ―and through movement, we are meant to live extraordinary lives.</div></div>", "choices": ["design", "technology", "family", "school", "goals"], "correct": 0, "explain": "아이들이 스마트 기기에 붙잡혀 움직이지 않는다는 내용 뒤에 '우리는 움직이도록 만들어졌다'가 이어진다. 따라서 우리가 본래의 설계(design)에서 점점 멀어지고 있다는 뜻이다."}, {"q": "23번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>It's important for humans to have many kinds of minds, because variation is critical for the survival of a species. One of Charles Darwin's greatest insights was that <u>　　　　　　</u> for natural selection to work. Think about it: If there's a huge change in the environment, like a catastrophic drop in the food supply, a species without much variation might be completely wiped out. A species with great variation will more likely have some survivors after any catastrophe. Thankfully, our species has many kinds of minds, both within a single culture and across cultures, so we're less likely to be wiped out. This variation preserves the evolvability of our species.</div></div>", "choices": ["variation is a prerequisite", "competition is an obstacle", "cooperation is a result", "stability is a requirement", "isolation is a condition"], "correct": 0, "explain": "글 전체가 다양성(variation)이 종의 생존에 중요하다고 말하므로, 다윈의 통찰은 '변이가 자연선택의 전제 조건'이라는 것이다."}, {"q": "30번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Keep your paragraphs short. Writing is visual ―it catches the eye before it has a chance to catch the brain. Short paragraphs put air around what you write and make it look inviting, whereas a long chunk of type can discourage a reader from even starting to read. Don't worry; the gains far outweigh the hazards. But don't go too far. A succession of tiny paragraphs is as <u>　　　　　　</u> as a paragraph that's too long. I'm thinking of all those tiny paragraphs ―verbless wonders― written by modern journalists trying to make their articles quick 'n' easy. Actually they make the reader's job harder by chopping up a natural train of thought.</div></div>", "choices": ["annoying", "inviting", "helpful", "rare", "natural"], "correct": 0, "explain": "But don't go too far 뒤에 이어지는 문장이므로, 너무 잘게 쪼갠 문단도 너무 긴 문단만큼 '짜증스럽다(annoying)'는 부정적 평가가 와야 한다."}, {"q": "32번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>One of the most fascinating and empowering insights in Stoic philosophy is that our emotions are not random; they arise from our judgments. This may sound surprising, especially if you've ever felt overwhelmed by anger, fear, or sadness. But the Stoics taught that emotions aren't just automatic reactions. They're shaped by how we interpret events. For example: If someone criticizes you, you may feel angry not due to the words themselves but because you perceive the comment as unfair or threatening. Change the judgment, and <u>　　　　　　</u>. This doesn't mean suppressing how you feel; it means examining the story you tell yourself.</div></div>", "choices": ["you change the emotion", "you forget the event", "you avoid the criticism", "you hide the feeling", "you repeat the story"], "correct": 0, "explain": "감정이 판단(해석)에서 생긴다는 것이 글의 요지이므로, 판단을 바꾸면 감정이 바뀐다는 말이 들어가야 한다."}, {"q": "34번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>If our bodies know best, why are they easily injured when we do something so seemingly natural as running? On the one hand, running seems very easy, but that is only because our bodies are <u>　　　　　　</u> at it. The most powerful supercomputer on the planet cannot administer the enormous number of computations it takes to run, untethered, on two legs. Because our running knowledge is buried so deeply within muscle fibres, cells and our DNA, we have to accept that we cannot fully explain its complexities. That doesn't mean our bodies don't know how to do it.</div></div>", "choices": ["so very good", "so very slow", "so very tired", "so very careless", "so very new"], "correct": 0, "explain": "달리기가 쉬워 보이는 이유를 설명하는 부분이다. 쉬워 보이는 것은 몸이 달리기를 아주 잘하기 때문이라는 뜻이 되어야 한다."}, {"q": "36번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>The central concerns of mathematics are not numbers, but patterns, structures, symmetries and connections. Take, for example, the Sudoku puzzles that appear daily in newspapers. The objective is to complete a 9 × 9 grid, while ensuring that each row, column and block contains all the digits from 1 to 9 once. But the numerical values of the digits are <u>　　　　　　</u>; what is important is that there are nine distinct symbols. They could be nine letters or nine shapes. It's the pattern that matters. One Irish daily paper publishes these puzzles with the statement 'There's no maths involved, simply use reasoning and logic!' If you can do Sudoku, you can do maths!</div></div>", "choices": ["irrelevant", "essential", "confusing", "increasing", "fixed"], "correct": 0, "explain": "뒤에 '중요한 것은 아홉 개의 서로 다른 기호가 있다는 것'이고 글자나 모양이어도 된다고 하므로, 숫자의 값 자체는 '상관없다(irrelevant)'."}, {"q": "38번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>To harness the full potential of units of measurement, we need some degree of consistency. Subjective measures contain useful knowledge, but this can be <u>　　　　　　</u>, based as it is on an individual's experience. The historian of science Theodore M. Porter describes measurement as a 'technology of distance': a tool that uses shared rules to bridge differences of culture and geography. If measurement is another sort of language, then just as with words, individual units need reliable definitions in order to communicate. Imagine a disagreement over trade or tribute: it is a moment of conflict that demands greater consistency in measurement.</div></div>", "choices": ["difficult to share", "easy to measure", "impossible to create", "useless to know", "simple to explain"], "correct": 0, "explain": "주관적 측정은 개인의 경험에 바탕을 두기 때문에 다른 사람과 '공유하기 어렵다'. 그래서 일관된 정의가 필요하다는 흐름이다."}, {"q": "40번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships. The system monitors other people's reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status. The monitoring system generally operates <u>　　　　　　</u> until it detects that our relational value is falling or low. When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation. It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance.</div></div>", "choices": ["nonconsciously", "loudly", "rarely", "randomly", "constantly aloud"], "correct": 0, "explain": "뒤에서 경보가 울리면 위협이 '의식으로' 밀려 올라온다고 했으므로, 그 전까지는 의식하지 못하는 상태(nonconsciously)로 작동한다."}, {"q": "39번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>With millions of members in a colony, leaf-cutter ants cultivate their own food. Just like humans, they're farmers. Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest. However, the ants don't eat these leaves. Instead, smaller worker ants chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground 'gardens.' The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat. Just like humans, they have perfected an <u>　　　　　　</u> civilization.</div></div>", "choices": ["agricultural", "industrial", "digital", "nomadic", "military"], "correct": 0, "explain": "가위개미가 잎으로 곰팡이를 길러 먹는 '농사'를 짓는다는 내용이므로, 농업(agricultural) 문명을 이뤘다는 말이 알맞다."}, {"q": "26번 지문 · 다음 빈칸에 들어갈 말로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Paul Farmer was an American medical anthropologist and physician. He was born in 1959 in Massachusetts and grew up with an early awareness of <u>　　　　　　</u>. After graduating from Duke University, he began volunteer work at a hospital in Cangé, Haiti. He later returned to the United States and earned both a master's degree and a PhD in medical anthropology at Harvard University. In 1987, he co-founded Partners In Health, an organization that works in countries like Haiti, Rwanda, and Peru to provide medical treatment and strengthen public health systems. He received many major awards during his career, and after his death, he was also honored with the WHO Director-General's Global Health Leaders Award for his lifelong work to improve health for the poor.</div></div>", "choices": ["social inequality", "modern media", "ancient history", "national security", "family tradition"], "correct": 0, "explain": "그는 가난한 사람들의 건강을 위해 평생 일한 인물이므로, 어려서부터 사회적 불평등을 의식했다는 내용이 자연스럽다."}],
[{"q": "18번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>We appreciate your support and cooperation in our school programs. We would like to share important information regarding this Friday's school field trip. Our school had originally planned an outdoor field trip to Dreamland Amusement Park. However, according to the latest weather forecast, extremely low temperatures are expected throughout Friday. Spending long hours outdoors under these conditions may be potentially unsafe for students. After careful consideration, we have decided to change the location. Instead of the amusement park, students will visit the City Science Museum, where they will participate in guided exhibitions and hands-on learning activities. We kindly ask for your understanding.</div></div>", "choices": ["기상 예보 때문에 현장 학습 장소가 바뀌었다", "현장 학습 날짜가 금요일에서 토요일로 바뀌었다", "놀이공원 입장권이 모두 팔렸다", "학생들은 과학관에서 강연만 듣는다", "현장 학습은 취소되었다"], "correct": 0, "explain": "매우 낮은 기온이 예보되어 장소를 놀이공원에서 시립 과학관으로 바꾸었다. 날짜 변경이나 취소는 없고, 과학관에서는 안내 전시와 체험 활동에 참여한다."}, {"q": "19번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Maggie stood up, her hands gripping the seat in front of her. She had never sung alone before, and as she opened her mouth to begin, her voice started shaking. A few children turned around to look at her, and her heart began to race. She focused hard on the lyrics, trying not to forget the words. Then she noticed movement beside her. Durwood quietly stood up and began to sing along. His voice was steady and calm, carrying the song forward. Maggie let out a breath she hadn't realized she was holding. The tightness in her shoulders slowly faded. With Durwood singing beside her, the tension in her chest eased. She continued the song, no longer frozen, and they finished it together.</div></div>", "choices": ["Durwood가 일어나 함께 노래를 불렀다", "Maggie는 전에 혼자 노래해 본 적이 많았다", "아이들은 Maggie에게 관심을 보이지 않았다", "Maggie는 노래를 중간에 그만두었다", "Durwood의 목소리는 떨리고 있었다"], "correct": 0, "explain": "Durwood가 조용히 일어나 함께 노래했고 그의 목소리는 차분했다. Maggie는 혼자 노래해 본 적이 없었고, 몇몇 아이가 돌아봤으며, 둘은 노래를 끝까지 함께 불렀다."}, {"q": "26번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Paul Farmer was an American medical anthropologist and physician. He was born in 1959 in Massachusetts and grew up with an early awareness of social inequality. After graduating from Duke University, he began volunteer work at a hospital in Cangé, Haiti. He later returned to the United States and earned both a master's degree and a PhD in medical anthropology at Harvard University. In 1987, he co-founded Partners In Health, an organization that works in countries like Haiti, Rwanda, and Peru to provide medical treatment and strengthen public health systems. He received many major awards during his career, and after his death, he was also honored with the WHO Director-General's Global Health Leaders Award for his lifelong work to improve health for the poor.</div></div>", "choices": ["Duke 대학교 졸업 후 아이티 병원에서 자원봉사를 했다", "1959년 하버드 대학교에서 박사 학위를 받았다", "Partners In Health를 혼자 설립했다", "의료 인류학 석사 학위는 받지 않았다", "사망 전에 WHO 상을 받았다"], "correct": 0, "explain": "Duke 졸업 후 아이티 Cangé의 병원에서 자원봉사를 시작했다. 1959년은 태어난 해이고, Partners In Health는 공동 설립했으며, WHO 상은 사후에 받았다."}, {"q": "29번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>To understand how breathing affects athletic performance, we first need to understand how the body makes energy from air and food. There are two options: with oxygen, a process known as aerobic respiration, and without it, which is called anaerobic respiration. Anaerobic energy is quicker and easier for our bodies to access, a kind of backup system when the body doesn't have enough oxygen. But anaerobic energy is inefficient and can be toxic, creating too much lactic acid. This explains why the first few minutes of an intense workout are often so miserable. This also explains why, after we're warmed up, exercise feels easier ―the body has switched from anaerobic to aerobic respiration.</div></div>", "choices": ["무산소 에너지는 몸이 산소가 부족할 때 쓰는 예비 체계와 같다", "유산소 호흡은 산소 없이 에너지를 만든다", "무산소 에너지는 효율적이고 독성이 없다", "운동 초반 몇 분은 가장 편안하다", "몸이 풀린 뒤에는 무산소 호흡으로 바뀐다"], "correct": 0, "explain": "무산소 에너지는 산소가 부족할 때 쓰는 예비 체계로, 빠르지만 비효율적이고 젖산을 만든다. 몸이 풀리면 무산소에서 유산소 호흡으로 바뀌어 운동이 쉬워진다."}, {"q": "35번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Our number one criterion for how we care for our pets should be, \"Is this what they actually need?\" rather than, \"What do I want?\" For example, we have encountered many dog owners who bathe their dogs religiously multiple times a week because they want to avoid the 'doggy' smell, but veterinary dermatologists warn against such practices, as they are not good for a dog's skin. Unless they have a skin condition for which a vet has prescribed medicated baths, most dogs don't need to be bathed on a regular basis. Even dogs with thick, heavy coats generally only need baths every 6 to 8 weeks.</div></div>", "choices": ["대부분의 개는 정기적으로 목욕시킬 필요가 없다", "수의 피부과 의사는 잦은 목욕을 권한다", "털이 두꺼운 개는 매주 목욕해야 한다", "개 냄새를 없애려면 매일 씻겨야 한다", "반려동물 돌봄의 기준은 주인의 취향이다"], "correct": 0, "explain": "피부병으로 약용 목욕을 처방받은 경우가 아니면 대부분의 개는 정기적인 목욕이 필요 없고, 털이 두꺼운 개도 6~8주마다면 충분하다."}, {"q": "36번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>The central concerns of mathematics are not numbers, but patterns, structures, symmetries and connections. Take, for example, the Sudoku puzzles that appear daily in newspapers. The objective is to complete a 9 × 9 grid, while ensuring that each row, column and block contains all the digits from 1 to 9 once. But the numerical values of the digits are irrelevant; what is important is that there are nine distinct symbols. They could be nine letters or nine shapes. It's the pattern that matters. One Irish daily paper publishes these puzzles with the statement 'There's no maths involved, simply use reasoning and logic!' If you can do Sudoku, you can do maths!</div></div>", "choices": ["스도쿠에서 숫자 대신 글자나 모양을 써도 된다", "수학의 핵심은 숫자 계산이다", "스도쿠는 10 × 10 격자를 채운다", "아일랜드 신문은 스도쿠에 수학이 필요하다고 했다", "스도쿠는 매주 한 번 신문에 실린다"], "correct": 0, "explain": "숫자의 값은 상관없고 아홉 개의 서로 다른 기호만 있으면 되므로 글자나 모양이어도 된다. 격자는 9 × 9이고, 신문은 '수학이 필요 없다'고 했으며 퍼즐은 매일 실린다."}, {"q": "37번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>Even before telescopes existed, people looked out into space and tried to understand the universe. In Europe, a 16th-century Polish mathematician named Nicolaus Copernicus put forth a revolutionary idea: that it was Earth that traveled around the Sun, not the other way around. Despite widespread objections, he published his theory in a book. Later astronomers built on Copernicus' work. Technological improvements led to the development of the telescope in the early 17th century. Using a telescope, the Italian scientist Galileo Galilei discovered the four largest moons of Jupiter and confirmed that Copernicus' theory was correct.</div></div>", "choices": ["갈릴레이는 망원경으로 목성의 가장 큰 위성 네 개를 발견했다", "코페르니쿠스는 이탈리아의 과학자였다", "코페르니쿠스는 반대 때문에 책을 내지 않았다", "망원경은 16세기 초에 발명되었다", "갈릴레이는 코페르니쿠스의 이론이 틀렸다고 밝혔다"], "correct": 0, "explain": "갈릴레이는 망원경으로 목성의 가장 큰 위성 4개를 발견하고 지동설이 옳음을 확인했다. 코페르니쿠스는 폴란드 수학자이며, 반대에도 책을 냈고, 망원경은 17세기 초에 개발되었다."}, {"q": "39번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>With millions of members in a colony, leaf-cutter ants cultivate their own food. Just like humans, they're farmers. Some of the ants set forth from the nest to find fresh vegetation; when they find it, they chew off large pieces that they carry back to the nest. However, the ants don't eat these leaves. Instead, smaller worker ants chew them into smaller pieces, and use these as fertilizer to grow fungus in large underground 'gardens.' The ants feed the fungus, and the fungus blossoms into small fruiting bodies which the ants later eat. Just like humans, they have perfected an agricultural civilization.</div></div>", "choices": ["가위개미는 잘게 씹은 잎으로 곰팡이를 기른다", "가위개미는 가져온 잎을 바로 먹는다", "곰팡이 정원은 나무 위에 있다", "큰 일개미가 잎을 잘게 씹는다", "가위개미 군락의 구성원은 수백 마리이다"], "correct": 0, "explain": "작은 일개미가 잎을 잘게 씹어 비료로 삼아 땅속 '정원'에서 곰팡이를 기르고, 곰팡이의 열매를 먹는다. 잎은 직접 먹지 않으며 군락은 수백만 마리이다."}, {"q": "40번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>From an evolutionary perspective, self-esteem has developed as a monitoring mechanism for the quality of our relationships. The system monitors other people's reactions to our behaviors and sends an alarm that alerts us to any possible changes in our inclusion status. The monitoring system generally operates nonconsciously until it detects that our relational value is falling or low. When the alarm bell rings, the threat to our social bonds is pushed into conscious awareness and we evaluate the situation. It also makes sense that we would develop specific mechanisms to attend to minimizing rejection and enhancing acceptance.</div></div>", "choices": ["자존감은 관계의 질을 감시하는 장치로 발달했다", "감시 체계는 항상 의식적으로 작동한다", "경보가 울리면 위협은 무의식으로 밀려난다", "자존감은 다른 사람의 반응과 관계없다", "거절을 늘리는 방향으로 기제가 발달했다"], "correct": 0, "explain": "진화적으로 자존감은 관계의 질을 감시하는 장치이다. 평소에는 무의식적으로 작동하다가 경보가 울리면 의식으로 떠오르며, 거절을 줄이고 수용을 높이는 기제가 발달했다."}, {"q": "33번 지문 · 다음 글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>The ancient Greeks felt that the visual artist's goal was to copy visual experience. This approach appears in the realism of ancient Greek sculpture and pottery. This definition of art as copying reality has a problem, though. Jackson Pollock, a leader in the New York School of the 1950's, intentionally did not copy existing objects in his art. While painting these works, Pollock and his fellow artists would consciously avoid making marks that resembled recognizable objects. They succeeded at making artwork that did not copy anything, thus demonstrating that the ancient Greek view of art as mimesis―simple copying― does not sufficiently define art.</div></div>", "choices": ["Pollock은 알아볼 수 있는 대상과 닮은 표시를 일부러 피했다", "고대 그리스인은 예술이 현실을 모방해서는 안 된다고 보았다", "Pollock은 1850년대 뉴욕파의 지도자였다", "Pollock의 작품은 기존 사물을 사실적으로 모사했다", "이 글은 모방론이 예술을 충분히 정의한다고 본다"], "correct": 0, "explain": "Pollock과 동료들은 알아볼 수 있는 대상과 닮은 표시를 의식적으로 피했다. 그리스인은 모방을 예술의 목표로 보았고, Pollock은 1950년대 인물이며, 글은 모방론이 예술을 충분히 정의하지 못한다고 말한다."}]

[{"type": "order", "num": 41, "q": "41~42번 지문", "sents": ["The role of ‘slang’ in popular culture has fundamentally changed because of the internet.", "Since the emergence of Standard English, the rule makers of language have been in charge, and their prescriptive norms about a ‘correct’ version of the English language have dominated our channels of communication.", "If you wanted your voice to be heard by the public, you had to work within their limits, conforming to the strict expectations of either print or broadcast media.", "Social media completely broke that barrier.", "The playing field is now level, and public access is democratized.", "Anybody and everybody can become a public figure on the new communicative platforms, meaning that nobody’s left to enforce the old rules.", "TV presenters and journalists might not have been able to use slang, but content creators can.", "We regularly use words like ‘function’ and ‘side-eye,’ and our influence both legitimizes these terms and gives them a large platform to spread quicker than they could have before.", "Content creators also come from a greater variety of backgrounds than people working in traditional media.", "This means that slang can more naturally go beyond the economic and social barriers that once limited its growth.", "The loose social networks that previously connected us geographically are simply stronger online, and memes are now transmitted at rapid pace."], "hint": "인터넷·소셜 미디어가 바꾼 슬랭의 역할", "explain": "흐름: 주제(인터넷이 슬랭의 역할을 바꿈) → 과거(표준 영어 규범이 의사소통을 지배, 매체에 순응) → 전환(Social media broke that barrier) → 민주화 → 콘텐츠 제작자의 슬랭 사용과 확산 → 다양한 배경 → 강해진 온라인 네트워크와 빠른 밈 전파. that barrier, their limits 같은 지시어가 단서예요."}, {"q": "41번 · 윗글의 제목으로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>The role of ‘slang’ in popular culture has fundamentally changed because of the internet. Since the emergence of Standard English, the rule makers of language have been in charge, and their prescriptive norms about a ‘correct’ version of the English language have dominated our channels of communication. If you wanted your voice to be heard by the public, you had to work within their limits, conforming to the strict expectations of either print or broadcast media. Social media completely broke that barrier. The playing field is now level, and public access is democratized. Anybody and everybody can become a public figure on the new communicative platforms, meaning that nobody’s left to enforce the old rules. TV presenters and journalists might not have been able to use slang, but content creators can. We regularly use words like ‘function’ and ‘side-eye,’ and our influence both legitimizes these terms and gives them a large platform to spread quicker than they could have before. Content creators also come from a greater variety of backgrounds than people working in traditional media. This means that slang can more naturally go beyond the economic and social barriers that once limited its growth. The loose social networks that previously connected us geographically are simply stronger online, and memes are now transmitted at rapid pace.</div></div>", "choices": ["When Slang Meets New Media", "Slang: Respected Throughout History", "Content Creators, Use Standard Language!", "Break the Barrier Between Social Networks", "How Language Evolves in Traditional Media"], "correct": 0, "explain": "인터넷과 소셜 미디어가 표준 영어 규범의 장벽을 허물고, 콘텐츠 제작자들이 슬랭을 퍼뜨리며 슬랭의 역할이 바뀌었다는 글이므로 ① '슬랭이 새로운 매체를 만났을 때'가 알맞다."}, {"q": "42번 · 밑줄 친 (a)~(e) 중에서 문맥상 낱말의 쓰임이 적절하지 않은 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>The role of ‘slang’ in popular culture has fundamentally changed because of the internet. Since the emergence of Standard English, the rule makers of language have been in charge, and their prescriptive norms about a ‘correct’ version of the English language have dominated our <u>(a) channels</u> of communication. If you wanted your voice to be heard by the public, you had to work <u>(b) within</u> their limits, conforming to the strict expectations of either print or broadcast media. Social media completely broke that barrier. The playing field is now level, and public access is democratized. Anybody and everybody can become a public figure on the new communicative platforms, meaning that nobody’s left to <u>(c) enforce</u> the old rules. TV presenters and journalists might not have been able to use slang, but content creators can. We regularly use words like ‘function’ and ‘side-eye,’ and our influence both legitimizes these terms and gives them a large platform to spread quicker than they could have before. Content creators also come from a <u>(d) greater</u> variety of backgrounds than people working in traditional media. This means that slang can more naturally go beyond the economic and social barriers that once limited its growth. The loose social networks that previously connected us geographically are simply <u>(e) weaker</u> online, and memes are now transmitted at rapid pace.</div></div>", "choices": ["(a) channels", "(b) within", "(c) enforce", "(d) greater", "(e) weaker"], "correct": 4, "fixed": true, "explain": "온라인에서 밈이 빠르게 전파된다고 했으므로, 지리적으로 연결하던 느슨한 사회적 네트워크가 온라인에서는 더 '강하다(stronger)'가 되어야 한다. weaker는 흐름과 반대이다."}, {"q": "41~42번 · 윗글의 내용과 일치하는 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'>The role of ‘slang’ in popular culture has fundamentally changed because of the internet. Since the emergence of Standard English, the rule makers of language have been in charge, and their prescriptive norms about a ‘correct’ version of the English language have dominated our channels of communication. If you wanted your voice to be heard by the public, you had to work within their limits, conforming to the strict expectations of either print or broadcast media. Social media completely broke that barrier. The playing field is now level, and public access is democratized. Anybody and everybody can become a public figure on the new communicative platforms, meaning that nobody’s left to enforce the old rules. TV presenters and journalists might not have been able to use slang, but content creators can. We regularly use words like ‘function’ and ‘side-eye,’ and our influence both legitimizes these terms and gives them a large platform to spread quicker than they could have before. Content creators also come from a greater variety of backgrounds than people working in traditional media. This means that slang can more naturally go beyond the economic and social barriers that once limited its growth. The loose social networks that previously connected us geographically are simply stronger online, and memes are now transmitted at rapid pace.</div></div>", "choices": ["콘텐츠 제작자는 전통 매체 종사자보다 다양한 배경 출신이다", "소셜 미디어 등장 이후 표준 영어의 규범이 더 강해졌다", "TV 진행자와 기자는 슬랭을 자유롭게 사용했다", "소셜 미디어 이전에는 누구나 쉽게 대중에게 목소리를 낼 수 있었다", "온라인에서는 밈이 이전보다 느리게 전파된다"], "correct": 0, "explain": "콘텐츠 제작자는 전통 매체 종사자보다 더 다양한 배경 출신이라고 했다. 소셜 미디어가 규범의 장벽을 허물었고, TV 진행자·기자는 슬랭을 못 썼을 수 있으며, 과거에는 매체의 기대에 순응해야 했고, 밈은 빠르게 전파된다."}, {"q": "43번 · 주어진 글 (A)에 이어질 내용을 순서에 맞게 배열한 것으로 가장 적절한 것은?<div class='mat-wrap'><div class='mat-label'>지문</div><div class='mat-box'><b>(A)</b> Once upon a time in Persia, there was a merchant who traveled the world for his business. On one of his journeys to India, he received a beautiful parrot as a gift and named him Tuti. He loved Tuti deeply and put him in a shiny golden cage. Days passed, but no matter how much the merchant cared for his parrot, the colorful bird seemed sad. Before leaving for India again, the merchant asked Tuti, “What present would you like me to bring from India?”<br><br><b>(B)</b> Shocked and with tears trickling down his face, the merchant held Tuti in his arms. Suddenly, he flew and escaped through a window into the garden. “Why are you acting like this?” he asked Tuti. “This is a trick my friend taught me to regain my freedom by playing dead. You are a good master, but I am a bird and I wish to be free, not live my life in a cage,” answered Tuti. The merchant realized that freedom mattered more than all the wealth in the world and he was happy to have the company of two beautiful parrots occasionally.<br><br><b>(C)</b> The moment the merchant finished the last sentence, Tuti’s friend began to tremble and fell down dead. He couldn’t believe his eyes. “How can I tell this sad news to Tuti?” he said. A few days later, he arrived home and went straight to Tuti. “Did you give my message to my friend?” his parrot asked him happily. The merchant told him the whole story. The moment he finished, Tuti trembled and fell down dead, just like the parrot in India.<br><br><b>(D)</b> “When you see the parrots of India, look for my friend and tell her all about me. Tell her that I would love to see her, but I can’t because I live in a cage,” Tuti answered. The merchant loved his parrot so much that he couldn’t imagine letting him out of the cage for fear of losing him, but he promised to deliver the message and then left to go on his trip. At the end of his visit to India, he found Tuti’s friend and repeated Tuti’s exact words.</div></div>", "choices": ["(B) − (D) − (C)", "(C) − (B) − (D)", "(C) − (D) − (B)", "(D) − (B) − (C)", "(D) − (C) − (B)"], "correct": 4, "fixed": true, "explain": "(A) 끝의 '인도에서 무슨 선물을 가져올까?' 질문에 대한 Tuti의 대답이 (D)이다. (D) 끝에서 친구에게 말을 전하자 친구가 쓰러지는 장면이 (C)이고, (C) 끝의 Tuti가 쓰러진 것에 충격받는 장면이 (B)이다. 따라서 (D)−(C)−(B)."}, {"type": "order", "num": 43, "q": "43~45번 지문 앞부분 (A)·(D)", "sents": ["Once upon a time in Persia, there was a merchant who traveled the world for his business.", "On one of his journeys to India, he received a beautiful parrot as a gift and named him Tuti.", "He loved Tuti deeply and put him in a shiny golden cage.", "Days passed, but no matter how much the merchant cared for his parrot, the colorful bird seemed sad.", "Before leaving for India again, the merchant asked Tuti, “What present would you li [{"q": "변이가 나타나는 과정을 옳게 나타낸 것은?", "choices": ["유전자의 차이 → 합성되는 단백질의 종류와 양의 차이 → 형질의 차이", "형질의 차이 → 유전자의 차이 → 단백질의 차이", "단백질의 차이 → 환경의 차이 → 유전자의 차이", "환경의 차이 → 형질의 차이 → 유전자의 차이", "형질의 차이 → 단백질의 차이 → 유전자의 차이"], "correct": 0, "explain": "개체가 가진 유전자가 다르면 합성되는 단백질의 종류와 양이 달라지고, 그 결과 형질의 차이(변이)가 나타난다."}, {"q": "밝은색 깃털을 가진 비둘기와 어두운색 깃털을 가진 비둘기 사이에서 밝고 어두운 얼룩을 가진 비둘기가 태어났다. 이 변이의 원인으로 가장 적절한 것은?", "choices": ["유성생식 과정에서 생식세포의 다양한 조합", "돌연변이", "환경에 의한 변화", "생존경쟁", "용불용"], "correct": 0, "explain": "부모의 유전자가 생식세포 형성과 수정 과정에서 다양하게 조합되어 부모와 다른 형질의 자손이 태어난 것이다. 부모에게 없던 새로운 형질이 생긴 경우는 돌연변이이다."}, {"q": "포식자가 있는 환경에서 자연선택이 일어나는 과정을 순서대로 나열한 것은?<div class='mat-wrap'><div class='mat-label'>자료</div><div class='mat-box'>(가) 포식자의 눈에 덜 띄는 개체가 더 잘 살아남는다.<br>(나) 같은 종의 무리에 다양한 형질을 가진 개체가 존재한다.<br>(다) 살아남은 개체의 형질이 자손에게 전달되어 그 형질을 가진 개체수가 증가한다.<br>(라) 포식자의 눈에 잘 띄는 개체가 높은 비율로 잡아먹힌다.</div></div>", "choices": ["(나) → (라) → (가) → (다)", "(가) → (나) → (다) → (라)", "(나) → (가) → (라) → (다)", "(라) → (나) → (가) → (다)", "(다) → (나) → (라) → (가)"], "correct": 0, "explain": "먼저 다양한 형질이 있고(나), 눈에 띄는 개체가 잡아먹히며(라), 덜 띄는 개체가 살아남아(가), 그 형질이 자손에게 전해져 늘어난다(다)."}, {"q": "항생제 내성 세균의 증가에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 항생제 내성 세균은 항생제를 사용한 뒤에 항생제 때문에 생겨났다.<br>ㄴ. 항생제를 계속 사용하면 집단에서 내성 세균의 비율이 증가한다.<br>ㄷ. 항생제는 자연선택이 일어나게 하는 환경 요인으로 작용한다.</div></div>", "choices": ["ㄴ, ㄷ", "ㄱ, ㄷ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ"], "correct": 0, "explain": "내성 세균은 항생제 사용 전부터 돌연변이로 존재했으며 항생제가 만든 것이 아니다(ㄱ 틀림). 항생제가 내성 없는 세균을 없애는 환경 요인이 되어(ㄷ) 내성 세균의 비율이 늘어난다(ㄴ)."}, {"q": "갈라파고스 제도의 핀치에서 섬의 먹이 환경과 자연선택된 부리의 짝으로 옳은 것은?", "choices": ["크고 단단한 씨가 많은 섬 – 크고 두꺼운 부리", "크고 단단한 씨가 많은 섬 – 가늘고 뾰족한 부리", "곤충이 많은 섬 – 크고 두꺼운 부리", "선인장이 많은 섬 – 짧고 뭉툭한 부리", "모든 섬 – 같은 모양의 부리"], "correct": 0, "explain": "크고 단단한 씨를 깨려면 크고 두꺼운 부리가, 선인장을 먹으려면 길고 뾰족한 부리가 유리하다. 섬마다 먹이가 달라 서로 다른 부리가 자연선택되었다."}, {"q": "갈라파고스 제도 핀치의 진화에 대한 설명으로 옳지 않은 것은?", "choices": ["섬마다 핀치가 먹이에 맞추기 위해 스스로 부리 모양을 바꾸었다", "처음에는 한 종의 핀치 무리가 제도로 날아들었다", "핀치 무리에는 다양한 변이가 있었다", "먹이와 서식지를 두고 생존경쟁이 일어났다", "서로 다른 방향으로 자연선택되어 여러 종으로 진화하였다"], "correct": 0, "explain": "핀치가 스스로 부리를 바꾼 것이 아니라, 원래 있던 다양한 부리 중 그 섬의 먹이에 유리한 부리를 가진 개체가 자연선택된 것이다."}, {"q": "자연선택설에 따른 진화에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 개체마다 환경에 적응하는 능력이 다르다.<br>ㄴ. 지구의 환경이 변하면 진화의 방향도 변할 수 있다.<br>ㄷ. 한 개체가 살면서 얻은 형질은 모두 자손에게 전달된다.</div></div>", "choices": ["ㄱ, ㄴ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄷ"], "correct": 0, "explain": "변이가 있어 개체마다 적응 능력이 다르고(ㄱ), 환경이 바뀌면 유리한 형질도 달라져 진화 방향이 바뀐다(ㄴ). 살면서 얻은 형질은 유전되지 않으므로 ㄷ은 틀리다."}, {"q": "개구리 한 마리가 한 번에 수천 개의 알을 낳지만, 그중 어른 개구리로 자라는 것은 극히 일부이다. 이 사례와 가장 관련 깊은 자연선택설의 단계는?", "choices": ["과잉 생산", "변이", "유전", "돌연변이", "종 분화"], "correct": 0, "explain": "생물은 환경에서 살아남을 수 있는 것보다 훨씬 많은 자손을 낳는데, 이를 과잉 생산이라고 한다. 과잉 생산된 개체들 사이에서 생존경쟁이 일어난다."}, {"q": "자손에게 전달될 수 있는 변이만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 돌연변이로 푸른 공작 무리에서 태어난 흰색 공작의 깃털 색<br>ㄴ. 생식세포의 조합으로 태어난 얼룩 비둘기의 깃털 무늬<br>ㄷ. 사고로 잘린 고양이의 짧은 꼬리</div></div>", "choices": ["ㄱ, ㄴ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄷ"], "correct": 0, "explain": "돌연변이(ㄱ)와 생식세포의 조합(ㄴ)으로 생긴 변이는 유전자에 바탕을 두므로 자손에게 전달될 수 있다. 사고로 생긴 변화(ㄷ)는 유전자가 바뀌지 않아 전달되지 않는다."}, {"q": "지구에 다양한 생물이 나타나게 된 까닭으로 가장 적절한 것은?", "choices": ["다양한 환경에서 생물이 서로 다른 방향으로 오랫동안 자연선택되었기 때문", "모든 생물이 같은 환경에서 같은 방향으로 자연선택되었기 때문", "생물이 필요에 따라 스스로 형질을 만들었기 때문", "변이가 없는 집단에서 진화가 빠르게 일어났기 때문", "한 세대 만에 새로운 종이 만들어지기 때문"], "correct": 0, "explain": "지구의 다양한 환경에서 생물은 서로 다른 방향으로 자연선택되었고, 이 과정이 오랫동안 반복되어 다양한 생물이 나타났다."}],
[{"q": "다음 반응에서 산화되는 물질과 환원되는 물질을 옳게 짝 지은 것은?<div class='mat-wrap'><div class='mat-label'>반응식</div><div class='mat-box'>ZnO + C → Zn + CO</div></div>", "choices": ["산화: C / 환원: ZnO", "산화: ZnO / 환원: C", "산화: Zn / 환원: CO", "산화: CO / 환원: Zn", "산화: C / 환원: Zn"], "correct": 0, "explain": "탄소는 산소를 얻어 일산화 탄소가 되므로 산화되고, 산화 아연은 산소를 잃고 아연이 되므로 환원된다."}, {"q": "산화 구리(Ⅱ)와 탄소 가루를 섞어 시험관에서 충분히 가열하였다. 반응 전과 후 시험관 속 고체의 전체 질량 변화로 옳은 것은?", "choices": ["감소한다", "증가한다", "변하지 않는다", "증가했다가 다시 감소한다", "2배가 된다"], "correct": 0, "explain": "2CuO + C → 2Cu + CO₂에서 생성된 이산화 탄소 기체가 시험관 밖으로 빠져나가므로 시험관 속 고체의 질량은 감소한다."}, {"q": "마그네슘 리본 3 g을 공기 중에서 완전히 연소시켰더니 흰색 고체 x g이 남았다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 마그네슘은 환원된다.<br>ㄴ. x < 3이다.<br>ㄷ. 마그네슘의 연소에는 산소가 관여한다.</div></div>", "choices": ["ㄷ", "ㄱ", "ㄴ, ㄷ", "ㄴ", "ㄱ, ㄴ, ㄷ"], "correct": 0, "explain": "마그네슘은 산소와 결합해 산화 마그네슘이 되므로 산화된다(ㄱ 틀림). 결합한 산소만큼 질량이 늘어 x > 3이다(ㄴ 틀림). 연소에는 산소가 관여한다(ㄷ)."}, {"q": "다음 반응에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>반응식</div><div class='mat-box'>4Na + O₂ → 2Na₂O</div></div><div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. Na은 전자를 얻는다.<br>ㄴ. O₂는 환원된다.<br>ㄷ. 산화·환원 반응이다.</div></div>", "choices": ["ㄴ, ㄷ", "ㄱ, ㄷ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ"], "correct": 0, "explain": "나트륨은 전자를 잃고 Na⁺가 되므로 산화되고(ㄱ 틀림), 산소는 전자를 얻어 환원된다(ㄴ). 전자가 이동하므로 산화·환원 반응이다(ㄷ)."}, {"q": "푸른색 염화 구리(Ⅱ) 수용액에 알루미늄 포일을 넣었더니 푸른색이 옅어지고 포일 표면에 구리가 석출되었다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>반응식</div><div class='mat-box'>2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu</div></div><div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 알루미늄은 산화된다.<br>ㄴ. 전자는 구리 이온에서 알루미늄으로 이동한다.<br>ㄷ. 수용액 속 양이온 수는 일정하다.</div></div>", "choices": ["ㄱ", "ㄱ, ㄴ, ㄷ", "ㄷ", "ㄱ, ㄴ", "ㄴ, ㄷ"], "correct": 0, "explain": "알루미늄은 전자를 잃고 Al³⁺가 되므로 산화된다(ㄱ). 전자는 알루미늄에서 구리 이온으로 이동한다(ㄴ 틀림). Cu²⁺ 3개가 줄 때 Al³⁺ 2개가 생기므로 양이온 수는 감소한다(ㄷ 틀림)."}, {"q": "묽은 염산에 마그네슘 조각을 넣었을 때 일어나는 변화에 대한 설명으로 옳지 않은 것은?<div class='mat-wrap'><div class='mat-label'>반응식</div><div class='mat-box'>Mg + 2H⁺ → Mg²⁺ + H₂</div></div>", "choices": ["Mg²⁺ 1개가 생성될 때 이동하는 전자는 1개이다", "H⁺은 환원된다", "Mg은 전자를 잃는다", "Mg 조각의 질량은 감소한다", "수용액 속 양이온 수는 감소한다"], "correct": 0, "explain": "마그네슘 원자 1개는 전자 2개를 잃고 Mg²⁺가 되므로 이동하는 전자는 2개이다. H⁺ 2개가 사라지고 Mg²⁺ 1개가 생기므로 양이온 수는 감소한다."}, {"q": "산화·환원 반응의 정의에 대한 설명으로 옳은 것은?", "choices": ["산소가 이동하는 반응도 전자의 이동으로 설명할 수 있으므로, 전자의 이동에 의한 정의가 더 넓은 개념이다", "산소의 이동에 의한 정의가 전자의 이동에 의한 정의보다 넓다", "산소가 관여하지 않으면 산화·환원 반응이 아니다", "전자를 얻는 반응을 산화라고 한다", "산화와 환원은 따로따로 일어날 수 있다"], "correct": 0, "explain": "산소가 이동하는 산화·환원 반응은 모두 전자의 이동으로도 설명할 수 있다. 반면 Na과 Cl₂의 반응처럼 산소 없이 전자만 이동하는 반응도 있으므로 전자에 의한 정의가 더 넓다."}, {"q": "자동차의 촉매 변환기에서는 일산화 질소와 일산화 탄소가 반응하여 질소와 이산화 탄소가 생성된다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>반응식</div><div class='mat-box'>2NO + 2CO → N₂ + 2CO₂</div></div><div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 일산화 질소는 산화된다.<br>ㄴ. 산소는 일산화 질소에서 일산화 탄소로 이동한다.<br>ㄷ. 생성된 기체 중 하나는 석회수를 뿌옇게 흐리게 한다.</div></div>", "choices": ["ㄴ, ㄷ", "ㄱ, ㄷ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ"], "correct": 0, "explain": "일산화 질소는 산소를 잃고 질소가 되므로 환원된다(ㄱ 틀림). 산소는 NO에서 CO로 이동해 CO₂가 되며(ㄴ), 이산화 탄소는 석회수를 뿌옇게 흐린다(ㄷ)."}, {"q": "녹슨 은 숟가락(녹: Ag₂S)을 알루미늄 포일 위에 놓고 제빵 소다를 넣은 물과 함께 끓이면 녹이 제거된다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>반응식</div><div class='mat-box'>aAl + bAg₂S → Al₂S₃ + cAg (a~c는 반응 계수)</div></div><div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. Al은 전자를 잃는다.<br>ㄴ. a + b + c = 11이다.<br>ㄷ. 녹이 제거될 때 산화·환원 반응이 일어난다.</div></div>", "choices": ["ㄱ, ㄴ, ㄷ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ"], "correct": 0, "explain": "계수를 맞추면 2Al + 3Ag₂S → Al₂S₃ + 6Ag이므로 a+b+c = 2+3+6 = 11이다(ㄴ). 알루미늄은 전자를 잃어 산화되고(ㄱ), 은 이온은 전자를 얻어 은으로 환원된다(ㄷ)."}, {"q": "다음은 대기 오염 물질인 질소 산화물이 만들어지는 과정이다. 이에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>자료</div><div class='mat-box'>(가) 고온의 자동차 엔진에서 질소와 산소가 반응하여 일산화 질소(NO)가 생성된다.<br>(나) 일산화 질소와 산소가 반응하여 이산화 질소(NO₂)가 생성된다.</div></div><div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. (가)를 화학 반응식으로 나타내면 N₂ + O₂ → 2NO이다.<br>ㄴ. (나)에서 일산화 질소는 산소를 잃는다.<br>ㄷ. 질소 산화물을 환원시켜 질소로 만들면 대기 오염을 줄일 수 있다.</div></div>", "choices": ["ㄱ, ㄷ", "ㄱ", "ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "correct": 0, "explain": "(가)의 반응식은 N₂ + O₂ → 2NO이다(ㄱ). (나)에서 일산화 질소는 산소를 얻어 이산화 질소가 되므로 산화된다(ㄴ 틀림). 질소 산화물을 환원시켜 질소로 만들면 오염을 줄일 수 있다(ㄷ)."}],
[{"q": "광합성이 지구의 자연사에 미친 영향을 순서대로 옳게 나열한 것은?<div class='mat-wrap'><div class='mat-label'>자료</div><div class='mat-box'>(가) 오존층 형성 (나) 남세균의 광합성으로 산소 발생 (다) 육상 생물 출현 (라) 대기 중 산소 농도 증가</div></div>", "choices": ["(나) → (라) → (가) → (다)", "(라) → (나) → (가) → (다)", "(나) → (가) → (라) → (다)", "(가) → (나) → (라) → (다)", "(나) → (라) → (다) → (가)"], "correct": 0, "explain": "남세균의 광합성으로 산소가 발생해(나) 대기 중 산소 농도가 증가하고(라), 오존층이 형성되어(가) 자외선이 차단되면서 육상 생물이 출현했다(다)."}, {"q": "프로페인이 완전 연소하는 반응이다. 프로페인 분자 1개가 완전 연소할 때 생성되는 물 분자의 수는?<div class='mat-wrap'><div class='mat-label'>반응식</div><div class='mat-box'>C₃H₈ + 5O₂ → 3CO₂ + ( ㉠ )H₂O</div></div>", "choices": ["4개", "3개", "5개", "8개", "2개"], "correct": 0, "explain": "프로페인 분자의 수소 원자 8개가 모두 물로 가므로 H₂O는 4개가 생성된다. 이때 프로페인은 산화되고 산소는 환원된다."}, {"q": "메테인의 연소 반응에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>반응식</div><div class='mat-box'>aCH₄ + bO₂ → cCO₂ + dH₂O (a~d는 가장 간단한 정수)</div></div><div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. a + b > c + d이다.<br>ㄴ. 메테인은 산화된다.<br>ㄷ. 반응이 일어날 때 열이 방출된다.</div></div>", "choices": ["ㄴ, ㄷ", "ㄱ, ㄷ", "ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄱ"], "correct": 0, "explain": "반응식은 CH₄ + 2O₂ → CO₂ + 2H₂O이므로 a+b = 3, c+d = 3으로 같다(ㄱ 틀림). 메테인은 산소를 얻어 산화되며(ㄴ), 연소할 때 열이 방출된다(ㄷ)."}, {"q": "식물에서 일어나는 광합성과 세포호흡에 대한 설명으로 옳은 것은?", "choices": ["광합성에는 빛에너지가 필요하며, 이산화 탄소가 환원된다", "세포호흡에서는 이산화 탄소가 흡수되고 산소가 방출된다", "광합성에서 포도당이 산화된다", "세포호흡은 엽록체에서 일어난다", "광합성은 산화·환원 반응이 아니다"], "correct": 0, "explain": "광합성은 엽록체에서 빛에너지로 이산화 탄소와 물을 포도당과 산소로 바꾸며, 이산화 탄소가 환원된다. 세포호흡은 마이토콘드리아에서 포도당을 산화시켜 에너지를 얻고 이산화 탄소를 내놓는다."}, {"q": "철이 녹스는 것을 막는 방법으로 적절하지 않은 것은?", "choices": ["철 제품을 소금물에 담가 둔다", "철 표면에 페인트를 칠한다", "철 표면에 기름을 바른다", "철 표면을 다른 금속으로 도금한다", "철을 습기가 적은 곳에 보관한다"], "correct": 0, "explain": "철은 산소와 물(수분)에 닿으면 녹슬며, 소금물은 녹스는 것을 더 빠르게 한다. 페인트, 기름, 도금, 건조한 보관은 산소와 수분을 막는 방법이다."}, {"q": "휴대 전화의 리튬 배터리에 대한 설명으로 옳은 것은?", "choices": ["충전 과정에서 리튬이 전자를 잃고 산화된 다음 이동한다", "충전은 산화·환원 반응과 관계없다", "배터리 안에서 중화 반응이 일어난다", "충전할 때 이산화 탄소가 발생한다", "리튬은 충전 과정에서 전자를 얻어 산화된다"], "correct": 0, "explain": "리튬 배터리는 리튬이 전자를 잃고 산화된 다음 양극에서 음극으로 이동하며 충전된다. 우리 주변의 산화·환원 반응을 이용한 예이다."}, {"q": "불이 붙은 양초에 유리컵을 씌웠더니 잠시 후 불이 꺼졌다. 이에 대한 설명으로 옳은 것은?", "choices": ["양초의 연소에는 산소가 필요한데, 컵 안의 산소가 줄어 불이 꺼졌다", "양초가 연소하면 산소가 생성된다", "양초의 파라핀은 연소할 때 환원된다", "양초의 연소로 수소 기체만 생성된다", "양초의 연소는 산화·환원 반응이 아니다"], "correct": 0, "explain": "양초의 주성분인 파라핀은 산소와 반응해 이산화 탄소와 수증기를 만드는 연소(산화) 반응을 한다. 컵 안의 산소가 줄어들면 연소가 계속될 수 없어 불이 꺼진다."}, {"q": "다음은 철의 제련 과정의 일부이다. 이에 대한 설명으로 옳지 않은 것은?<div class='mat-wrap'><div class='mat-label'>자료</div><div class='mat-box'>(가) 2C + O₂ → 2CO<br>(나) Fe₂O₃ + 3CO → 2Fe + 3CO₂</div></div>", "choices": ["(가)에서 C는 환원된다", "(가)에서 코크스가 불완전 연소하여 일산화 탄소가 생성된다", "(나)에서 Fe₂O₃은 산소를 잃는다", "(나)에서 CO는 산화된다", "(나)에서 생성된 CO₂는 배기 가스로 빠져나간다"], "correct": 0, "explain": "(가)에서 탄소(코크스)는 산소를 얻어 일산화 탄소가 되므로 산화된다. (나)에서는 산화 철(Ⅲ)이 환원되고 일산화 탄소가 산화된다."}, {"q": "다음 산화·환원 반응 중 반응물에 산소 기체(O₂)가 없는 것은?", "choices": ["Fe₂O₃ + 3CO → 2Fe + 3CO₂", "CH₄ + 2O₂ → CO₂ + 2H₂O", "4Fe + 3O₂ → 2Fe₂O₃", "C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O", "2H₂ + O₂ → 2H₂O"], "correct": 0, "explain": "철의 제련 반응은 산화 철(Ⅲ)의 산소가 일산화 탄소로 옮겨 가는 반응으로, 산소 기체가 반응물로 쓰이지 않는다. 나머지는 모두 산소 기체가 반응물인 연소·부식·호흡·연료 전지 반응이다."}, {"q": "수소 연료 전지 자동차와 휘발유 자동차를 비교한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 두 자동차 모두 산화·환원 반응을 이용해 에너지를 얻는다.<br>ㄴ. 수소 연료 전지 자동차는 달릴 때 이산화 탄소를 배출하지 않는다.<br>ㄷ. 휘발유 자동차는 연료가 연소하며 이산화 탄소와 물이 생성된다.</div></div>", "choices": ["ㄱ, ㄴ, ㄷ", "ㄴ", "ㄱ, ㄷ", "ㄴ, ㄷ", "ㄱ"], "correct": 0, "explain": "수소 연료 전지(2H₂ + O₂ → 2H₂O)와 휘발유 연소는 모두 산화·환원 반응이다(ㄱ). 연료 전지는 물만 생성하고(ㄴ), 탄소와 수소로 된 휘발유는 연소하면 이산화 탄소와 물이 생긴다(ㄷ)."}],
[{"q": "태양 중심부(핵)의 온도로 가장 적절한 것은?", "choices": ["약 1500만 K", "약 6000 K", "약 1500 K", "약 150만 K", "약 15억 K"], "correct": 0, "explain": "태양의 중심부는 약 1500만 K의 초고온·초고압 상태로, 이곳에서 수소 핵융합 반응이 일어난다. 약 6000 K는 태양 표면의 온도에 가깝다."}, {"q": "수소 원자핵 4개의 질량 합은 4.032 u, 헬륨 원자핵 1개의 질량은 4.003 u이다. 핵융합 반응에서 감소한 질량은 반응 전 질량의 약 몇 %인가?", "choices": ["약 0.7 %", "약 7 %", "약 0.07 %", "약 29 %", "약 2.9 %"], "correct": 0, "explain": "감소한 질량은 4.032 − 4.003 = 0.029 u이고, 0.029 ÷ 4.032 ≈ 0.0072이므로 약 0.7 %이다. 이 작은 질량 감소가 막대한 에너지로 방출된다."}, {"q": "태양 에너지에 의한 탄소의 순환 과정에 대한 설명으로 옳은 것은?", "choices": ["식물이 태양의 빛에너지로 광합성을 하여 대기 중 이산화 탄소를 유기물로 바꾼다", "탄소의 순환은 태양의 열에너지로만 일어난다", "화석 연료가 연소하면 대기 중 이산화 탄소가 줄어든다", "탄소의 순환에는 에너지 전환이 일어나지 않는다", "탄소의 순환은 지구 내부 에너지로 일어난다"], "correct": 0, "explain": "태양의 빛에너지로 식물이 광합성을 해 대기 중 이산화 탄소를 유기물로 바꾸고, 생물의 호흡과 화석 연료의 연소로 다시 이산화 탄소가 된다. 이 과정에서 다양한 에너지 흐름이 일어난다."}, {"q": "물의 순환과 탄소의 순환을 일으키는 태양 에너지의 형태를 옳게 짝 지은 것은?", "choices": ["물의 순환 – 열에너지, 탄소의 순환 – 빛에너지", "물의 순환 – 빛에너지, 탄소의 순환 – 열에너지", "물의 순환 – 핵에너지, 탄소의 순환 – 빛에너지", "물의 순환 – 전기 에너지, 탄소의 순환 – 화학 에너지", "두 순환 모두 지구 내부 에너지"], "correct": 0, "explain": "물의 순환은 태양의 열에너지로 물이 증발하면서, 탄소의 순환은 태양의 빛에너지로 광합성이 일어나면서 진행된다."}, {"q": "다음 발전 방식 중 에너지의 근원이 태양 에너지가 아닌 것은?", "choices": ["조력 발전", "풍력 발전", "수력 발전", "화력 발전", "태양열 발전"], "correct": 0, "explain": "조력 발전은 밀물과 썰물을 이용하는데, 밀물과 썰물은 태양 에너지가 아니라 달과 태양의 인력 때문에 생긴다. 바람, 물의 순환, 화석 연료는 모두 태양 에너지에서 비롯된다."}, {"q": "풍력 발전에 이르기까지의 에너지 전환 과정으로 옳은 것은?", "choices": ["태양 에너지(열) → 공기의 운동 에너지(바람) → 전기 에너지", "태양 에너지 → 화학 에너지 → 전기 에너지", "태양 에너지 → 핵에너지 → 전기 에너지", "태양 에너지 → 위치 에너지 → 빛에너지", "지구 내부 에너지 → 운동 에너지 → 전기 에너지"], "correct": 0, "explain": "태양의 열에너지로 지표와 대기가 불균등하게 가열되어 공기가 움직이는 바람(운동 에너지)이 생기고, 풍력 발전기에서 전기 에너지로 전환된다."}, {"q": "태양의 수소 핵융합과 핵발전소의 핵분열에 대한 설명으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 핵발전소에서는 우라늄 원자핵이 분열하며 에너지가 나온다.<br>ㄴ. 두 반응 모두 질량이 에너지로 전환된다.<br>ㄷ. 핵발전소의 에너지는 태양 에너지가 근원이다.</div></div>", "choices": ["ㄱ, ㄴ", "ㄴ", "ㄷ", "ㄴ, ㄷ", "ㄱ, ㄷ"], "correct": 0, "explain": "핵발전은 우라늄의 핵분열(ㄱ), 태양은 수소 핵융합을 이용하며 둘 다 줄어든 질량이 에너지로 바뀐다(ㄴ). 우라늄의 핵에너지는 태양 에너지가 근원이 아니다(ㄷ 틀림)."}, {"q": "태양 에너지가 화력 발전을 통해 전기 에너지가 되기까지의 과정으로 옳은 것은?", "choices": ["태양 빛에너지 → 광합성(화학 에너지) → 화석 연료 → 연소(열에너지) → 터빈(운동 에너지) → 전기 에너지", "태양 빛에너지 → 물의 증발 → 위치 에너지 → 전기 에너지", "태양 열에너지 → 바람 → 전기 에너지", "태양 빛에너지 → 태양 전지 → 전기 에너지", "태양 에너지 → 핵분열 → 전기 에너지"], "correct": 0, "explain": "태양의 빛에너지가 광합성으로 화학 에너지가 되고, 생물이 묻혀 화석 연료가 된다. 화력 발전소에서 화석 연료를 태워 열에너지를 얻고, 터빈을 돌려 발전기에서 전기를 만든다."}, {"q": "태양 중심부에서 생성된 에너지가 태양 표면으로 나오는 경로로 옳은 것은?", "choices": ["핵 → 복사층 → 대류층 → 표면", "대류층 → 복사층 → 핵 → 표면", "복사층 → 핵 → 대류층 → 표면", "핵 → 대류층 → 복사층 → 표면", "표면 → 대류층 → 복사층 → 핵"], "correct": 0, "explain": "태양 내부는 중심에서부터 핵, 복사층, 대류층 순서이다. 핵에서 생성된 에너지는 복사층과 대류층을 거쳐 표면에 도달한 뒤 우주로 방출된다."}, {"q": "태양 에너지가 근원인 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 바람<br>ㄴ. 지열<br>ㄷ. 화석 연료<br>ㄹ. 밀물과 썰물</div></div>", "choices": ["ㄱ, ㄷ", "ㄱ, ㄴ", "ㄴ, ㄹ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㄹ"], "correct": 0, "explain": "바람과 화석 연료는 태양 에너지에서 비롯된다. 지열은 지구 내부 에너지, 밀물과 썰물은 달과 태양의 인력이 원인이다."}],
[{"q": "같은 자석과 같은 코일로 실험하였다. (가)는 자석을 천천히, (나)는 빠르게 코일에 가까이 하였다. 이에 대한 설명으로 옳은 것은?", "choices": ["유도 전류의 최댓값은 (나)가 (가)보다 크다", "유도 전류의 최댓값은 (가)가 (나)보다 크다", "(가)와 (나)의 유도 전류 세기는 같다", "(가)에서는 유도 전류가 흐르지 않는다", "(나)에서는 전류의 방향이 (가)와 반대이다"], "correct": 0, "explain": "자석을 빠르게 움직일수록 코일을 통과하는 자기장이 빠르게 변해 유도 전류가 세진다. 가까이 하는 방향은 같으므로 전류 방향도 같다."}, {"q": "같은 자석을 같은 속력으로 움직일 때, 코일의 감은 수가 50회인 경우와 100회인 경우를 비교한 설명으로 옳은 것은?", "choices": ["감은 수가 100회일 때 유도 전류가 더 세다", "감은 수가 50회일 때 유도 전류가 더 세다", "감은 수와 유도 전류의 세기는 관계없다", "감은 수가 많으면 유도 전류가 흐르지 않는다", "감은 수가 많으면 전류 방향이 바뀐다"], "correct": 0, "explain": "코일의 감은 수가 많을수록 유도 전류의 세기가 커진다. 자석의 세기와 움직이는 속력도 유도 전류의 세기를 결정한다."}, {"q": "자석의 N극을 코일에서 멀리 할 때 자석과 코일 사이에 작용하는 힘은?", "choices": ["서로 당기는 힘", "서로 밀어내는 힘", "힘이 작용하지 않는다", "처음에는 밀다가 나중에 당긴다", "자석의 세기에 따라 방향이 바뀐다"], "correct": 0, "explain": "N극을 멀리 하면 자기장 감소를 방해하도록 코일의 자석 쪽에 S극이 생겨 서로 당기는 힘이 작용한다. 멀어지는 운동을 방해하는 방향이다."}, {"q": "자석의 S극을 코일의 위쪽에서 가까이 할 때 코일 위쪽에 생기는 자극과 작용하는 힘을 옳게 짝 지은 것은?", "choices": ["S극, 서로 밀어내는 힘", "N극, 서로 당기는 힘", "N극, 서로 밀어내는 힘", "S극, 서로 당기는 힘", "자극이 생기지 않음, 힘 없음"], "correct": 0, "explain": "S극이 다가오면 그 변화를 방해하도록 코일 위쪽에 같은 극인 S극이 생겨 서로 밀어낸다."}, {"q": "같은 높이에서 같은 자석을 (가) 코일이 없는 관과 (나) 검류계가 연결된 코일을 감은 관 속으로 떨어뜨렸다. 이에 대한 설명으로 옳은 것은? (단, 관과 자석 사이의 마찰은 무시한다.)", "choices": ["(나)에서 자석이 바닥에 늦게 도달한다", "(가)에서 자석이 바닥에 늦게 도달한다", "두 자석은 동시에 도달한다", "(나)에서는 자석의 역학적 에너지가 증가한다", "(가)에서도 유도 전류가 흐른다"], "correct": 0, "explain": "(나)에서는 전자기 유도로 자석의 운동을 방해하는 힘이 작용하고, 역학적 에너지 일부가 전기 에너지로 바뀐다. 그래서 (나)의 자석이 더 늦게 떨어진다."}, {"q": "발전소 발전기의 구조와 원리에 대한 설명으로 옳은 것은?", "choices": ["터빈이 돌면 축에 연결된 자석이 회전하여 코일을 통과하는 자기장이 변한다", "발전기는 전기 에너지를 운동 에너지로 바꾼다", "코일에는 방향이 일정한 직류가 만들어진다", "터빈이 멈춰도 전기가 계속 생산된다", "발전기에는 자석이 필요 없다"], "correct": 0, "explain": "발전소에서는 터빈에 연결된 자석(회전자)이 코일(고정자) 안에서 회전하며 자기장을 변화시켜 전자기 유도로 전기를 만든다. 이때 만들어지는 전류는 교류이다."}, {"q": "핵발전의 에너지 전환 과정에서 ㉠, ㉡에 해당하는 에너지를 옳게 짝 지은 것은?<div class='mat-wrap'><div class='mat-label'>자료</div><div class='mat-box'>핵연료의 ( ㉠ ) → 열에너지 → ( ㉡ ) → 전기 에너지</div></div>", "choices": ["㉠ 핵에너지, ㉡ 운동 에너지", "㉠ 화학 에너지, ㉡ 운동 에너지", "㉠ 핵에너지, ㉡ 위치 에너지", "㉠ 위치 에너지, ㉡ 열에너지", "㉠ 빛에너지, ㉡ 운동 에너지"], "correct": 0, "explain": "핵발전은 우라늄의 핵에너지로 물을 끓이고(열에너지), 증기로 터빈을 돌려(운동 에너지) 발전기에서 전기 에너지를 얻는다."}, {"q": "화력 발전과 핵발전의 공통점으로 옳은 것만을 <보기>에서 있는 대로 고른 것은?<div class='mat-wrap'><div class='mat-label'>보기</div><div class='mat-box'>ㄱ. 물을 끓여 만든 수증기로 터빈을 돌린다.<br>ㄴ. 발전 과정에서 이산화 탄소를 많이 배출한다.<br>ㄷ. 발전기에서 전자기 유도로 전기를 만든다.</div></div>", "choices": ["ㄱ, ㄷ", "ㄱ", "ㄴ", "ㄴ, ㄷ", "ㄱ, ㄴ, ㄷ"], "correct": 0, "explain": "두 발전 방식 모두 수증기로 터빈을 돌리고(ㄱ), 발전기에서 전자기 유도로 전기를 만든다(ㄷ). 핵발전은 연소 과정이 없어 이산화 탄소 배출이 거의 없으므로 ㄴ은 공통점이 아니다."}, {"q": "다음 발전 방식 중 전자기 유도를 이용하지 않는 것은?", "choices": ["태양광 발전", "수력 발전", "화력 발전", "핵발전", "풍력 발전"], "correct": 0, "explain": "태양광 발전은 태양 전지가 빛에너지를 직접 전기 에너지로 바꾸므로 발전기(전자기 유도)를 쓰지 않는다. 나머지는 터빈과 발전기를 이용한다."}, {"q": "우리나라의 전기 생산에 대한 설명으로 옳은 것은?", "choices": ["사용하는 전기 에너지의 대부분을 화석 연료와 핵연료로 생산한다", "전기 에너지의 대부분을 태양광 발전으로 생산한다", "전기 에너지의 대부분을 조력 발전으로 생산한다", "수력 발전으로만 전기를 생산한다", "발전소는 전자기 유도를 이용하지 않는다"], "correct": 0, "explain": "우리나라는 사용하는 전기 에너지의 대부분을 화석 연료(화력)와 핵연료(핵발전)를 이용해 생산하고 있다."}],
