const SUBJECT_NOTES = {"info": {"title": "정보 개념노트", "sub": "Ⅰ~Ⅳ단원 · 교과서 형광펜 부분은 ★", "sections": [{"tag": "Ⅰ", "title": "컴퓨팅 시스템", "html": "<p class=\"nt-lead\">핵심: 네트워크는 기기들이 데이터를 주고받는 통신망이고, 사물 인터넷은 센서·액추에이터·통신 기술·소프트웨어로 사물과 사람을 연결한다.<\/p><h3>01 네트워크 환경 구성<\/h3><ul><li><span class=\"star\">★<\/span> <b>네트워크<\/b>: 기기들이 데이터를 주고받을 수 있도록 구성된 통신망. 송신자·수신자 정보, 전송 방식, 전송 매체가 필요하고 표준화된 통신 프로토콜을 따라야 한다.<\/li><li><span class=\"star\">★<\/span> <b>프로토콜<\/b>: 송신자와 수신자 간에 데이터를 주고받기 위한 신호 체계나 전송 방식에 관한 약속·규약.<\/li><li><span class=\"star\">★<\/span> <b>유무선 공유기<\/b>: 여러 장치를 하나의 인터넷에 연결하는 장치. <span class=\"star\">★<\/span> <b>랜 카드<\/b>: 네트워크 연결과 데이터 전송을 가능하게 하는 통신 장치.<\/li><li>네트워크 구성 형태: 버스형, 스타형, 그물형.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>구분<\/th><th>연결 방식<\/th><th>장점<\/th><th>단점<\/th><\/tr><tr><td><span class=\"star\">★<\/span> 유선<\/td><td>랜 케이블, 랜 카드, 광섬유 케이블로 직접 연결<\/td><td><span class=\"star\">★<\/span> 통신 안정성이 높다<\/td><td><span class=\"star\">★<\/span> 구축 비용이 많고 자리 이동이 어렵다<\/td><\/tr><tr><td><span class=\"star\">★<\/span> 무선<\/td><td>전파로 연결, IoT에서 중요<\/td><td><span class=\"star\">★<\/span> 이동하며 쓰기 편리<\/td><td><span class=\"star\">★<\/span> 장애물·전파 간섭으로 연결 장애<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> 대부분의 유선 네트워크는 <b>이더넷(Ethernet)<\/b> 방식. 이더넷 = 랜 케이블·랜 카드·물리적 주소로 근거리 기기 간 통신을 가능하게 하는 기술.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>무선 기술<\/th><th>핵심 특징<\/th><\/tr><tr><td>와이파이<\/td><td><span class=\"star\">★<\/span> 주로 가까운 거리의 인터넷 연결. <span class=\"star\">★<\/span> 무선 신호를 유선 신호로 바꾸는 공유기 필요<\/td><\/tr><tr><td>블루투스<\/td><td><span class=\"star\">★<\/span> 노트북-무선 마우스처럼 서로 다른 기능의 장치 연결. <span class=\"star\">★<\/span> 페어링 필요, 한 번에 여러 기기 연결 가능<\/td><\/tr><tr><td>NFC<\/td><td><span class=\"star\">★<\/span> 약 10cm 이내의 매우 가까운 거리. <span class=\"star\">★<\/span> 페어링 불필요. <span class=\"star\">★<\/span> 한 번에 여러 값 인식 불가, 거리 제약 큼 (교통비 결제, 출입 확인)<\/td><\/tr><tr><td>지그비<\/td><td><span class=\"star\">★<\/span> 저전력 근거리 무선 통신<\/td><\/tr><tr><td>RFID<\/td><td><span class=\"star\">★<\/span> 약 100m 이내에서도 가능한 비접촉식 통신. <span class=\"star\">★<\/span> 한 번에 여러 태그 인식, 가격이 비싸고 단방향 통신 (도서관, 의류 재고)<\/td><\/tr><tr><td>셀룰러<\/td><td><span class=\"star\">★<\/span> 영역을 셀 단위로 나눠 각 셀 중심에 기지국. <span class=\"star\">★<\/span> 멀리 떨어진 사용자에게 같은 주파수를 할당해 효율적으로 활용<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> <b>페어링<\/b>: 블루투스 기기를 서로 연결하는 초기 인증 과정.<\/li><li>대역폭: 일정 시간 동안 최대로 전송할 수 있는 데이터 크기.<\/li><\/ul><h4>네트워크 환경 설정<\/h4><ul><li><span class=\"star\">★<\/span> 네트워크 구성에는 공유기 같은 장치와 이를 제어하는 <b>소프트웨어<\/b>가 필요하고, 인터넷 접속에는 <span class=\"star\">★<\/span> <b>IP 주소, 게이트웨이, DNS 서버 주소<\/b>가 추가로 필요하다.<\/li><li><span class=\"star\">★<\/span> <b>DHCP(동적 호스트 구성 프로토콜)<\/b>: 인터넷 접속 정보를 자동으로 할당하는 방식. <span class=\"star\">★<\/span> 학교·회사 등 조직은 DHCP가 편리하지만 보안을 위해 수동 입력하기도 한다.<\/li><li><span class=\"star\">★<\/span> <b>IP 주소<\/b>: 인터넷에 연결된 컴퓨터의 유일한 주소로 각 기기를 구별한다.<\/li><li><span class=\"star\">★<\/span> <b>MAC 주소<\/b>: 랜 카드 제조사가 하드웨어에 부여한 고유 식별 번호. 사용자가 임의로 수정할 수 없다.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>구분<\/th><th>IPv4<\/th><th>IPv6<\/th><\/tr><tr><td>길이<\/td><td>32bit<\/td><td>128bit<\/td><\/tr><tr><td>구성<\/td><td>8bit씩 마침표(.)로 4영역, 각 0~255<\/td><td>16bit씩 콜론(:)으로 8영역, 각 0~65,535<\/td><\/tr><tr><td>특징<\/td><td><span class=\"star\">★<\/span> 최대 약 43억 개 주소 → 부족<\/td><td><span class=\"star\">★<\/span> 주소 부족 해결, 보안 강화<\/td><\/tr><tr><td>예시<\/td><td>10.237.20.125<\/td><td>FDEC:BA98:7321:362A:2B5C:FFFF:2D9C:0098<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> 현재는 <b>IPv4와 IPv6를 병행<\/b>해서 사용한다 (IPv4가 사라진 것 아님).<\/li><li><b>서브넷<\/b>: 네트워크를 효율적·안전하게 관리하려고 나눈 부분 네트워크 (전화번호의 지역 번호). 접두사 길이 24 → 앞 24bit가 네트워크 주소 (192.168.1.30/24 → 192.168.1.0~255).<\/li><li><span class=\"star\">★<\/span> <b>게이트웨이<\/b>: 서로 다른 네트워크가 통신할 수 있게 하는 장치, 다른 네트워크로 가려면 반드시 거치는 지점. <span class=\"star\">★<\/span> 대부분의 유무선 공유기가 게이트웨이 역할 + <span class=\"star\">★<\/span> <b>NAT<\/b>(공인 IP ↔ 사설 IP 변환) 기술 포함.<\/li><li><span class=\"star\">★<\/span> <b>공인 IP<\/b>: 인터넷 서비스 제공 업체(ISP)가 부여한 고유 주소. <span class=\"star\">★<\/span> <b>사설 IP<\/b>: 특정 네트워크 내부에서만 쓰는 주소, IPv4 주소 부족 해결을 위해 등장.<\/li><li><span class=\"star\">★<\/span> <b>도메인<\/b>: IP 주소를 영문·한글 등 문자로 간결하게 재구성한 것 (www.moe.go.kr = 27.101.207.36). <span class=\"star\">★<\/span> <b>DNS 서버<\/b>: IP 주소와 도메인 이름 간 변환을 담당.<\/li><li>도메인 단계: kr = 1단계, go = 2단계, moe = 3단계. .com 상업, .net 네트워크, .org 비영리, .edu 교육.<\/li><li>공유 네트워크: 한정된 자원을 효율적으로 이용. 접근 허용 범위 지정, 개인·민감 정보 포함 금지.<\/li><\/ul><h3>02 사물 인터넷과 사회 변화<\/h3><ul><li><span class=\"star\">★<\/span> <b>사물 인터넷(IoT)<\/b>: 사물과 사물뿐 아니라 사물과 사람, 사람과 사람을 연결해 상호 작용하게 하는 정보 과학 기술.<\/li><li><span class=\"star\">★<\/span> 센서로 수집된 방대한 데이터를 처리하려고 <b>클라우드 컴퓨팅, 에지 컴퓨팅<\/b>을 사용한다.<ul><li><span class=\"star\">★<\/span> <b>에지 컴퓨팅<\/b>: 데이터가 생성되는 곳 주변의 처리 장치(에지)로 분산 처리 → <span class=\"star\">★<\/span> 처리 시간 단축, 대역폭·사용량 감소.<\/li><li><span class=\"star\">★<\/span> <b>클라우드 컴퓨팅<\/b>: 클라우드 내에서 중앙 집중형으로 처리.<\/li><\/ul><\/li><\/ul><div class=\"nt-tbl\"><table><tr><th><span class=\"star\">★<\/span> 구성 요소<\/th><th>예시<\/th><\/tr><tr><td>센서 (입력, 환경 정보 수집)<\/td><td>온도·습도·가속도·초음파 센서<\/td><\/tr><tr><td>액추에이터 (물리적 동작)<\/td><td>모터, 밸브, 스위치<\/td><\/tr><tr><td>통신 기술<\/td><td>이더넷, 와이파이, 블루투스, NFC, RFID, 셀룰러<\/td><\/tr><tr><td>소프트웨어<\/td><td>제어 프로그램, 응용 소프트웨어<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> <b>동작 원리<\/b>: 센서가 수집한 데이터 → 장치 내에서 곧바로 처리되거나 네트워크로 데이터 관리 플랫폼에 전달 → <span class=\"star\">★<\/span> 분석 결과를 가공해 사용자에게 서비스.<\/li><li>지능형 사물 인터넷(AIoT): 인공지능 + 사물 인터넷.<\/li><li>주의점: 한 기기가 해킹되면 연결된 기기도 쉽게 해킹됨 → <span class=\"star\">★<\/span> 여러 위협에 노출될 수 있어 보안에 신경. <span class=\"star\">★<\/span> <b>데이터 주권<\/b>: 내 데이터가 언제, 어디서, 어떻게 쓰일지 결정할 권리. <span class=\"star\">★<\/span> 데이터 수집·처리 과정의 보안과 신뢰성을 충분히 고려.<\/li><\/ul><h3>03 사물 인터넷 시스템 구현<\/h3><ul><li>IoT 구현에는 하드웨어(센서, 마이크로컨트롤러) + 통신 기술 + 소프트웨어가 필요.<\/li><li><span class=\"star\">★<\/span> <b>마이크로컨트롤러(MCU)<\/b>: 입력·출력 장치를 제어하면서 프로그램 명령을 수행하는 장치. 보드: 마이크로비트, 아두이노, 라즈베리파이 (오픈 소스 하드웨어, IDE 무료 지원).<\/li><li>피지컬 컴퓨팅 하드웨어 = 입력(센서) → 처리(마이크로컨트롤러) → 출력(액추에이터).<\/li><li>마이크로비트 라디오: 블루투스 기반, 약 20m 내 통신. <b>라디오 그룹을 동일하게<\/b>(0~255 정수) 설정해야 송수신된다. 수치형 비교 블록과 문자형 비교 블록이 다르다.<\/li><li>실습 예: 스쿼트 칼로리(가속도 센서, 회당 0.32kcal), 스마트 전등(조도 센서, 밝기 반비례), 층간 소음(소리 센서, 기준 150).<\/li><\/ul>"}, {"tag": "Ⅱ", "title": "데이터", "html": "<p class=\"nt-lead\">핵심: 압축은 효율적인 저장·전송을, 암호화는 보호를 위한 정보의 재표현이고, 빅데이터는 적합하게 수집해 시각화로 의미를 찾는다.<\/p><h3>01 암호화와 데이터 보호<\/h3><ul><li><span class=\"star\">★<\/span> <b>암호화(Encryption)<\/b>: 암호키로 원본 메시지를 암호문으로 변환. 데이터의 비밀성 유지, 중요 정보 보호. (암호화 ≠ 비밀번호 Password)<\/li><li><span class=\"star\">★<\/span> <b>복호화(Decryption)<\/b>: 암호문을 원본 메시지로 되돌리는 과정. <span class=\"star\">★<\/span> 암호화에 사용된 암호키 값을 알아야만 해독 가능.<\/li><li><span class=\"star\">★<\/span> <b>평문<\/b>: 암호화되기 전 원본 메시지. <span class=\"star\">★<\/span> <b>암호문<\/b>: 암호키 없이는 읽을 수 없는 메시지. <span class=\"star\">★<\/span> <b>암호키<\/b>: 허가된 사용자를 구분하는 비밀 정보, 방법마다 생성 방식이 다르다.<\/li><li><span class=\"star\">★<\/span> 암호화는 허락되지 않은 사용자가 데이터를 악의적으로 쓰는 것을 막고, 외부 공격으로 데이터가 변경되지 않았음을 확인하는 데 쓰인다.<\/li><li>필요성: <span class=\"star\">★<\/span> 데이터 양 증가 + <span class=\"star\">★<\/span> 네트워크 송수신 일반화 → <span class=\"star\">★<\/span> 전송·저장 데이터가 노출되면 다양한 피해 (<span class=\"star\">★<\/span> 사생활 침해, 금전적 손해). <span class=\"star\">★<\/span> <b>기밀성과 무결성을 보장하는 암호화가 필요<\/b>.<ul><li><span class=\"star\">★<\/span> <b>기밀성<\/b>: 허가받지 않은 개인·시스템이 접근할 수 없게 보호.<\/li><li><span class=\"star\">★<\/span> <b>무결성<\/b>: 전송·저장 과정에서 변경되거나 손상되지 않음.<\/li><\/ul><\/li><li>활용: <span class=\"star\">★<\/span> 로그인 시 비밀번호가 암호화되어 서버에 저장, <span class=\"star\">★<\/span> 문서 파일 자체 암호화, <span class=\"star\">★<\/span> 은행 보안 앱·보안 카드·OTP, <span class=\"star\">★<\/span> <b>SSL<\/b>(사용자-서버 간 데이터를 암호화하는 표준 기술, SSL 인증서 사이트는 https://로 시작).<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>기법<\/th><th>방식<\/th><th>교과서 예<\/th><\/tr><tr><td><span class=\"star\">★<\/span> 치환형<\/td><td>평문의 문자를 규칙에 따라 <b>다른 문자로 바꿈<\/b>. 치환 문자는 키에 따라 달라짐<\/td><td>HELLO → URYYB (13칸 뒤), 시저 암호 (3칸 뒤)<\/td><\/tr><tr><td><span class=\"star\">★<\/span> 전치형<\/td><td>평문의 문자 <b>배열(위치)을 키의 순서대로 재배치<\/b><\/td><td>YELLOW + 키 351642 → LOYWLE<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> 전치형에서 키 길이와 평문 길이가 다르면 평문을 키 길이에 맞춰 나누고, 모자라면 임의 문자(z)를 덧붙인다. 복호화는 반대 순서로 재배치.<\/li><\/ul><h3>02 디지털 데이터의 압축<\/h3><ul><li><span class=\"star\">★<\/span> <b>압축<\/b>: 원본 데이터를 더 작은 크기로 표현, <span class=\"star\">★<\/span> 전체 비트 수를 줄여 정보를 다시 표현하는 기술. <span class=\"star\">★<\/span> 문자·이미지·소리·동영상 등에 적용.<\/li><li><span class=\"star\">★<\/span> 효과: 한정된 공간에 더 많이 저장, <span class=\"star\">★<\/span> 크기를 줄이면 전송 속도가 빨라지고 효율성이 높아진다.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>구분<\/th><th><span class=\"star\">★<\/span> 손실 압축<\/th><th><span class=\"star\">★<\/span> 무손실 압축<\/th><\/tr><tr><td>방식<\/td><td>통신 속도·저장 공간이 제한된 환경에서 품질을 낮춤. 일부 데이터 제거<\/td><td>모든 정보를 보존하면서 크기를 줄임<\/td><\/tr><tr><td>원본 손실<\/td><td>손실됨<\/td><td>손실되지 않음, 복원 가능<\/td><\/tr><tr><td>압축 효과<\/td><td>뛰어남<\/td><td>상대적으로 떨어짐<\/td><\/tr><tr><td>주 사용<\/td><td><span class=\"star\">★<\/span> 대용량 멀티미디어<\/td><td>문자<\/td><\/tr><\/table><\/div><ul><li>문자 압축: ZIP(폴더 계층 구조 유지, 완벽 복원), 반복 길이, 허프만.<ul><li><span class=\"star\">★<\/span> <b>반복 길이 압축(RLE)<\/b>: 연속 반복 부분을 '문자×반복 횟수'로 표현. AAAABBCCC → A4B2C3. 반복이 없으면 오히려 길어질 수 있다.<\/li><li><span class=\"star\">★<\/span> <b>허프만 압축<\/b>: 문자별 발생 빈도를 분석, <span class=\"star\">★<\/span> 높은 빈도 문자에 적은 비트, 낮은 빈도 문자에 많은 비트. 허프만 트리: 빈도 높은 문자를 상위 레벨에.<\/li><\/ul><\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>데이터<\/th><th>무손실<\/th><th>손실<\/th><\/tr><tr><td>문자<\/td><td>ZIP, 허프만, 반복 길이<\/td><td>-<\/td><\/tr><tr><td>이미지<\/td><td><span class=\"star\">★<\/span> GIF(최대 256색, 애니메이션 가능), <span class=\"star\">★<\/span> PNG(24비트 트루 컬러)<\/td><td><span class=\"star\">★<\/span> JPEG(국제 표준, 사람 눈으로 보기 어려운 세부 내용 제거, 투명도 부적합)<\/td><\/tr><tr><td>소리<\/td><td><span class=\"star\">★<\/span> FLAC(품질 동일, 크기는 크게 안 줄어듦)<\/td><td><span class=\"star\">★<\/span> MP3(귀로 감지 못하는 주파수·중복 제거)<\/td><\/tr><tr><td>동영상<\/td><td>-<\/td><td><span class=\"star\">★<\/span> MPEG(변화하는 부분만 저장, 이전 장면과의 차이에 따라 효과 다름)<\/td><\/tr><\/table><\/div><ul><li>압축 코덱: 압축·해제 소프트웨어. 비트율: 초당 전송 비트 수(bps). 트루 컬러: 24비트, 16,777,216색.<\/li><li><span class=\"star\">★<\/span> <b>압축률<\/b>: 압축 후 용량이 얼마나 줄었는지의 정도. 압축률이 높을수록 원본 손실이 크고 복원이 어려울 수 있다.<\/li><\/ul><div class=\"nt-formula\">압축률 = (원본 크기 − 압축된 크기) ÷ 원본 크기<\/div><ul><li>예: ABBBCCCCC(9) → A1B3C5(6): 0.33 / AABCCDFGH(9) → A2B1C2D1F1G1H1(14): 약 -0.55 (음수 = 오히려 커짐).<\/li><li><span class=\"star\">★<\/span> 이미지·소리 같은 대용량은 손실 압축으로 압축률이 높고, <span class=\"star\">★<\/span> 문자는 손실되면 이해가 어려워 무손실을 써서 압축률이 낮은 편.<\/li><\/ul><h3>03 빅데이터와 데이터 수집<\/h3><ul><li><span class=\"star\">★<\/span> <b>빅데이터<\/b>: 기존 데이터베이스 관리 도구로는 관리하기 어려운 규모와 다양성을 가진 데이터. 넓은 의미로는 <span class=\"star\">★<\/span> 대량의 정형·비정형 데이터에서 가치를 추출·분석하는 기술.<\/li><li><span class=\"star\">★<\/span> 3V: <b>규모(Volume)<\/b> 매우 큼, <b>다양성(Variety)<\/b> 형태가 다양, <b>속도(Velocity)<\/b> 빠르게 생성되어 실시간 저장·분석·처리. + 정확성(Veracity), 가치(Value) = 5V.<\/li><li><span class=\"star\">★<\/span> <b>정형 데이터<\/b>: 표처럼 속성과 값이 구분·정리된 데이터. <span class=\"star\">★<\/span> <b>비정형 데이터<\/b>: 이미지, 사운드, 비디오, 텍스트처럼 행과 열로 표현되지 않는 불규칙한 데이터. <span class=\"star\">★<\/span> 빅데이터는 둘 다 포함.<\/li><li>데이터 과학: 컴퓨터 공학·수학·통계학 융합, 패턴을 찾아 예측에 도움되는 정보를 발굴.<\/li><li>수집: <span class=\"star\">★<\/span> <b>데이터의 주제와 속성을 고려<\/b>해 수집, <span class=\"star\">★<\/span> <b>개인 정보·저작권 침해 등 윤리적 문제<\/b> 고려.<ul><li><span class=\"star\">★<\/span> <b>직접 수집<\/b>: 관찰·실험, 피지컬 컴퓨팅·스마트 기기 센서, <span class=\"star\">★<\/span> 설문 조사·인터뷰, 촬영·녹음·인터넷 검색.<\/li><li><span class=\"star\">★<\/span> <b>공공·민간 데이터 활용<\/b>. 공공 데이터 = 공공 기관이 생성·취득해 관리 (공공 데이터 포털, KOSIS, 기상자료개방포털). 민간 데이터 = 개인·기업이 생성 (도서 추천, 검색 키워드).<\/li><\/ul><\/li><li><span class=\"star\">★<\/span> <b>결측치<\/b>: 값이 누락된 것 (응답 안 한 문항). <span class=\"star\">★<\/span> <b>이상치<\/b>: 일반적 범위에서 크게 벗어난 아주 작거나 큰 값.<\/li><li>데이터 속성: 데이터를 다른 것과 구별하는 성질 (이름, 학년, 반...). 데이터 전처리: 품질 향상을 위해 정제·변환.<\/li><li>데이터 활용 문제 해결 과정: 문제 상황 이해 → 문제 정의 → 수집·전처리 → 시각화·해석 → 공유·평가.<\/li><\/ul><h3>04 데이터 시각화<\/h3><ul><li><span class=\"star\">★<\/span> <b>데이터 시각화<\/b>: 수치나 통계 데이터를 도표·그래프·지도 등 시각적 형태로 표현. 분포·트렌드·이상치를 쉽게 전달하고 관계·추세 확인 → 의사 결정에 도움.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>그래프<\/th><th><span class=\"star\">★<\/span> 표현<\/th><th><span class=\"star\">★<\/span> 쓰임<\/th><\/tr><tr><td>선 그래프<\/td><td>점으로 값을 나타내고 선으로 연결<\/td><td>가로축 시간, 세로축 수치 → 시간에 따른 변화<\/td><\/tr><tr><td>막대 그래프<\/td><td>막대 길이로 값의 크기<\/td><td>여러 항목의 상대적 크기 비교<\/td><\/tr><tr><td>원 그래프<\/td><td>원 영역 크기로 비율<\/td><td>항목 간 크기 비교 + 전체에 대한 비율<\/td><\/tr><tr><td>히스토그램<\/td><td>구간별 빈도수<\/td><td>가로축 값의 구간, 세로축 빈도 → 분포 파악<\/td><\/tr><tr><td>산점도<\/td><td>두 속성값을 좌표 평면에 점으로<\/td><td>속성 사이의 관계. 가로축 독립 변수, 세로축 종속 변수<\/td><\/tr><\/table><\/div><ul><li>상관계수 r: -1 ≤ r ≤ 1, 관련성이 클수록 절댓값 1에 가깝고 적으면 0에 가깝다.<\/li><li>수치형 데이터(온도, 점수, 키) vs 범주형 데이터(성별, 혈액형, 나이대). 인포그래픽 = 정보 + 그래픽.<\/li><li>역사 사례: 뉴욕 트리뷴의 콜레라 사망자 선 그래프, 존 스노의 콜레라 지도.<\/li><li>빅데이터 분석 도구: 데이터 플랫폼(공공 데이터 포털, 기상자료개방포털, 네이버 데이터랩), 코딩 없는 응용 소프트웨어(오렌지3, 코댑), 프로그래밍 언어(파이썬, R).<\/li><\/ul>"}, {"tag": "Ⅲ-1", "title": "알고리즘과 프로그래밍 01~04", "html": "<p class=\"nt-lead\">핵심: 컴퓨터로 문제를 풀려면 추상화 → 알고리즘 설계 → 자동화 절차를 거치고, 데이터는 알맞은 자료형과 변수로 다룬다.<\/p><h3>01 알고리즘과 문제 해결<\/h3><ul><li><span class=\"star\">★<\/span> <b>알고리즘<\/b>: 문제를 해결하기 위해 필요한 구체적인 방법과 절차. (9세기 수학자 알콰리즈미에서 유래)<\/li><li>문제: 목표 상태와 현재 상태가 일치하지 않는 상황. 문제 해결 = 초기 상태 → 목표 상태.<\/li><li><span class=\"star\">★<\/span> <b>계산 문제<\/b>는 컴퓨터로 절차적으로 해결할 수 있고, <span class=\"star\">★<\/span> <b>추상화 → 알고리즘 설계 → 자동화<\/b> 절차가 필요하다.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>단계<\/th><th><span class=\"star\">★<\/span> 하는 일<\/th><\/tr><tr><td>추상화<\/td><td>문제의 복잡성을 제거해 해결하기 쉬운 형태로 재표현. 초기·목표 상태 설정, 핵심 요소 추출, 수행 작업 정의<\/td><\/tr><tr><td>알고리즘 설계<\/td><td>글·도형·흐름선 등으로 작업을 절차에 맞춰 나열<\/td><\/tr><tr><td>자동화<\/td><td>알고리즘을 프로그래밍 언어로 구현(프로그래밍) + 실행 결과 분석·평가(성능 평가)<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> <b>핵심 요소<\/b>: 반드시 고려해야 하며 수행 작업에 영향을 주는 요소. <span class=\"star\">★<\/span> <b>수행 작업<\/b>: 목표 상태에 도달하기 위해 수행해야 하는 작업.<\/li><li><span class=\"star\">★<\/span> <b>알고리즘의 5가지 조건<\/b><ol><li>입력: 필요한 데이터를 입력받을 수 있어야 한다.<\/li><li>출력: 적어도 1개 이상의 결과가 출력되어야 한다.<\/li><li>명확성: 모호함 없이 의미가 분명해야 한다.<\/li><li>유한성: 반드시 종료되어야 한다.<\/li><li>수행 가능성: 모든 명령은 수행 가능해야 한다.<\/li><\/ol><\/li><li>표현 방법: 자연어, <span class=\"star\">★<\/span> <b>의사 코드<\/b>(프로그래밍 언어와 비슷한 가상의 코드, 실행 불가), <span class=\"star\">★<\/span> <b>순서도<\/b>(약속한 도형과 흐름선), <span class=\"star\">★<\/span> <b>프로그래밍 언어<\/b>(파이썬, C, C++).<\/li><li><span class=\"star\">★<\/span> <b>선택 구조<\/b>: 조건에 따라 다른 동작. <span class=\"star\">★<\/span> <b>반복 구조<\/b>: 같은 명령을 여러 번 반복.<\/li><li>박물관 예제: visitors를 2로 나누는 횟수(count) + 1 = 필요한 경찰 수 (40000명 → 16명).<\/li><\/ul><h3>02 문제 분해와 모델링<\/h3><ul><li><b>문제 분해<\/b>: 복잡한 문제를 작은 단위의 문제로 나누는 것. 두 방법 → 유사한 기능·자료로 나눠 순차 처리 / 같은 형태의 작은 문제로 나눠 반복 해결. 문제 사이의 순서·포함 관계에 유의.<\/li><li><b>모델링<\/b>: 글, 그림, 그래프, 표로 작은 문제 사이의 관계를 구조화해 이해하기 쉽게 나타내는 것. 정보의 구조화 = 모델링의 한 방법.<\/li><li>쾨니히스베르크 다리: 오일러가 지형을 점(정점)과 선(간선)으로 단순화 → 그래프 구조의 원형. 한붓그리기 조건 = 각 정점의 간선 수가 모두 짝수.<\/li><\/ul><h3>03 자료형과 변수<\/h3><div class=\"nt-tbl\"><table><tr><th>자료형<\/th><th>예<\/th><th>type() 결과<\/th><\/tr><tr><td><span class=\"star\">★<\/span> 수치형 - 정수<\/td><td>1, 0, -1, 123<\/td><td>int<\/td><\/tr><tr><td><span class=\"star\">★<\/span> 수치형 - 실수<\/td><td>3.14, -1.23, 5.0<\/td><td>float<\/td><\/tr><tr><td><span class=\"star\">★<\/span> 문자열<\/td><td>'안녕', \"Python\", '123'<\/td><td>str<\/td><\/tr><tr><td><span class=\"star\">★<\/span> 불<\/td><td>True, False (첫 글자 대문자, 예약어)<\/td><td>bool<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> <b>수치 자료형<\/b>: 숫자 형태. <span class=\"star\">★<\/span> 소수점 포함 여부로 정수형·실수형 구분.<\/li><li><span class=\"star\">★<\/span> <b>문자열<\/b>: 문자들의 집합. <span class=\"star\">★<\/span> 작은따옴표·큰따옴표 1개 또는 3개로 감싼다. <span class=\"star\">★<\/span> <b>따옴표로 감싼 부분은 모두 문자열<\/b> → print('2+3')은 2+3, print(2+3)은 5.<\/li><li>문자열 연산: <span class=\"star\">★<\/span> <b>덧셈(+)은 문자열 연결<\/b>(문자열끼리만), <span class=\"star\">★<\/span> <b>곱셈(*)은 반복<\/b> ('파이썬'*3).<\/li><li><span class=\"star\">★<\/span> <b>불 자료형<\/b>: 참과 거짓, 실행 흐름 제어에 사용. <span class=\"star\">★<\/span> <b>0과 빈 문자열 ''은 False, 나머지 숫자·문자열은 True<\/b>. <span class=\"star\">★<\/span> bool()로 확인.<\/li><li><span class=\"star\">★<\/span> <b>변수<\/b>: 값을 저장하기 위한 기억 장소, <span class=\"star\">★<\/span> 이름 = 변수명. 값은 변할 수 있고 자료형은 저장 값에 따라 자동 결정. 대입 연산자 =.<\/li><li>변수명 규칙: 영문·한글·숫자·_ 사용 / 대소문자 구분 / <span class=\"star\">★<\/span> 숫자로 시작 불가 / <span class=\"star\">★<\/span> 예약어(if, for, while, and, or) 불가 / <span class=\"star\">★<\/span> 특수 문자·공백 불가 / 여러 단어는 _로 연결 (student_name).<\/li><li><span class=\"star\">★<\/span> 주석: # 뒤 문장, 실행에 영향 없음. 여러 변수: a, b = 10, 3.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>연산자<\/th><th>종류<\/th><\/tr><tr><td>산술<\/td><td>+ - * / (나눗셈, 결과 실수) // (몫) % (나머지) ** (거듭제곱)<\/td><\/tr><tr><td>비교 (결과 불)<\/td><td>&gt; &gt;= &lt; &lt;= == (같다) != (다르다)<\/td><\/tr><tr><td>논리 (결과 불)<\/td><td>and (모두 True일 때 True), or (하나만 True여도 True), not (반대)<\/td><\/tr><\/table><\/div><ul><li>10, 3 → 13, 7, 30, 3.333…, 3, 1, 1000. type(10/2)는 float.<\/li><\/ul><h3>04 표준 입출력과 파일 입출력<\/h3><ul><li><span class=\"star\">★<\/span> <b>표준 입출력<\/b>: 장치를 따로 지정하지 않으면 키보드로 입력하고 모니터 화면으로 출력.<\/li><li><span class=\"star\">★<\/span> <b>print()<\/b>: 모니터에 값 출력. <span class=\"star\">★<\/span> 괄호 안 내용 출력, <span class=\"star\">★<\/span> 변수명이면 저장된 값 출력. <span class=\"star\">★<\/span> 여러 값은 쉼표(,)로 구분, <span class=\"star\">★<\/span> 출력 시 사이에 공백 추가. 다른 자료형은 str()로 바꿔 + 연결.<\/li><li>f-문자열: f'{school}고등학교 {grade}학년'. 이스케이프 문자: \\n 줄바꿈, \\t 탭.<\/li><li><span class=\"star\">★<\/span> <b>input()<\/b>: 키보드로 값을 입력받는 기본 방법. <span class=\"star\">★<\/span> 입력받은 값을 기억하려면 변수에 저장, <span class=\"star\">★<\/span> 괄호 안에 안내 문구 작성.<\/li><li><span class=\"star\">★<\/span> <b>input()으로 입력받은 값은 항상 문자열<\/b>. <span class=\"star\">★<\/span> 수치로 쓰려면 <b>int()<\/b> 또는 <b>float()<\/b>로 변환 (안 하면 '10'+'3.14' = 103.14). 정수+실수 = 실수.<\/li><li>파일 입출력: 방대한 데이터를 파일로 저장해 필요할 때 불러온다. 순서 = 파일 열기 → 처리(읽기·쓰기) → 파일 닫기.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>함수<\/th><th>기능<\/th><\/tr><tr><td>open('파일', '모드')<\/td><td>파일 열기. 모드 r 읽기, w 쓰기, a 기존 내용에 추가<\/td><\/tr><tr><td>close()<\/td><td>파일 닫기 (반드시)<\/td><\/tr><tr><td>write()<\/td><td>파일에 쓰기 (문자열 1개)<\/td><\/tr><tr><td>read() / readline()<\/td><td>전체 읽기 / 한 줄 읽기<\/td><\/tr><\/table><\/div><ul><li>csv = 쉼표로 구분한 파일. with open(...) as f: 를 쓰면 블록을 벗어날 때 자동으로 닫힌다.<\/li><\/ul>"}, {"tag": "Ⅲ-2", "title": "알고리즘과 프로그래밍 05~08", "html": "<p class=\"nt-lead\">핵심: 제어 구조로 흐름을, 리스트로 데이터를, 클래스로 객체를 다루고, 정렬·탐색 알고리즘은 데이터 양과 정렬 여부에 따라 효율이 달라진다.<\/p><h3>05 제어 구조와 데이터 구조<\/h3><ul><li>제어 구조: 순차(명령을 순서대로), 선택(조건에 따라 흐름을 달리), 반복(같은 명령을 반복).<\/li><li><span class=\"star\">★<\/span> 선택 구조 종류: <b>if문, if~else문, if~elif~…~else문<\/b>.<ul><li><span class=\"star\">★<\/span> if: 조건식이 참이면 문장 1 실행.<\/li><li><span class=\"star\">★<\/span> if~else: 참이면 문장 1, 거짓이면 문장 2.<\/li><li><span class=\"star\">★<\/span> if~elif~else: 조건식 1이 참이면 문장 1, 조건식 2가 참이면 문장 2, <span class=\"star\">★<\/span> 모두 거짓이면 else의 문장. <span class=\"star\">★<\/span> elif는 필요한 만큼 추가.<\/li><li><span class=\"star\">★<\/span> 중첩 선택 구조: 선택 구조 안에 다른 선택 구조 (양수·0·음수 판별).<\/li><li>else는 없어도 된다. <span class=\"star\">★<\/span> <b>들여쓰기가 실행 범위를 결정<\/b>, 규칙을 안 지키면 오류. if, while, for의 콜론(:) 다음 문장은 반드시 들여쓰기.<\/li><\/ul><\/li><li><span class=\"star\">★<\/span> 반복 구조: 조건에 따라 특정 명령을 반복 실행, for문과 while문.<ul><li>for 변수 in 리스트(또는 문자열): 첫 요소부터 마지막 요소까지 차례로 대입.<\/li><li><span class=\"star\">★<\/span> <b>range(시작, 종료, 증감)<\/b>: 시작 값부터 종료 값 <b>직전<\/b>까지 증감 값만큼 변화. 시작·증감 생략 가능.<\/li><li>range(3) → 0 1 2 / range(1, 3) → 1 2 / range(5, 0, -2) → 5 3 1 / range(3, 10, 3) → 3 6 9<\/li><li><span class=\"star\">★<\/span> <b>while문<\/b>: 조건식이 참이면 반복, 거짓이면 종료.<\/li><li>중첩 반복 구조: 이차원 리스트 탐색·출력에 유용. print(j, end=' ')은 줄바꿈 없이 한 칸 띄움.<\/li><\/ul><\/li><li>데이터 구조: 효율적으로 자료를 처리·관리하는 구조, 주로 리스트.<ul><li><span class=\"star\">★<\/span> 한 학생의 이름·성별·학년·점수를 5개 변수 대신 <b>리스트 1개<\/b>에 저장할 수 있어 효율적.<\/li><li><span class=\"star\">★<\/span> 1차원 리스트 = [값1, 값2, …]. 인덱스는 <b>0부터<\/b> 시작. s = ['김OO','남','1학년',85,90] → s[2]는 '1학년'.<\/li><li>2차원 리스트 = [[값1, 값2], [값3, 값4], …], s[행][열]. 여러 명의 자료를 저장할 때 효율적이며 출력은 중첩 반복문.<\/li><\/ul><\/li><\/ul><h3>06 객체지향과 클래스<\/h3><ul><li><span class=\"star\">★<\/span> <b>객체지향<\/b>: 같은 기능이나 목적을 갖는 변수·함수를 묶어 객체로 만들고, 객체들이 상호 작용하며 실행되도록 구성하는 것.<\/li><li><span class=\"star\">★<\/span> <b>객체지향 프로그래밍<\/b>: 필요한 객체의 역할을 정의하고 객체를 조합해 프로그래밍하는 것.<\/li><li><span class=\"star\">★<\/span> 구성: <b>객체(Object), 클래스(Class), 인스턴스(Instance)<\/b>.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>용어<\/th><th><span class=\"star\">★<\/span> 뜻<\/th><\/tr><tr><td>객체<\/td><td>동일한 목적·기능을 가진 속성과 메서드를 하나로 묶은 것<\/td><\/tr><tr><td>속성<\/td><td>객체가 가지고 있는 자료<\/td><\/tr><tr><td>메서드<\/td><td>객체가 수행하는 기능 (클래스 안의 함수)<\/td><\/tr><tr><td>클래스<\/td><td>객체들이 갖는 속성과 메서드를 정의한 틀 (설계도)<\/td><\/tr><tr><td>인스턴스<\/td><td>클래스를 바탕으로 소프트웨어에 구현된 구체적인 실체<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> 객체가 클래스로 생성된 실체라면, 인스턴스는 객체가 소프트웨어에서 <b>실체화된 것<\/b>. <span class=\"star\">★<\/span> 클래스로 여러 객체를 생성하고, 객체가 값을 받아 실체화된 것을 인스턴스라 한다.<\/li><li>장점: 반복 코드가 줄고, 클래스를 고치면 객체를 한 번에 수정할 수 있다.<\/li><li>문법: class 이름: → def __init__(self, 속성…): 으로 시작. 클래스 이름은 대문자로 시작, 메서드 첫 매개 변수는 self. 객체 = 클래스이름(값…). students[0].informatics로 속성 접근. isinstance(인스턴스, 클래스) → True/False.<\/li><li>객체지향의 특징: 추상화, 상속(기존 클래스 재활용), 캡슐화(데이터는 숨기고 메서드로 소통), 다형성(같은 이름으로 여러 상황 대처). 구조적 프로그래밍 = 위에서 아래로 순서대로 실행.<\/li><\/ul><h3>07 정렬과 탐색 알고리즘<\/h3><ul><li><span class=\"star\">★<\/span> <b>정렬<\/b>: 여러 데이터를 일정한 기준에 따라 순서대로 나열하는 것. <span class=\"star\">★<\/span> <b>정렬 알고리즘<\/b>: 정렬하기 위한 구체적인 절차나 방법.<\/li><li><span class=\"star\">★<\/span> 오름차순: 값이 작은 것부터 (도서관 청구 기호). <span class=\"star\">★<\/span> 내림차순: 많은 것부터 (메달 순위).<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>구분<\/th><th><span class=\"star\">★<\/span> 선택 정렬<\/th><th><span class=\"star\">★<\/span> 퀵 정렬<\/th><\/tr><tr><td>방법<\/td><td>정렬되지 않은 데이터 중 가장 작은 데이터를 선택해 알맞은 위치로 옮기는 작업을 반복<\/td><td>기준 값보다 작은 데이터는 왼쪽, 큰 데이터는 오른쪽 그룹으로 나누는 과정을 반복<\/td><\/tr><tr><td>특징<\/td><td><span class=\"star\">★<\/span> 간단하지만 데이터가 많을수록 비교 횟수가 많음 → 작은 규모에 효과적<\/td><td><span class=\"star\">★<\/span> 가장 빠른 알고리즘 중 하나지만 기준 값 선택에 따라 효율이 달라짐<\/td><\/tr><tr><td>공 6개 예<\/td><td>5+4+3+2+1 = 15회<\/td><td>5+1+2 = 8회<\/td><\/tr><\/table><\/div><ul><li>선택 정렬 비교 횟수 = n(n-1)/2 → 10개 45번, 1,000개 499,500번.<\/li><li>퀵 정렬 기준이 최솟값·최댓값이면 한쪽으로 치우쳐 비효율, 중앙값이면 효율이 높다.<\/li><li><span class=\"star\">★<\/span> <b>탐색<\/b>: 여러 데이터 중 원하는 것을 찾는 작업. <span class=\"star\">★<\/span> <b>탐색 알고리즘<\/b>: 탐색하기 위한 구체적 절차·방법.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>구분<\/th><th><span class=\"star\">★<\/span> 순차 탐색<\/th><th><span class=\"star\">★<\/span> 이진 탐색<\/th><\/tr><tr><td>방법<\/td><td>처음부터 끝까지 순차적으로 하나씩 비교. 끝까지 없으면 없다고 판단<\/td><td>범위를 반으로 줄여 가며 찾음. 중간 기준보다 작으면 왼쪽, 크면 오른쪽<\/td><\/tr><tr><td>조건<\/td><td><span class=\"star\">★<\/span> 정렬되지 않아도 적용 가능<\/td><td><span class=\"star\">★<\/span> 반드시 정렬된 데이터에서만 (안 되어 있으면 먼저 정렬)<\/td><\/tr><tr><td>효율<\/td><td><span class=\"star\">★<\/span> 데이터 양에 따라 비교 횟수가 크게 달라짐 → 적을 때 효과적<\/td><td><span class=\"star\">★<\/span> 데이터가 많을 때 훨씬 적은 비교로 찾음<\/td><\/tr><tr><td>1,000개 최악<\/td><td>1,000번<\/td><td>10번<\/td><\/tr><\/table><\/div><ul><li>이진 탐색 중간 위치 = (시작 + 끝) // 2 (짝수 개면 평균의 몫).<\/li><\/ul><h3>08 협력적 문제 해결 프로젝트<\/h3><ul><li>프로젝트 절차: 주제 선정 및 문제 정의 → 추상화(문제 분석·분해·모델링) → 알고리즘 설계 → 프로그램 작성 → 성능 평가 및 공유.<\/li><li>브레인스토밍: 자유롭게 아이디어를 내 좋은 것을 고르거나 조합. 디버깅: 코드를 한 줄씩 확인하며 오류를 찾아 고치는 과정 (그레이스 호퍼의 나방).<\/li><li>예제: 제동 거리 = (속도 m/s)² ÷ (2 × 제동 가속도), km/h × 1000 ÷ 3600으로 단위 변환. 반려동물 등록 프로그램 = Register 클래스 + 등록·삭제·조회·종료, enumerate()로 인덱스와 원소 동시 접근.<\/li><\/ul>"}, {"tag": "Ⅳ", "title": "인공지능", "html": "<p class=\"nt-lead\">핵심: 지능 에이전트는 센서로 인식하고 판단해 구동기로 행동하며, 기계학습은 데이터에서 규칙을 스스로 찾아 모델을 만든다.<\/p><h3>01 인공지능과 지능 에이전트<\/h3><ul><li><span class=\"star\">★<\/span> <b>인공지능(AI)<\/b>: 탐색, 추론, 학습 등 인간의 지적 능력 일부 또는 전체를 구현하는 컴퓨터 과학 기술. 상황을 인식하고 스스로 판단·행동해 문제를 해결.<\/li><li>역사: 1950년 앨런 튜링의 튜링 테스트('기계가 사고할 수 있는가') → 합리적 행동 연구 → 1980년대 초 '지능 에이전트' 개념 등장.<\/li><li><span class=\"star\">★<\/span> <b>에이전트<\/b>: 일상에서 특정 역할·임무를 대신 처리하는 대리인. 컴퓨터에서는 반복적이거나 특정 역할을 자동 처리하는 시스템.<\/li><li><span class=\"star\">★<\/span> <b>지능 에이전트<\/b>: 에이전트 + 인공지능의 지능적 사고 능력. (진공청소기 = 에이전트, 로봇 청소기 = 지능 에이전트)<\/li><li>특성: 센서로 외부 환경 감지 → 판단 → 구동기로 행동. <span class=\"star\">★<\/span> <b>센서로 얻은 정보를 인공지능으로 인식·판단하고, 이를 토대로 행동<\/b>한다.<ul><li>자율성(스스로 판단), 상호 작용(인간·시스템·다른 에이전트와), 학습하며 새 규칙을 만든다. 단일·다중 에이전트.<\/li><li><b>구동기(액추에이터)<\/b>: LED, 버저, 모터, 스피커 등 판단 결과를 물리적 반응으로 외부에 전달.<\/li><\/ul><\/li><li>사례 분석은 목표·환경·인식·행동으로 (AI 비서, 의료 진단, 대화형 영어 학습기, 자율주행 자동차).<\/li><li>인공지능의 역할·순기능: 많은 데이터를 왜곡 없이 반영구적으로 기억, 복잡한 문제를 빠르게 추론, 생활 편리, 생산성 향상, 사고 위험 감소, 인간의 한계 보완(인명 구조, 화성 탐사).<\/li><li>인간은 입력 데이터를 추상화하고 직관적으로 파악하지만 잊거나 왜곡하기도 한다.<\/li><li><b>인간의 역할 4가지<\/b><ol><li>인공지능 기술과 서비스를 능동적으로 활용해 업무 처리<\/li><li>인공지능이 해결해야 할 문제를 정확히 선정하고 정의<\/li><li>인공지능이 처리하지 못하는 직관적 문제, 감정을 다루는 문제 해결<\/li><li>도덕적·윤리적 가치로 인공지능 기술과 서비스를 점검<\/li><\/ol><\/li><li>감성 컴퓨팅: 감정을 인식·해석하는 AI 기술. 흉내는 내지만 실제로 감정을 느낄 수는 없다. 챗봇 = 음성·문자로 대화하는 지능 에이전트.<\/li><\/ul><h3>02 기계학습의 이해<\/h3><ul><li><span class=\"star\">★<\/span> <b>기계학습(Machine Learning)<\/b>: 데이터로 학습한 것을 바탕으로 문제 해결을 위한 최적의 알고리즘을 찾아 특정 작업을 수행하는 인공지능의 한 분야. <span class=\"star\">★<\/span> 즉, 데이터로부터 규칙을 학습해 <b>모델<\/b>을 만들고, 이를 통해 새로운 데이터에 대한 예측이나 판단을 내린다.<\/li><li><span class=\"star\">★<\/span> <b>전통적인 프로그래밍<\/b>: 데이터와 규칙을 입력해 원하는 결과를 출력. <span class=\"star\">★<\/span> <b>기계학습<\/b>: 데이터와 원하는 결과를 알려 주면 스스로 규칙을 찾아낸다.<\/li><li>학습 모델: 데이터를 기반으로 학습하고 새 데이터의 결과를 알아내는 과정을 프로그램으로 만든 것.<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>유형<\/th><th>데이터<\/th><th><span class=\"star\">★<\/span> 뜻<\/th><th>세부<\/th><\/tr><tr><td>지도학습<\/td><td>정답(레이블) 있음<\/td><td>정답이 있는 데이터로 학습해 결과를 판단하는 모델을 만든다<\/td><td>회귀, 분류<\/td><\/tr><tr><td>비지도학습<\/td><td>정답 없음<\/td><td>스스로 입력 데이터의 특징을 분석해 패턴·규칙을 찾아낸다. 숨겨진 새 정보를 찾을 때 유용<\/td><td>군집<\/td><\/tr><\/table><\/div><ul><li><span class=\"star\">★<\/span> <b>훈련 데이터<\/b>: 학습 모델을 만드는 데 사용. <span class=\"star\">★<\/span> <b>테스트 데이터<\/b>: 모델의 성능을 테스트할 때 사용.<\/li><li>레이블: 데이터를 구별하는 속성, 레이블링: 정답을 부여하는 과정. 지도학습은 정답이 있어 오류 여부를 확실히 파악할 수 있다.<\/li><li><span class=\"star\">★<\/span> <b>회귀<\/b>: 속성들 사이의 상관관계를 표현하는 함수식을 구하고, 특정 값을 예측하는 방법 (지각할 확률, 아이스크림 판매량, 내년 최고 기온).<\/li><li><span class=\"star\">★<\/span> <b>분류<\/b>: 고정된 레이블을 나누는 기준을 학습해 새 입력을 여러 그룹 중 하나로 선택 (계절, 스팸 메일). 이진 분류(2개) / 다중 분류(3개 이상).<\/li><li><span class=\"star\">★<\/span> <b>군집<\/b>: 명확한 기준 없이 특성을 고려해 유사한 데이터끼리 묶는 것, 나뉜 그룹도 군집 (버스 노선, SNS 게시물 추천, 영화 평점 선호 그룹).<\/li><\/ul><h3>03 기계학습을 이용한 문제 해결<\/h3><ul><li>기계학습으로 해결 가능한지: 우수한 품질의 데이터가 충분한가? → 모델을 생성할 수 있는가? → 둘 다 예이면 해결 가능성이 높다.<\/li><li><b>문제 해결 5단계<\/b>: ① 문제 정의 → ② 데이터 탐색 및 전처리 → ③ 기계학습 유형과 알고리즘 선정 → ④ 기계학습을 통한 모델 생성 → ⑤ 성능 평가.<\/li><li>전처리: 오류·공백(결측치) 수정, 학습에 맞는 형태로 재구조화. 문자형은 replace()로 수치형 변환 (기계학습 알고리즘은 문자형으로 상관관계를 파악할 수 없다).<\/li><li><span class=\"star\">★<\/span> 정규화: 속성 값을 0.0~1.0으로 맞춰 범위가 큰 속성이 결과에 더 큰 영향을 주는 것을 막는다 (MinMaxScaler).<\/li><li>독립 변수: 다른 변수에 영향을 주는 변수 (X, 2차원이라 대문자). 종속 변수: 영향을 받는 변수 (y, 1차원이라 소문자).<\/li><\/ul><div class=\"nt-tbl\"><table><tr><th>문제<\/th><th>유형<\/th><th>알고리즘<\/th><th>성능 평가<\/th><\/tr><tr><td>자동차 CO2 배출량 예측<\/td><td>회귀<\/td><td>선형 회귀 (LinearRegression)<\/td><td>R2 score (0~1, 1에 가까울수록 좋음) → 약 0.98<\/td><\/tr><tr><td>수업 태도로 성적 등급 구분<\/td><td>분류<\/td><td>로지스틱 회귀 (LogisticRegression)<\/td><td>정확도 accuracy_score → 약 0.73, 혼동 행렬<\/td><\/tr><tr><td>자전거 대여 관리소 위치<\/td><td>군집<\/td><td>K-평균 (KMeans, n_clusters=2)<\/td><td>실루엣 계수 (-1~1, 1에 가까울수록 좋음) → 약 0.91<\/td><\/tr><\/table><\/div><ul><li>코드 흐름: files.upload() → pd.read_csv() → head()/info()/isna().sum() → X, y 나누기 → train_test_split(test_size=0.3 = 7:3, random_state로 같은 분할 재현) → 모델.fit(X_train, y_train) → predict(X_test) → 평가.<\/li><li>predict([[3.0, 7.5]])처럼 대괄호 2개 = 2차원 배열. drop(labels=['Class'], axis=1) = 세로 방향(열) 삭제.<\/li><li>데이터 파악 함수: head() 앞부분, tail() 뒷부분, shape 행·열 개수, info() 자료형·개수(non-null이면 결측치 없음), describe() 요약 통계. int64 정수, float64 실수, object 문자.<\/li><li>대표 분류 알고리즘: 의사 결정 트리(기준에 따라 리프 노드까지 분할), 랜덤 포레스트(여러 트리의 다수결, 앙상블 기법), K-최근접 이웃(가장 가까운 K개가 많이 속한 그룹).<\/li><li>K-평균: K개 임의 중심점 → 가까운 중심에 할당 → 중심 재설정 → 중심이 안 바뀔 때까지 반복. K 값에 따라 성능이 달라진다.<\/li><li>군집은 정답과 비교할 수 없어 실루엣 계수로 평가한다 (같은 군집끼리 가깝고 다른 군집과 멀수록 좋음).<\/li><\/ul>"}]}};

/* ================= storage ================= */
const STORAGE_KEY = "jokbo_app_progress_v2";
const PENDING_KEY = "jokbo_app_pending_v2";

function freshProgress(){
  const p = {};
  SUBJECTS.forEach(s => { p[s.id] = new Array(s.quiz.length).fill(false); });
  return p;
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshProgress();
    const p = JSON.parse(raw);
    SUBJECTS.forEach(s => { if(!Array.isArray(p[s.id]) || p[s.id].length !== s.quiz.length) p[s.id] = new Array(s.quiz.length).fill(false); });
    return p;
  }catch(e){ return freshProgress(); }
}
function saveProgress(p){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){} }
function savePending(p){
  try{ if(p===null) localStorage.removeItem(PENDING_KEY); else localStorage.setItem(PENDING_KEY, JSON.stringify(p)); }catch(e){}
}
function loadPending(){
  try{
    const raw = localStorage.getItem(PENDING_KEY);
    if(!raw) return null;
    const p = JSON.parse(raw);
    const subj = SUBJECTS.find(s=>s.id===p.subjectId);
    if(!subj) return null;
    if(typeof p.setIndex!=="number" || p.setIndex<0 || p.setIndex>=subj.quiz.length) return null;
    return p;
  }catch(e){ return null; }
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function showView(name){
  const wasQuiz = document.body.classList.contains("in-quiz");
  document.body.classList.toggle("in-quiz", name==="quiz");
  if(wasQuiz && name!=="quiz") window.dispatchEvent(new Event("pen:leave"));
  document.querySelectorAll("[data-view]").forEach(el=>{
    el.classList.toggle("show", el.getAttribute("data-view")===name);
  });
  document.querySelectorAll(".bottomnav button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-tab")===name);
  });

}

const WRONG_KEY = "seoik_wrong_v1";
function loadWrong(){ try{ return JSON.parse(localStorage.getItem(WRONG_KEY) || "{}") || {}; }catch(e){ return {}; } }
function saveWrong(w){ try{ localStorage.setItem(WRONG_KEY, JSON.stringify(w)); }catch(e){} }
function wkey(it){ return it.sid+"|"+it.set+"|"+it.q; }
let wrongRemovedThisRound = 0;
function recordAnswer(it, correct){
  const w = loadWrong(), k = wkey(it);
  if(!correct){ w[k] = { sid:it.sid, set:it.set, q:it.q, ts:Date.now(), streak:0, misses:((w[k]&&w[k].misses)||0)+1 }; }
  else if(w[k]){
    w[k].streak = (w[k].streak||0) + 1;
    if(w[k].streak>=2){ delete w[k]; wrongRemovedThisRound++; }
  }
  saveWrong(w);
}
function wrongList(sid){
  const w = loadWrong();
  return Object.values(w).filter(e=>{
    const s = subjById(e.sid); return s && s.quiz[e.set] && s.quiz[e.set][e.q] && (!sid || e.sid===sid);
  }).sort((a,b)=> b.ts - a.ts);
}
function plainText(html){ const d = document.createElement("div"); d.innerHTML = html; return (d.textContent||"").replace(/\s+/g," ").trim(); }

let wrongFilter = "ALL";

/* ================= 실전 모의고사 ================= */
const MOCK_HIST = "seoik_mock_hist_v1";
let mockSid = "sci", mockCount = 26, mockTimerOn = true;
function loadMockHist(){ try{ return JSON.parse(localStorage.getItem(MOCK_HIST) || "[]"); }catch(e){ return []; } }
function mockMinutes(n){ return Math.max(5, Math.round(n*50/26)); }
function mockPool(sid){
  const s = subjById(sid), pool = [];
  s.units.forEach((u,ui)=>{
    const arr = [];
    u.indices.forEach(set=>{ (s.quiz[set]||[]).forEach((q,qi)=>{ if(q.type!=="order") arr.push({sid, set, q:qi, ui}); }); });
    pool.push(shuffle(arr));
  });
  return pool;
}
function pickMockItems(sid, n){
  const pool = mockPool(sid).filter(a=>a.length), out = [];
  let k = 0;
  while(out.length<n && pool.some(a=>a.length)){
    const a = pool[k % pool.length]; if(a.length) out.push(a.pop()); k++;
  }
  return shuffle(out);
}
function renderMock(){
  const body = document.getElementById("mockBody");
  const hist = loadMockHist().slice(-6).reverse();
  const total = mockPool(mockSid).reduce((a,b)=>a+b.length,0);
  if(mockCount>total) mockCount = total;
  body.innerHTML =
    '<div class="mk-card"><div class="mk-row-t">과목</div><div class="sub-toggle mk-chips" id="mockSubj">'+
      SUBJECTS.map(s=>'<button data-sid="'+s.id+'" class="'+(mockSid===s.id?"active":"")+'">'+escapeHtml(s.name)+'</button>').join("")+'</div>'+
    '<div class="mk-row-t">문항 수 <small>(전체 '+total+'문항에서 단원별로 고르게 뽑아요)</small></div><div class="mk-seg" id="mockCnt">'+
      [10,20,26].map(n=>'<button data-n="'+n+'" class="'+(mockCount===n?"active":"")+'">'+n+'문항</button>').join("")+'</div>'+
    '<div class="mk-row-t">시간</div><div class="mk-seg" id="mockTime">'+
      '<button data-t="1" class="'+(mockTimerOn?"active":"")+'">'+mockMinutes(mockCount)+'분 타이머</button><button data-t="0" class="'+(!mockTimerOn?"active":"")+'">시간 제한 없음</button></div>'+
    '<p class="mk-note">시험처럼 풀고 마지막에 한꺼번에 채점해요. 답은 제출 전까지 바꿀 수 있고, 위쪽 번호를 눌러 다른 문제로 이동할 수 있어요. 틀린 문제는 오답노트에 저장돼요.</p>'+
    '<button class="btn mk-start" id="mockStartBtn">'+escapeHtml(subjById(mockSid).name)+' '+mockCount+'문항 시작</button></div>'+
    (hist.length ? '<div class="section-label">최근 모의고사</div><div class="mk-hist">'+hist.map(r=>{
      const d = new Date(r.ts);
      return '<div class="mk-h"><span>'+(d.getMonth()+1)+'.'+d.getDate()+' '+escapeHtml(r.name)+' '+r.n+'문항</span><b>'+r.pct+'점</b></div>';
    }).join("")+'</div>' : '');
  body.querySelectorAll("#mockSubj button").forEach(b=> b.onclick = ()=>{ mockSid = b.dataset.sid; mockCount = mockSid==="sci" ? 26 : 20; renderMock(); });
  body.querySelectorAll("#mockCnt button").forEach(b=> b.onclick = ()=>{ mockCount = +b.dataset.n; renderMock(); });
  body.querySelectorAll("#mockTime button").forEach(b=> b.onclick = ()=>{ mockTimerOn = b.dataset.t==="1"; renderMock(); });
  document.getElementById("mockStartBtn").onclick = startMock;
}
function startMock(){
  const items = pickMockItems(mockSid, mockCount);
  if(!items.length) return;
  mockState = { sid:mockSid, answers: items.map(()=>({order:null, picked:null})), endAt: mockTimerOn ? Date.now()+mockMinutes(items.length)*60000 : null, done:false };
  startCustomQuiz("mock", items.map(({sid,set,q})=>({sid,set,q})), subjById(mockSid).name+" 실전 모의고사", items.length+"문항"+(mockTimerOn? " · "+mockMinutes(items.length)+"분":" · 시간 제한 없음"), "mock");
  stopMockTimer();
  tickMock();
  if(mockState.endAt) mockState.timerId = setInterval(tickMock, 1000);
}
function stopMockTimer(){ if(mockState && mockState.timerId){ clearInterval(mockState.timerId); mockState.timerId = null; } }
function tickMock(){
  const el = document.getElementById("mockTimer");
  if(!mockState || !mockState.endAt){ el.hidden = true; return; }
  const left = Math.max(0, mockState.endAt - Date.now());
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  el.hidden = false;
  el.textContent = "남은 시간 " + m + ":" + String(s).padStart(2,"0");
  el.classList.toggle("urgent", left < 5*60000);
  if(left<=0 && !mockState.done){ alert("시간이 끝났어요. 지금까지 푼 답으로 채점할게요."); finishMock(true); }
}
function finishMock(timeUp){
  stopMockTimer();
  mockState.done = true;
  document.getElementById("mockTimer").hidden = true;
  const res = quizItems.map((it,i)=>{
    const q = subjById(it.sid).quiz[it.set][it.q];
    const a = mockState.answers[i];
    const ok = a.picked===q.correct;
    recordAnswer(it, ok);
    return {it, q, a, ok};
  });
  const score = res.filter(r=>r.ok).length, n = res.length, pct = Math.round(score/n*100);
  const sj = subjById(mockState.sid);
  const byUnit = {};
  res.forEach(r=>{ const u = sj.units.find(u=>u.indices.includes(r.it.set)); const k = u? u.name : "기타"; (byUnit[k] = byUnit[k] || {n:0, ok:0}); byUnit[k].n++; if(r.ok) byUnit[k].ok++; });
  const hist = loadMockHist(); hist.push({ts:Date.now(), sid:sj.id, name:sj.name, n, score, pct}); try{ localStorage.setItem(MOCK_HIST, JSON.stringify(hist.slice(-30))); }catch(e){}
  quizCells = res.map(r=> r.ok ? "correct" : "wrong"); renderQuizTrack();
  if(sheetState) setTimeout(paintMockSheet, 0);
  document.getElementById("quizArea").style.display = "none";
  const ra = document.getElementById("resultArea"); ra.style.display = "block";
  const unitRows = Object.entries(byUnit).map(([k,v])=>{

function dayDiff(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((new Date(y,m-1,d) - t0)/86400000);
}
function ddText(n){ return n>0 ? "D-"+n : n===0 ? "D-DAY" : "끝"; }
function fmtDay(dateStr){ const [y,m,d] = dateStr.split("-").map(Number); return m+"/"+d+"("+"일월화수목금토"[new Date(y,m-1,d).getDay()]+")"; }
function examOf(sid){
  for(const day of EXAM_SCHEDULE){ for(const it of day.items){ if(it.sid===sid) return Object.assign({date:day.date}, it); } }
  return null;
}
function nextExamDay(){ return EXAM_SCHEDULE.find(d=>dayDiff(d.date)>=0) || null; }

      '<div class="acc-arrow">›</div>';

function renderDrillList(){
  const list = document.getElementById("drillList");
  list.innerHTML = "";

  const subjList = drillSubjectId==="ALL" ? SUBJECTS : SUBJECTS.filter(s=>s.id===drillSubjectId);

const MARK_O = '<svg viewBox="0 0 44 44" aria-hidden="true"><path d="M24 5.5C13 4.6 5.2 11.8 5.6 22.4c.4 9.6 8.6 16.4 18.2 15.6 9.8-.8 15.4-8.6 14.4-17.6C37.2 11.6 30 6 20.5 7.4"/></svg>';
const MARK_X = '<svg viewBox="0 0 44 44" aria-hidden="true"><path d="M9 37 L36 6"/></svg>';
function enterQuiz(subject, globalIdx, fromTab){
  exitSheet();
  quizSubject = subject; quizSet = globalIdx; quizQ = 0; quizScore = 0;
  quizMode = "set"; stopMockTimer(); mockState = null;
  quizItems = subject.quiz[globalIdx].map((_,i)=>({sid:subject.id, set:globalIdx, q:i}));
  quizCells = new Array(quizItems.length).fill(""); quizReturnTab = fromTab;

document.getElementById("quizBackBtn").addEventListener("click", ()=>{

function renderQuizTrack(){
  const track = document.getElementById("track");
  track.innerHTML = "";
  for(let i=0;i<quizN();i++){
    const c = document.createElement("div");
    c.className = "cell" + (i===quizQ ? " now":"") + (quizCells[i] ? " "+quizCells[i] : "");
    c.textContent = quizCells[i]==="correct" ? "✓" : quizCells[i]==="wrong" ? "✕" : String(i+1);

function renderQuizQuestion(){
  if(quizQ===0 && !(sheetState) && sheetUsable()){ renderSheet(); return; }
  if(sheetState) return;
  exitSheet();
  quizAnswered = false;
  const qData = curQData();
  if(quizMode!=="set"){
    const it = curItem(), sj = subjById(it.sid);
    const u = sj.units.find(u=>u.indices.includes(it.set));
    document.getElementById("quizCrumb").textContent = sj.name + " · SET " + (it.set+1) + (u ? " · " + u.name : "");
  }
  if(qData.type==="order"){ renderOrderQuestion(qData); return; }
  document.getElementById("qstem").style.display = "";
  let order;
  if(quizMode==="mock"){
    const a = mockState.answers[quizQ];
    if(!a.order) a.order = qData.fixed ? [0,1,2,3,4] : shuffle([0,1,2,3,4]);
    order = a.order;
  } else order = qData.fixed ? [0,1,2,3,4] : shuffle([0,1,2,3,4]);
  quizShuffled = order.map(i=>qData.choices[i]);
  quizCorrectIdx = order.indexOf(qData.correct);

  document.getElementById("qnum").innerHTML = '<span class="qn">'+(quizQ+1)+'.</span><span class="qof">/ '+quizN()+'</span>' + (qData.hot ? '<span class="hot-badge">빈출</span>' : '') + (quizMode==="wrong" ? '<span class="hot-badge">오답</span>' : '');
  document.getElementById("qstem").innerHTML = qData.q;

  const choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";
  quizShuffled.forEach((text, idx)=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    const shown = (qData.fixed && text===CIRCLED[idx]) ? '' : escapeHtml(text);
    btn.innerHTML = '<span class="num">'+CIRCLED[idx]+'</span><span class="ctext">'+shown+'</span>';
    if(qData.fixed && !shown) btn.classList.add("pos-only");
    btn.addEventListener("click", ()=> onQuizAnswer(idx));
    choicesEl.appendChild(btn);
  });

  const fb = document.getElementById("feedback");
  fb.className = "feedback"; fb.style.display = "none";
  const nb0 = document.getElementById("nextBtn");
  nb0.style.display = "none";
  if(quizMode==="mock"){
    const a = mockState.answers[quizQ];
    if(a.picked!==null && a.picked!==undefined){
      const pos = a.order.indexOf(a.picked);
      const b = choicesEl.children[pos]; if(b) b.classList.add("picked");
    }
    nb0.textContent = quizQ===quizN()-1 ? "제출하고 채점하기" : "다음 문제";
    nb0.style.display = "inline-block";
  }
  renderQuizTrack();
}

/* ================= 문장 배열 문제 ================= */
let ordState = null;
const ORD_LETTERS = "ABCDEFGHIJKLMNOP";
function renderOrderQuestion(qData){
  const n = qData.sents.length;
  let perm;
  do { perm = shuffle([...Array(n).keys()]); } while(n>1 && perm.every((v,i)=>v===i));
  ordState = { q:qData, perm, picked:[] };

  document.getElementById("qnum").innerHTML = '<span class="qn">'+(quizQ+1)+'.</span><span class="qof">/ '+quizN()+'</span><span class="hot-badge" style="background:var(--blue-soft);color:var(--blue)">문장 배열</span>';
  document.getElementById("qstem").innerHTML = '<b>'+escapeHtml(qData.q)+'</b> · '+n+'문장<br><span style="font-size:14px;color:var(--ink-soft)">섞인 문장을 원래 순서대로 눌러서 배열하세요.</span>'+
    '<div class="ord-hint"><button type="button" id="ordHintBtn">주제 힌트 보기</button><span id="ordHintText" hidden>'+escapeHtml(qData.hint)+'</span></div>';
  document.getElementById("ordHintBtn").onclick = ()=>{ document.getElementById("ordHintText").hidden = false; document.getElementById("ordHintBtn").hidden = true; };
  const el = document.getElementById("choices");
  el.innerHTML =
    '<div class="ord">'+
      '<div class="ord-head"><span>내 배열</span><span id="ordCount"></span></div>'+
      '<div class="ord-slot" id="ordSlot"></div>'+
      '<div class="ord-actions"><button type="button" class="btn" id="ordGrade">채점하기</button><button type="button" class="btn ghost" id="ordUndo">하나 빼기</button><button type="button" class="btn ghost" id="ordClear">비우기</button><button type="button" class="btn ghost" id="ordReveal">정답 보기</button></div>'+
      '<div class="ord-head"><span>섞인 문장</span><span id="ordLeft"></span></div>'+
      '<div class="ord-pool" id="ordPool"></div>'+
    '</div>';
  document.getElementById("ordGrade").onclick = ()=> gradeOrder(false);
  document.getElementById("ordReveal").onclick = ()=> gradeOrder(true);
  document.getElementById("ordUndo").onclick = ()=>{ if(quizAnswered) return; ordState.picked.pop(); drawOrder(); };
  document.getElementById("ordClear").onclick = ()=>{ if(quizAnswered) return; ordState.picked = []; drawOrder(); };
  const fb = document.getElementById("feedback");
  fb.className = "feedback"; fb.style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  drawOrder();
  renderQuizTrack();
}
function drawOrder(result){
  const st = ordState, n = st.q.sents.length;
  const slot = document.getElementById("ordSlot"), pool = document.getElementById("ordPool");
  document.getElementById("ordCount").textContent = st.picked.length + " / " + n;
  document.getElementById("ordLeft").textContent = (n - st.picked.length) + "개 남음";
  slot.innerHTML = st.picked.length ? "" : '<div class="ord-empty">아래 문장을 누르면 여기에 순서대로 쌓여요. 잘못 넣은 문장은 다시 누르면 빠져요.</div>';
  st.picked.forEach((pi, pos)=>{
    const orig = st.perm[pi];
    const d = document.createElement("button");
    d.type = "button";
    d.className = "ord-card placed" + (result ? (orig===pos ? " ok" : " no") : "");
    d.innerHTML = '<span class="ord-no">'+(pos+1)+'</span><span class="ord-letter">'+ORD_LETTERS[pi]+'</span><span class="ord-text">'+escapeHtml(st.q.sents[orig])+'</span>';
    if(!quizAnswered) d.onclick = ()=>{ st.picked.splice(pos,1); drawOrder(); };
    slot.appendChild(d);
  });
  pool.innerHTML = "";
  st.perm.forEach((orig, pi)=>{
    const used = st.picked.includes(pi);
    const d = document.createElement("button");
    d.type = "button";
    d.className = "ord-card" + (used ? " used" : "");
    d.disabled = used || quizAnswered;
    d.innerHTML = '<span class="ord-letter">'+ORD_LETTERS[pi]+'</span><span class="ord-text">'+escapeHtml(st.q.sents[orig])+'</span>';
    d.onclick = ()=>{ if(quizAnswered || used) return; st.picked.push(pi); drawOrder(); };
    pool.appendChild(d);
  });
  const full = st.picked.length===n;
  const g = document.getElementById("ordGrade");
  g.disabled = !full || quizAnswered;
  ["ordUndo","ordClear","ordReveal"].forEach(id=> document.getElementById(id).disabled = quizAnswered);
}
function gradeOrder(reveal){
  if(quizAnswered) return;
  const st = ordState, n = st.q.sents.length;
  const answerLetters = [...Array(n).keys()].map(orig=> ORD_LETTERS[st.perm.indexOf(orig)]);
  let hits = 0;
  if(!reveal) st.picked.forEach((pi,pos)=>{ if(st.perm[pi]===pos) hits++; });
  const correct = !reveal && hits===n;
  quizAnswered = true;
  if(correct) quizScore++;
  quizCells[quizQ] = correct ? "correct" : "wrong";
  recordAnswer(curItem(), correct);
  if(reveal) st.picked = [...Array(n).keys()].map(orig=> st.perm.indexOf(orig));
  drawOrder(!reveal);
  const fb = document.getElementById("feedback");
  fb.classList.add("show", correct ? "is-correct" : "is-wrong");
  fb.style.display = "";
  document.getElementById("stampText").textContent = correct ? "완벽하게 배열했어요" : reveal ? "정답 순서를 확인해 보세요" : "위치가 맞은 문장 " + hits + " / " + n;
  document.getElementById("explainText").textContent = "정답 순서: " + answerLetters.join(" → ") + "\n" + st.q.explain;
  const nb = document.getElementById("nextBtn");
  nb.textContent = quizQ===quizN()-1 ? "결과 보기" : "다음 문제";
  nb.style.display = "inline-block";
  renderQuizTrack();
}

function onQuizAnswer(idx){
  if(quizMode==="mock"){
    const a = mockState.answers[quizQ];
    a.picked = a.order[idx];
    document.querySelectorAll("#choices .choice").forEach((b,i)=> b.classList.toggle("picked", i===idx));
    quizCells[quizQ] = "answered";
    renderQuizTrack();
    return;
  }
  if(quizAnswered) return;
  quizAnswered = true;
  const qData = curQData();
  const correct = idx===quizCorrectIdx;
  if(correct) quizScore++;
  quizCells[quizQ] = correct ? "correct" : "wrong";
  recordAnswer(curItem(), correct);

  document.querySelectorAll("#choices .choice").forEach((b,i)=>{
    b.disabled = true;
    if(i===quizCorrectIdx){ b.classList.add("pick-correct"); b.querySelector(".num").insertAdjacentHTML("beforeend", MARK_O); }
    else if(i===idx){ b.classList.add("pick-wrong"); b.querySelector(".num").insertAdjacentHTML("beforeend", MARK_X); }
    else b.classList.add("dim");
  });

  const fb = document.getElementById("feedback");
  fb.classList.add("show", correct ? "is-correct" : "is-wrong");
  fb.style.display = "";
  document.getElementById("stampText").textContent = correct ? "정답이에요" : "오답이에요 · 정답은 " + CIRCLED[quizCorrectIdx];
  document.getElementById("explainText").textContent = qData.explain;

  const nb = document.getElementById("nextBtn");
  nb.textContent = quizQ===quizN()-1 ? "결과 보기" : "다음 문제";
  nb.style.display = "inline-block";
  renderQuizTrack();
}
document.getElementById("nextBtn").addEventListener("click", ()=>{
  if(quizMode==="mock"){
    if(quizQ<quizN()-1){ quizQ++; renderQuizQuestion(); }
    else {
      const left = mockState.answers.filter(a=>a.picked===null||a.picked===undefined).length;
      if(left && !confirm("아직 "+left+"문제를 안 풀었어요. 그래도 제출할까요?")) return;
      finishMock(false);
    }
    window.scrollTo(0,0);
    return;
  }
  if(quizQ<quizN()-1){ quizQ++; renderQuizQuestion(); } else if(quizMode==="wrong"){ showWrongResult(); } else { showQuizResult(); }
  window.scrollTo(0,0);
});

function nextSetSameContext(){
  if(quizReturnTab === "study"){
    const unit = quizSubject.units.find(u => u.indices.includes(quizSet));
    if(!unit) return null;
    const sameDiff = unit.indices.filter(i => (isAdvanced(quizSubject,i)?"advanced":"basic") === (isAdvanced(quizSubject,quizSet)?"advanced":"basic"));
    const pos = sameDiff.indexOf(quizSet);
    if(pos>=0 && pos<sameDiff.length-1) return sameDiff[pos+1];
    return null;
  }
  if(quizReturnTab === "drill"){
    const diff = isAdvanced(quizSubject,quizSet) ? "advanced" : "basic";
    let pool = [];
    quizSubject.units.forEach(u=> u.indices.forEach(i=>{ if((isAdvanced(quizSubject,i)?"advanced":"basic")===diff) pool.push(i); }));
    const pos = pool.indexOf(quizSet);
    if(pos>=0 && pos<pool.length-1) return pool[pos+1];
    return null;
  }
  return null;
}
function showQuizResult(){
  document.getElementById("quizArea").style.display = "none";
  document.getElementById("resultArea").style.display = "block";

  progress[quizSubject.id][quizSet] = true;
  saveProgress(progress);

  const nextIdx = nextSetSameContext();
  const pct = Math.round((quizScore/quizN())*100);
  const msg = nextIdx!==null
    ? "다음 세트는 홈의 이어풀기에서도 열 수 있어요."
    : "이 단원의 마지막 세트까지 풀었어요. 다른 단원도 풀어 보세요.";

  const verdict = quizScore>=9 ? "거의 완벽해요" : quizScore>=7 ? "잘했어요" : quizScore>=5 ? "틀린 문제 해설을 다시 읽어 보세요" : "이 세트는 한 번 더 풀어 보세요";
  document.getElementById("resultArea").innerHTML =
    '<div class="result">'+
      '<div class="score-line">SET '+(quizSet+1)+' · '+escapeHtml(quizSubject.titles[quizSet])+'</div>'+
      '<div class="score"><b>'+pct+'</b><span>점</span><svg viewBox="0 0 200 18" preserveAspectRatio="none" aria-hidden="true"><path d="M4 7 C60 3,130 4,196 6 M14 14 C70 11,140 12,190 13"/></svg></div>'+
      '<h2>'+verdict+'</h2>'+
      '<p class="msg">'+quizN()+'문제 중 '+quizScore+'문제를 맞혔어요.<br>'+msg+'</p>'+
      '<div class="row">'+
        (nextIdx!==null ? '<button class="btn" id="reloadBtn">다음 세트 풀기 (SET '+(nextIdx+1)+')</button>' : '<button class="btn" id="doneBtn">목록으로</button>')+
        '<button class="btn ghost" id="retryBtn">이 세트 다시 풀기</button>'+
      '</div>'+
    '</div>';

  savePending(nextIdx!==null ? {subjectId:quizSubject.id, setIndex:nextIdx} : null);

  const reloadBtn = document.getElementById("reloadBtn");
  if(reloadBtn) reloadBtn.addEventListener("click", ()=> location.reload());
  const doneBtn = document.getElementById("doneBtn");
  if(doneBtn) doneBtn.addEventListener("click", ()=>{ savePending(null); goTab(quizReturnTab); });
  document.getElementById("retryBtn").addEventListener("click", ()=>{
    savePending({subjectId:quizSubject.id, setIndex:quizSet});
    location.reload();
  });
}


/* ================= 시험지(족보) 모드 ================= */
let sheetState = null;
function sheetUsable(){
  return quizItems.length > 0 && quizItems.every(it=>{
    const s = subjById(it.sid), q = s && s.quiz[it.set] && s.quiz[it.set][it.q];
    return q && q.type !== "order" && Array.isArray(q.choices);
  });
}
function sheetEl(){ return document.getElementById("sheet"); }
function exitSheet(){
  sheetState = null;
  document.body.classList.remove("sheet-mode");
  const sh = sheetEl(); sh.hidden = true; sh.innerHTML = "";
  const timer = document.getElementById("mockTimer");
  const head = document.querySelector("[data-view='quiz'] .quiz-header");
  if(timer && head && timer.parentNode !== head) head.insertBefore(timer, document.getElementById("top3Box"));
}
function sqWeight(q){ return 1 + (plainText(q.q).length + q.choices.join("").length) / 520; }
function sqCols(q, posOnly){
  if(posOnly) return "c5";
  const m = Math.max.apply(null, q.choices.map(c=>String(c).length));
  return m <= 4 ? "c5" : m <= 7 ? "c3" : "";
}
function sqHTML(i){
  const st = sheetState.items[i], q = st.q;
  const posOnly = !!q.fixed && st.order.every((o,k)=> q.choices[o] === CIRCLED[k]);
  const ch = st.order.map((o,k)=>{
    const t = String(q.choices[o]);
    const shown = (q.fixed && t === CIRCLED[k]) ? "" : escapeHtml(t);
    return '<li><button type="button" class="sq-c" data-i="'+i+'" data-k="'+k+'"><span class="sq-cn">'+CIRCLED[k]+'</span>'+(shown ? '<span class="sq-ct">'+shown+'</span>' : '')+'</button></li>';
  }).join("");
  const tags = (q.hot ? '<span class="sq-tag">빈출</span>' : '') + (quizMode==="wrong" ? '<span class="sq-tag">오답</span>' : '');
  return '<section class="sq" id="sq'+i+'">'+
    '<div class="sq-head"><span class="sq-no"><span class="sq-n">'+(i+1)+'.</span><span class="sq-grade"></span></span>'+
    '<div class="sq-stem">'+tags+q.q+'</div></div>'+
    '<ol class="sq-ch '+sqCols(q, posOnly)+'">'+ch+'</ol>'+
    '<div class="sq-exp" hidden></div></section>';
}
function sheetPages(){
  const n = sheetState.items.length, pages = [];
  let i = 0;
  while(i < n){
    const cap = pages.length === 0 ? 1.8 : 2.7, cols = [[], []];
    for(let c=0;c<2 && i<n;c++){
      let w = 0;
      while(i < n){
        const wi = sqWeight(sheetState.items[i].q);
        if(cols[c].length && w + wi > cap) break;
        cols[c].push(i); w += wi; i++;
        if(cols[c].length >= 2) break;
      }
    }
    pages.push(cols);
  }
  return pages;
}

  '</header>';

function renderSheet(){
  document.body.classList.add("sheet-mode");
  window.dispatchEvent(new Event("pen:clear"));
  sheetState = {
    items: quizItems.map((it,i)=>{
      const q = subjById(it.sid).quiz[it.set][it.q];
      const base = q.choices.map((_,k)=>k);
      let order;
      if(quizMode === "mock"){
        const a = mockState.answers[i];
        if(!a.order) a.order = q.fixed ? base : shuffle(base);
        order = a.order;
      } else order = q.fixed ? base : shuffle(base);
      return { q, order, picked:null, done:false };
    })
  };
  const pages = sheetPages();
  const isMock = quizMode === "mock";
  let html = '<div class="omr" id="omr"><div class="omr-cells" id="omrCells">'+
    quizItems.map((_,i)=>'<button type="button" class="omr-c" data-go="'+i+'" aria-label="'+(i+1)+'번 문항으로">'+(i+1)+'</button>').join("")+

  pages.forEach((cols, p)=>{

    html += '<article class="sh-page">'+
      (p === 0 ? sheetHeaderHTML() : '')+

      (p === pages.length-1
        ? '<p class="sh-end">※ 확인 사항: 모든 문항에 답을 골랐는지 확인하세요.'+(isMock ? ' 제출하면 한 번에 채점돼요.' : ' 답을 고르면 바로 채점되고 해설이 나와요.')+'</p>'+
          (isMock ? '<button type="button" class="btn sh-submit" id="shSubmit">답안 제출하고 채점하기</button>' : '')
        : '')+

  const sh = sheetEl();

  }

function renderOMR(){
  if(!sheetState) return;
  const cells = document.querySelectorAll("#omrCells .omr-c");
  let answered = 0;
  cells.forEach((c,i)=>{
    const st = sheetState.items[i], state = quizCells[i];
    c.classList.toggle("picked", quizMode==="mock" && !(mockState && mockState.done) && st.picked !== null);
    c.classList.toggle("correct", state === "correct");
    c.classList.toggle("wrong", state === "wrong");
    if(st.picked !== null || st.done) answered++;
  });
  const n = quizItems.length, meta = document.getElementById("omrMeta"), btn = document.getElementById("omrBtn");
  const finished = sheetState.items.every(s=>s.done);
  if(finished){
    const sc = quizCells.filter(c=>c==="correct").length;
    meta.textContent = sc + " / " + n + " 정답";
    btn.textContent = "결과 보기"; btn.hidden = false;
    btn.onclick = ()=> document.getElementById("resultArea").scrollIntoView({behavior:"smooth", block:"start"});
  } else {
    meta.textContent = answered + " / " + n;
    if(quizMode === "mock"){ btn.textContent = "제출"; btn.hidden = false; btn.onclick = submitMockSheet; }
    else btn.hidden = true;
  }
}
function paintPick(i, k){
  const box = document.getElementById("sq"+i);
  box.querySelectorAll(".sq-cn .mk-pencil").forEach(el=>el.remove());
  box.querySelectorAll(".sq-c").forEach(b=> b.classList.toggle("is-pick", +b.dataset.k === k));
  if(k === null || k < 0) return;
  const cn = box.querySelector('.sq-c[data-k="'+k+'"] .sq-cn');
  cn.insertAdjacentHTML("beforeend", MARK_O.replace("<svg ", '<svg class="mk-pencil" '));
}
function paintGrade(i){
  const st = sheetState.items[i], q = st.q, box = document.getElementById("sq"+i);
  const ans = st.order.indexOf(q.correct), ok = st.picked === ans;
  box.classList.add("done");
  box.querySelectorAll(".sq-c").forEach(b=>{ b.disabled = true; b.classList.toggle("is-answer", +b.dataset.k === ans); });
  if(!ok) box.querySelector('.sq-c[data-k="'+ans+'"] .sq-cn').insertAdjacentHTML("beforeend", MARK_O.replace("<svg ", '<svg class="mk-red" '));
  box.querySelector(".sq-grade").innerHTML = ok ? MARK_O : MARK_X;
  const exp = box.querySelector(".sq-exp");
  const head = ok ? "정답" : (st.picked === null ? "안 푼 문제 · 정답 " : "오답 · 정답 ") + CIRCLED[ans];
  exp.className = "sq-exp" + (ok ? " ok" : "");
  exp.innerHTML = '<span class="h">'+head+'</span>'+escapeHtml(String(q.explain || ""));
  exp.hidden = false;
}
function fillSheetScore(){
  const el = document.getElementById("shScore"); if(!el) return;
  const n = quizItems.length, sc = quizCells.filter(c=>c==="correct").length;
  el.innerHTML = Math.round(sc/n*100) + '<small>점</small>';
}
function onSheetAnswer(i, k){
  if(!sheetState) return;
  const st = sheetState.items[i];
  if(!st || st.done) return;
  if(quizMode === "mock"){
    if(!mockState || mockState.done) return;
    st.picked = k; mockState.answers[i].picked = st.order[k];
    quizCells[i] = "answered";
    paintPick(i, k); renderOMR();
    return;
  }
  st.picked = k; st.done = true; quizQ = i;
  const ok = st.order[k] === st.q.correct;
  if(ok) quizScore++;
  quizCells[i] = ok ? "correct" : "wrong";
  recordAnswer(quizItems[i], ok);
  paintPick(i, k); paintGrade(i);
  if(sheetState.items.every(s=>s.done)){
    fillSheetScore();
    if(quizMode === "wrong") showWrongResult(); else showQuizResult();
  }
  renderOMR();
}
function submitMockSheet(){
  if(!mockState || mockState.done) return;
  const left = mockState.answers.filter(a=>a.picked===null || a.picked===undefined).length;
  if(left && !confirm("아직 "+left+"문제를 안 풀었어요. 그래도 제출할까요?")) return;
  finishMock(false);
}
function paintMockSheet(){
  if(!sheetState) return;
  sheetState.items.forEach((st,i)=>{
    const a = mockState.answers[i];
    st.picked = (a.picked===null || a.picked===undefined) ? null : st.order.indexOf(a.picked);
    st.done = true;
    paintGrade(i);
  });
  const sub = document.getElementById("shSubmit"); if(sub) sub.remove();
  fillSheetScore(); renderOMR();
  setTimeout(()=> document.getElementById("resultArea").scrollIntoView({behavior:"smooth", block:"start"}), 350);
}
document.getElementById("sheet").addEventListener("click", e=>{
  const go = e.target.closest(".omr-c");
  if(go){ const t = document.getElementById("sq"+go.dataset.go); if(t) t.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const b = e.target.closest(".sq-c");
  if(b && !b.disabled) onSheetAnswer(+b.dataset.i, +b.dataset.k);
});


/* ================= 게시판 (공개 글 + 나만 보기) ================= */
const BOARD_KEY = "seoik_board_posts_v1";
const BOARD_PENDING = "seoik_board_pending_v1";
const BOARD_CATS = ["한국사", "통합사회", "정보", "영어", "통합과학", "자유메모"];
let boardActiveCat = "전체";
let boardEditingId = null;
let boardCanPublish = null;   // null: 아직 모름, true/false
let boardBusy = false;

function loadSharedPosts(){
  try{
    const el = document.getElementById("boardShared");
    const arr = el ? JSON.parse(el.textContent || "[]") : [];
    return Array.isArray(arr) ? arr.map(p=>Object.assign({}, p, {shared:true})) : [];
  }catch(e){ return []; }
}
const SHARED_POSTS = loadSharedPosts();
function loadLocalPosts(){
  try{ const raw = localStorage.getItem(BOARD_KEY); return raw ? JSON.parse(raw) : []; }catch(e){ return []; }
}
function saveLocalPosts(posts){ try{ localStorage.setItem(BOARD_KEY, JSON.stringify(posts)); }catch(e){} }
function allPosts(){ return SHARED_POSTS.concat(loadLocalPosts().map(p=>Object.assign({}, p, {shared:false}))); }
function fmtDate(ts){
  const d = new Date(ts);
  const pad = n => String(n).padStart(2,"0");
  return (d.getMonth()+1)+"."+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}

/* --- 이 페이지를 새 버전으로 다시 게시하기 (공개 글 저장) --- */
const PH_BLOB = "@@SRC_" + "BLOB@@", PH_DATA = "@@BOARD_" + "DATA@@";
async function buildPageHTML(sharedPosts){
  const b64 = document.getElementById("srcBlob").textContent.trim();
  const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
  const tmpl = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  const clean = sharedPosts.map(p=>({ id:p.id, cat:p.cat, title:p.title, content:p.content, ts:p.ts }));
  const data = JSON.stringify(clean).replace(/</g, "\\u003c");
  return tmpl.split(PH_BLOB).join(b64).split(PH_DATA).join(data);
}
let artifactNsPromise = null;
function getArtifactNs(){
  if(!artifactNsPromise) artifactNsPromise = (window.claude && window.claude.use) ? window.claude.use("artifact").catch(()=>null) : Promise.resolve(null);
  return artifactNsPromise;
}
async function detectPublish(){
  if(!document.getElementById("srcBlob") || !(window.claude && window.claude.use) || typeof DecompressionStream==="undefined"){ boardCanPublish = false; return; }
  try{
    const user = await window.claude.use("user");
    if(user && typeof user.canEdit === "function"){
      const can = await user.canEdit();
      if(can === false){ boardCanPublish = false; return; }
    }
    const ns = await getArtifactNs();
    boardCanPublish = !!ns;
  }catch(e){ boardCanPublish = false; }
  if(document.querySelector('[data-view="board"].show')) renderBoard();
}
function showBoardBusy(msg){
  let o = document.getElementById("boardBusy");
  if(!o){ o = document.createElement("div"); o.id = "boardBusy"; o.className = "board-busy"; document.body.appendChild(o); }
  o.innerHTML = msg ? '<div class="bb-card"><div class="bb-spin"></div><div>'+escapeHtml(msg)+'</div></div>' : "";
  o.style.display = msg ? "flex" : "none";
}
async function publishShared(nextShared, pendingDraft){
  if(boardBusy) return false;
  boardBusy = true;
  try{
    const ns = await getArtifactNs();
    if(!ns){ boardCanPublish = false; throw {code:"not_granted"}; }
    showBoardBusy("게시판에 올리는 중이에요… 끝나면 페이지가 새로고침돼요.");
    if(pendingDraft){ try{ sessionStorage.setItem(BOARD_PENDING, JSON.stringify(pendingDraft)); }catch(e){} }
    const html = await buildPageHTML(nextShared);
    let tries = 0;
    while(true){
      try{ await ns.publish(html); break; }
      catch(err){
        if(err && err.code==="upstream_error" && tries===0){ tries++; await new Promise(r=>setTimeout(r, 800+Math.random()*800)); continue; }
        throw err;
      }
    }
    return true;   // 곧 새 버전으로 새로고침됨
  }catch(err){
    showBoardBusy("");
    const code = err && err.code;
    if(code==="conflict") return true; // 다른 버전이 먼저 올라가 새로고침 중
    if(["not_writer","not_granted","not_declared","capability_disabled","capability_removed","consent_required"].includes(code)){
      boardCanPublish = false;
      alert("이 화면은 보기 전용이라 공개 글을 올릴 수 없어요. '나만 보기'로는 저장할 수 있어요.");
    } else if(code==="rate_limited"){
      alert("너무 자주 올렸어요. 잠시 후 다시 시도해 주세요.");
    } else if(code==="too_large"){
      alert("게시판 용량이 너무 커졌어요. 오래된 공개 글을 지운 뒤 다시 시도해 주세요.");
    } else {
      alert("공개 글을 올리지 못했어요. 잠시 후 다시 시도해 주세요.");
    }
    try{ sessionStorage.removeItem(BOARD_PENDING); }catch(e){}
    boardBusy = false;
    return false;
  }
}

function renderBoard(){
  document.getElementById("boardListView").style.display = "block";
  document.getElementById("boardWriteView").style.display = "none";
  document.getElementById("boardDetailView").style.display = "none";
  document.getElementById("boardFab").style.display = "flex";

  const note = document.getElementById("boardNote");
  if(note){
    note.textContent = boardCanPublish===false
      ? "공개 글은 링크로 들어온 모두가 볼 수 있어요. 이 화면에서는 '나만 보기' 글만 쓸 수 있어요."
      : "'공개' 글은 서익닷컴을 여는 모든 사람에게 보여요. '나만 보기' 글은 이 기기에만 저장돼요.";
  }

  const catWrap = document.getElementById("boardCats");
  catWrap.innerHTML = "";
  ["전체"].concat(BOARD_CATS).forEach(cat=>{
    const b = document.createElement("button");
    b.textContent = cat;
    if(cat===boardActiveCat) b.classList.add("active");
    b.addEventListener("click", ()=>{ boardActiveCat = cat; renderBoard(); });
    catWrap.appendChild(b);
  });

  const posts = allPosts().sort((a,b)=> b.ts - a.ts);
  const filtered = boardActiveCat==="전체" ? posts : posts.filter(p=>p.cat===boardActiveCat);
  const listEl = document.getElementById("boardList");
  listEl.innerHTML = "";
  if(filtered.length===0){
    listEl.innerHTML = '<div class="empty-note">아직 작성된 글이 없어요.<br>오른쪽 아래 + 버튼으로 글을 남겨 보세요.</div>';
    return;
  }
  filtered.forEach(p=>{
    const card = document.createElement("div");
    card.className = "board-post";
    card.innerHTML =
      '<div class="bp-top"><span class="bp-cat">'+escapeHtml(p.cat)+'</span><span class="bp-vis '+(p.shared?'pub':'priv')+'">'+(p.shared?'공개':'나만 보기')+'</span><span class="bp-date">'+fmtDate(p.ts)+'</span></div>' +
      '<div class="bp-title">'+escapeHtml(p.title)+'</div>' +
      '<div class="bp-preview">'+escapeHtml(p.content)+'</div>';
    card.addEventListener("click", ()=> renderBoardDetail(p.id));
    listEl.appendChild(card);
  });
}

function renderBoardWrite(editId, draft){
  boardEditingId = editId || null;
  document.getElementById("boardListView").style.display = "none";
  document.getElementById("boardDetailView").style.display = "none";
  document.getElementById("boardWriteView").style.display = "block";
  document.getElementById("boardFab").style.display = "none";

  let editing = draft || null;
  if(!editing && boardEditingId){ editing = allPosts().find(p=>p.id===boardEditingId) || null; }

  const catWrap = document.getElementById("bwCats");
  catWrap.innerHTML = "";
  let selectedCat = editing ? editing.cat : BOARD_CATS[0];
  BOARD_CATS.forEach(cat=>{
    const b = document.createElement("button");
    b.textContent = cat;
    if(cat===selectedCat) b.classList.add("active");
    b.addEventListener("click", ()=>{
      selectedCat = cat;
      catWrap.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
    });
    catWrap.appendChild(b);
  });

  // 공개 범위
  const visWrap = document.getElementById("bwVis");
  const lockedVis = boardEditingId ? (editing && editing.shared ? "pub" : "priv") : null;
  let vis = lockedVis || (boardCanPublish===false ? "priv" : "pub");
  visWrap.innerHTML = "";
  [["pub","공개 (모두에게 보여요)"],["priv","나만 보기 (이 기기에만)"]].forEach(([k,label])=>{
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.dataset.vis = k;
    const disabled = (k==="pub" && boardCanPublish===false) || (lockedVis && lockedVis!==k);
    b.disabled = !!disabled;
    if(k===vis) b.classList.add("active");
    b.addEventListener("click", ()=>{ if(b.disabled) return; vis = k; visWrap.querySelectorAll("button").forEach(x=>x.classList.toggle("active", x===b)); });
    visWrap.appendChild(b);
  });

  document.getElementById("bwTitle").value = editing ? editing.title : "";
  document.getElementById("bwContent").value = editing ? editing.content : "";

  document.getElementById("bwSave").onclick = async ()=>{
    const title = document.getElementById("bwTitle").value.trim();
    const content = document.getElementById("bwContent").value.trim();
    const cat = catWrap.querySelector("button.active") ? catWrap.querySelector("button.active").textContent : BOARD_CATS[0];
    if(!title || !content){ alert("제목과 내용을 모두 입력해주세요."); return; }
    if(vis==="pub"){
      let next;
      const now = Date.now();
      if(boardEditingId && SHARED_POSTS.some(p=>p.id===boardEditingId)){
        next = SHARED_POSTS.map(p=> p.id===boardEditingId ? Object.assign({}, p, {cat, title, content}) : p);
      } else {
        next = SHARED_POSTS.concat([{ id:"s"+now+Math.floor(Math.random()*1000), cat, title, content, ts:now }]);
      }
      const ok = await publishShared(next, {cat, title, content, editId: boardEditingId});
      if(!ok) renderBoardWrite(boardEditingId, {cat, title, content, shared: !!lockedVis});
      return;
    }
    let posts = loadLocalPosts();
    if(boardEditingId){
      posts = posts.map(p=> p.id===boardEditingId ? Object.assign({}, p, {cat, title, content}) : p);
    } else {
      posts.push({ id: "p"+Date.now()+Math.floor(Math.random()*1000), cat, title, content, ts: Date.now() });
    }
    saveLocalPosts(posts);
    renderBoard();
  };
  document.getElementById("bwCancel").onclick = ()=>{ renderBoard(); };
}

function renderBoardDetail(id){
  const p = allPosts().find(x=>x.id===id);
  document.getElementById("boardListView").style.display = "none";
  document.getElementById("boardWriteView").style.display = "none";
  document.getElementById("boardFab").style.display = "none";
  const detailEl = document.getElementById("boardDetailView");
  detailEl.style.display = "block";
  if(!p){ detailEl.innerHTML = '<div class="empty-note">글을 찾을 수 없어요.</div>'; return; }
  const canModify = !p.shared || boardCanPublish!==false;
  detailEl.innerHTML =
    '<div class="board-detail">' +
      '<div class="bd-top"><span class="bp-cat">'+escapeHtml(p.cat)+'</span><span class="bp-vis '+(p.shared?'pub':'priv')+'">'+(p.shared?'공개':'나만 보기')+'</span><span class="bp-date">'+fmtDate(p.ts)+'</span></div>' +
      '<div class="bd-title">'+escapeHtml(p.title)+'</div>' +
      '<div class="bd-content">'+escapeHtml(p.content)+'</div>' +
      '<div class="bd-actions">' +
        '<button class="bd-back" id="bdBack">‹ 목록으로</button>' +
        (canModify ? '<button class="bd-back" id="bdEdit">수정하기</button><button class="bd-delete" id="bdDelete">삭제하기</button>' : '') +
      '</div>' +
    '</div>';
  document.getElementById("bdBack").addEventListener("click", renderBoard);
  if(!canModify) return;
  document.getElementById("bdEdit").addEventListener("click", ()=> renderBoardWrite(p.id));
  document.getElementById("bdDelete").addEventListener("click", async ()=>{
    if(!confirm(p.shared ? "이 공개 글을 삭제할까요? 모든 사람의 게시판에서 사라져요." : "이 글을 삭제할까요?")) return;
    if(p.shared){ await publishShared(SHARED_POSTS.filter(x=>x.id!==id), null); return; }
    saveLocalPosts(loadLocalPosts().filter(x=>x.id!==id));
    renderBoard();
  });
}

/* ================= 펜 필기 기능 (시험지 위에 붙어서 같이 스크롤) ================= */
(function(){
"use strict";
const fab = document.getElementById("penFab");
const toolbar = document.getElementById("penToolbar");
const oldCanvas = document.getElementById("penCanvas");
if(oldCanvas) oldCanvas.remove();
const host = document.querySelector('[data-view="quiz"] .paper');
if(!fab || !toolbar || !host) return;
const NS = "http://www.w3.org/2000/svg";
const layer = document.createElementNS(NS, "svg");
layer.setAttribute("class", "ink-layer");
layer.setAttribute("aria-hidden", "true");
host.appendChild(layer);

let penColor = "#1a1a1a", penWidth = 2.5, eraserMode = false, penActive = false;
let cur = null, pts = null, lastW = host.clientWidth;

function clearInk(){ while(layer.firstChild) layer.removeChild(layer.firstChild); }
window.addEventListener("resize", function(){
  const w = host.clientWidth;
  if(Math.abs(w - lastW) > 2){ clearInk(); lastW = w; }
});
window.addEventListener("pen:clear", clearInk);

function setPenActive(on){
  penActive = on;
  fab.classList.toggle("active", on);
  layer.classList.toggle("active", on);
  toolbar.classList.toggle("show", on);
}
fab.addEventListener("click", function(){ setPenActive(!penActive); });
window.addEventListener("pen:leave", function(){ if(penActive) setPenActive(false); clearInk(); });
document.getElementById("penOff").addEventListener("click", function(){ setPenActive(false); });

/* 애플펜슬로 그릴 때 화면이 같이 스크롤되지 않게 (손가락은 스크롤 그대로) */
function stopStylusScroll(e){
  for(let i=0;i<e.changedTouches.length;i++){
    if(e.changedTouches[i].touchType === "stylus"){ e.preventDefault(); return; }
  }
}
layer.addEventListener("touchstart", stopStylusScroll, {passive:false});
layer.addEventListener("touchmove", stopStylusScroll, {passive:false});

function pos(e){
  const r = layer.getBoundingClientRect();
  return [Math.round((e.clientX - r.left)*10)/10, Math.round((e.clientY - r.top)*10)/10];
}
function pathD(p){
  let d = "M" + p[0][0] + " " + p[0][1];
  if(p.length === 1) return d + " l0.01 0";
  for(let i=1;i<p.length-1;i++){
    const mx = Math.round((p[i][0]+p[i+1][0])*5)/10, my = Math.round((p[i][1]+p[i+1][1])*5)/10;
    d += " Q" + p[i][0] + " " + p[i][1] + " " + mx + " " + my;
  }
  const l = p[p.length-1];
  return d + " L" + l[0] + " " + l[1];
}
function eraseAt(e){
  [[0,0],[7,0],[-7,0],[0,7],[0,-7]].forEach(function(o){
    document.elementsFromPoint(e.clientX+o[0], e.clientY+o[1]).forEach(function(el){
      if(el.parentNode === layer) el.remove();
    });
  });
}
layer.addEventListener("pointerdown", function(e){
  if(!penActive || e.pointerType === "touch") return; // 손가락은 스크롤, 펜만 필기
  e.preventDefault();
  try{ layer.setPointerCapture(e.pointerId); }catch(err){}
  if(eraserMode){ cur = "erase"; eraseAt(e); return; }
  pts = [pos(e)];
  cur = document.createElementNS(NS, "path");
  cur.setAttribute("stroke", penColor);
  cur.setAttribute("stroke-width", penWidth);
  cur.setAttribute("d", pathD(pts));
  layer.appendChild(cur);
});
layer.addEventListener("pointermove", function(e){
  if(!cur || e.pointerType === "touch") return;
  e.preventDefault();
  if(cur === "erase"){ eraseAt(e); return; }
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  (evs.length ? evs : [e]).forEach(function(ev){ pts.push(pos(ev)); });
  cur.setAttribute("d", pathD(pts));
});
["pointerup","pointercancel","lostpointercapture"].forEach(function(ev){
  layer.addEventListener(ev, function(){ cur = null; pts = null; });
});

document.querySelectorAll(".pen-color").forEach(function(btn){
  btn.addEventListener("click", function(){
    penColor = btn.dataset.color;
    eraserMode = false;
    document.querySelectorAll(".pen-color").forEach(function(b){ b.classList.remove("active"); });
    btn.classList.add("active");
    document.getElementById("penEraser").classList.remove("active");
  });
});
document.getElementById("penThin").addEventListener("click", function(){
  penWidth = 2.5;
  this.classList.add("active");
  document.getElementById("penThick").classList.remove("active");
});
document.getElementById("penThick").addEventListener("click", function(){
  penWidth = 6;
  this.classList.add("active");
  document.getElementById("penThin").classList.remove("active");
});
document.getElementById("penEraser").addEventListener("click", function(){
  eraserMode = true;
  this.classList.add("active");
  document.querySelectorAll(".pen-color").forEach(function(b){ b.classList.remove("active"); });
});
document.getElementById("penClear").addEventListener("click", clearInk);

/* 한 문제씩 푸는 화면(배열 문제)에서는 문제가 바뀌면 필기 지우기 */
["qstem","qnum"].forEach(function(id){
  const el = document.getElementById(id);
  if(!el) return;
  new MutationObserver(function(){ if(!document.body.classList.contains("sheet-mode")) clearInk(); })
    .observe(el, { childList:true, characterData:true, subtree:true });
});
document.querySelectorAll(".bottomnav button").forEach(function(b){
  b.addEventListener("click", function(){ clearInk(); setPenActive(false); });
});
})();
</script>
</body>
</html>
