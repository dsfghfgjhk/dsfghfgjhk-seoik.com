<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>서익닷컴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF0F4; --card:#FFFFFF; --border:#DCE1E9; --line-soft:#E9ECF1;
    --ink:#15213A; --ink-soft:#4E586D; --ink-faint:#8B94A6;
    --navy:#16233F; --navy-2:#24365C; --mark:#16233F;
    --blue:#2350E6; --blue-soft:#E8EEFE; --blue-dark:#1A3DB8;
    --red:#D8342A; --red-soft:#FCECEA;
    --green:#1F8A57; --green-soft:#E6F4EC;
    --hl:#FFE36A;
    --radius:14px;
    --shadow:0 1px 2px rgba(21,33,58,.06), 0 4px 14px rgba(21,33,58,.05);
    --sans:'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --serif:'Noto Serif KR', 'AppleMyungjo', 'Batang', serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1420; --card:#161E2E; --border:#27314A; --line-soft:#1E2739;
      --ink:#E7EBF3; --ink-soft:#A4AEC3; --ink-faint:#6B768E;
      --navy:#0A101C; --navy-2:#17233C; --mark:#D9E1F2;
      --blue:#7090FF; --blue-soft:#1B284D; --blue-dark:#A3B6FF;
      --red:#FF6F62; --red-soft:#3A1D1D; --green:#4CC98A; --green-soft:#12301F;
      --hl:rgba(255,211,64,.38);
      --shadow:0 1px 2px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1420; --card:#161E2E; --border:#27314A; --line-soft:#1E2739;
    --ink:#E7EBF3; --ink-soft:#A4AEC3; --ink-faint:#6B768E;
    --navy:#0A101C; --navy-2:#17233C; --mark:#D9E1F2;
    --blue:#7090FF; --blue-soft:#1B284D; --blue-dark:#A3B6FF;
    --red:#FF6F62; --red-soft:#3A1D1D; --green:#4CC98A; --green-soft:#12301F;
    --hl:rgba(255,211,64,.38);
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }

  :root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    min-height:100%; padding-bottom:calc(66px + env(safe-area-inset-bottom,0px));
    -webkit-font-smoothing:antialiased; letter-spacing:-0.01em;
    -webkit-tap-highlight-color:transparent;
  }
  button, input, select, textarea{ font-family:inherit; }
  button:focus-visible, [tabindex]:focus-visible, select:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .app{ max-width:520px; margin:0 auto; min-height:100%; position:relative; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; min-height:56px;
    background:color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--border);
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  }
  .topbar .left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .topbar .logo{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:18px; letter-spacing:-0.03em; }
  .logo-mark{ width:24px; height:24px; border-radius:7px; background:var(--navy); position:relative; flex-shrink:0; }
  .logo-mark::before, .logo-mark::after{ content:""; position:absolute; width:6px; height:9px; border-radius:50%; top:7.5px; }
  .logo-mark::before{ left:5px; background:#fff; }
  .logo-mark::after{ right:5px; border:1.4px solid rgba(255,255,255,.7); }
  :root[data-theme="dark"] .logo-mark{ background:#2A3B63; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-mark{ background:#2A3B63; } }
  .topbar .title{ font-weight:700; font-size:17px; letter-spacing:-0.02em; }
  .topbar .right{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); }
  .topbar .right > span{ cursor:pointer; font-size:13px; font-weight:600; }
  #nameTagHome{ padding:5px 10px; border-radius:99px; background:var(--bg); color:var(--ink-soft); cursor:default !important; }
  .icon-btn{ width:38px; height:38px; border:none; background:transparent; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; color:var(--ink); cursor:pointer; padding:0; }
  .icon-btn svg{ width:21px; height:21px; }
  .icon-btn:active{ background:var(--bg); }

  [data-view]{ display:none; }
  [data-view].show{ display:block; }

  /* ---------- HOME: OMR 답안지 ---------- */
  .home-greet{ padding:22px 20px 4px; }
  .home-greet h1{ margin:0; font-size:23px; font-weight:700; letter-spacing:-0.04em; line-height:1.35; }
  .home-greet p{ margin:6px 0 0; font-size:13px; color:var(--ink-soft); }

  .omr{
    margin:16px 16px 0; background:var(--card); border-radius:18px; overflow:hidden;
    border:1px solid var(--border); box-shadow:var(--shadow);
  }
  .omr-head{ background:var(--navy); color:#fff; padding:14px 16px 13px; display:flex; align-items:flex-end; justify-content:space-between; gap:10px; }
  .omr-head .oh-title{ font-size:15px; font-weight:700; letter-spacing:-0.02em; }
  .omr-head .oh-sub{ font-size:11.5px; color:#AEBBD6; margin-top:3px; }
  .omr-head .oh-pct{ font-family:var(--serif); font-size:28px; font-weight:700; line-height:1; letter-spacing:-0.03em; }
  .omr-head .oh-pct small{ font-size:13px; margin-left:1px; font-weight:500; color:#AEBBD6; }
  .omr-row{
    display:grid; grid-template-columns:78px 1fr; align-items:stretch; cursor:pointer;
    border-top:1px solid var(--line-soft);
  }
  .omr-row:first-child{ border-top:none; }
  .omr-row:active{ background:var(--bg); }
  .omr-subj{ padding:12px 10px 12px 14px; border-right:1.5px solid var(--subj, var(--border)); display:flex; flex-direction:column; justify-content:center; gap:3px; }
  .omr-subj b{ font-size:14px; font-weight:700; letter-spacing:-0.03em; color:var(--ink); }
  .omr-subj span{ font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .omr-bubbles{ display:flex; flex-wrap:wrap; gap:5px 5px; padding:12px 14px; align-content:center; }
  .bub{
    width:12px; height:17px; border-radius:50%; border:1.3px solid color-mix(in srgb, var(--subj, var(--ink-faint)) 55%, var(--border));
    background:transparent; flex-shrink:0;
  }
  .bub.on{ background:var(--mark); border-color:var(--mark); }

  .resume-card{
    margin:12px 16px 0; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px; display:flex; align-items:center;
    justify-content:space-between; gap:12px; box-shadow:var(--shadow); cursor:pointer;
  }
  .resume-card .r-left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .resume-card .r-badge{
    width:40px; height:40px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--blue); color:#fff; font-size:0;
  }
  .resume-card .r-badge::before{ content:""; border-left:11px solid #fff; border-top:7px solid transparent; border-bottom:7px solid transparent; margin-left:3px; }
  .resume-card .r-text{ min-width:0; }
  .resume-card .r-text b{ font-size:14.5px; font-weight:700; display:block; }
  .resume-card .r-text div{ font-size:12px; color:var(--ink-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .resume-card .r-arrow{ color:var(--ink-faint); font-size:20px; }

  .section-label{ margin:26px 20px 10px; font-size:14px; font-weight:700; color:var(--ink); letter-spacing:-0.02em; }

  .quicklinks{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 16px 8px; }
  .qlink{
    text-align:left; padding:16px; border-radius:var(--radius); cursor:pointer;
    border:1px solid var(--border); background:var(--card); box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .qlink .q-emoji{ display:none; }
  .qlink .q-label{ font-size:15px; font-weight:700; letter-spacing:-0.02em; }
  .qlink .q-desc{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; line-height:1.45; }
  .qlink .q-level{ display:flex; gap:3px; margin-bottom:12px; }
  .qlink .q-level i{ width:14px; height:4px; border-radius:2px; background:var(--border); }
  .qlink.basic .q-level i:nth-child(1){ background:var(--blue); }
  .qlink.advanced .q-level i{ background:var(--red); }

  /* ---------- subject chips ---------- */
  .sub-toggle{ display:flex; gap:8px; padding:14px 16px 2px; overflow-x:auto; scrollbar-width:none; }
  .sub-toggle::-webkit-scrollbar{ display:none; }
  .sub-toggle button{
    flex-shrink:0; padding:8px 14px; border-radius:99px; border:1px solid var(--border);
    background:var(--card); color:var(--ink-soft); font-weight:600; font-size:13px; cursor:pointer;
  }
  .sub-toggle button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  :root[data-theme="dark"] .sub-toggle button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sub-toggle button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); } }

  .study-head{ padding:16px 20px 4px; }
  .study-head h2{ margin:0; font-size:20px; font-weight:700; letter-spacing:-0.03em; }
  .study-head p{ margin:4px 0 0; font-size:12.5px; color:var(--ink-soft); }
  .study-sec-head{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:12px; color:var(--ink-faint); }

  /* ---------- accordion lists (study / drill) ---------- */
  .tabrow{ display:flex; margin:14px 16px 0; padding:4px; background:var(--card); border:1px solid var(--border); border-radius:12px; }
  .tabrow button{
    flex:1; background:none; border:none; padding:10px 4px; font-size:13.5px; font-weight:700;
    color:var(--ink-faint); cursor:pointer; border-radius:9px;
  }
  .tabrow button.active{ color:#fff; background:var(--navy); }
  .filterrow{ display:flex; gap:8px; padding:12px 16px 6px; overflow-x:auto; }
  .filterrow select{
    appearance:none; -webkit-appearance:none; max-width:100%;
    border:1px solid var(--border); background:var(--card) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0L5 6L10 0" fill="%238B94A6"/></svg>') no-repeat right 12px center;
    border-radius:10px; padding:10px 30px 10px 12px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; flex-shrink:0;
  }
  .acc-list{ padding:6px 16px 16px; }
  .acc-item{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; box-shadow:var(--shadow); }
  .acc-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:15px 16px; cursor:pointer; }
  .acc-head .acc-num{ font-family:var(--serif); font-size:13px; font-weight:700; color:var(--subj, var(--ink-faint)); margin-bottom:3px; }
  .acc-head .acc-title{ font-size:15px; font-weight:700; letter-spacing:-0.02em; line-height:1.4; }
  .acc-head .acc-meta{ font-size:11.5px; color:var(--ink-faint); margin-top:6px; display:flex; align-items:center; gap:8px; }
  .acc-meta .mini-bar{ flex:0 0 64px; height:4px; border-radius:2px; background:var(--line-soft); overflow:hidden; }
  .acc-meta .mini-bar i{ display:block; height:100%; background:var(--subj, var(--navy)); }
  .acc-head .acc-arrow{ color:var(--ink-faint); font-size:18px; transition:transform .18s; flex-shrink:0; }
  .acc-item.open .acc-arrow{ transform:rotate(90deg); }
  .acc-body{ display:none; border-top:1px solid var(--line-soft); padding:4px 0 6px !important; }
  .acc-item.open .acc-body{ display:block; }
  .acc-body .study-sec-head{ padding:12px 16px 4px !important; font-size:11.5px !important; }
  .acc-set-row{ display:flex; align-items:center; gap:12px; padding:11px 16px; font-size:13.5px; cursor:pointer; }
  .acc-set-row:active{ background:var(--bg); }
  .acc-set-row .sr-bub{ width:13px; height:18px; border-radius:50%; border:1.4px solid var(--ink-faint); flex-shrink:0; }
  .acc-set-row .sr-bub.on{ background:var(--mark); border-color:var(--mark); }
  .acc-set-row .sr-main{ flex:1; min-width:0; }
  .acc-set-row .sr-no{ font-size:11px; color:var(--ink-faint); font-weight:600; font-variant-numeric:tabular-nums; }
  .acc-set-row .sr-title{ display:block; font-weight:600; line-height:1.4; margin-top:1px; }
  .acc-set-row .sr-tag{ font-size:10.5px; font-weight:700; padding:3px 7px; border-radius:6px; flex-shrink:0; }
  .sr-tag.basic{ color:var(--blue); background:var(--blue-soft); }
  .sr-tag.adv{ color:var(--red); background:var(--red-soft); }
  .acc-set-row .set-done, .acc-set-row .acc-arrow{ display:none; }
  .empty-note{ padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px; line-height:1.7; }

  /* ---------- 마이 ---------- */
  .my-stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin:16px 16px 0; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .my-stat{ padding:16px 8px; text-align:center; border-left:1px solid var(--line-soft); }
  .my-stat:first-child{ border-left:none; }
  .my-stat .m-num{ font-family:var(--serif); font-size:21px; font-weight:700; color:var(--ink); letter-spacing:-0.03em; }
  .my-stat .m-label{ font-size:11.5px; color:var(--ink-faint); margin-top:3px; }
  #myUnitList{ margin:0 16px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
  .my-subj-head{ display:flex; align-items:center; gap:10px; padding:14px 16px 6px; font-weight:700; font-size:14px; border-top:1px solid var(--line-soft); }
  .my-subj-head:first-child{ border-top:none; }
  .my-unit-row{ padding:8px 16px 10px; }
  .my-unit-name{ font-size:12.5px; font-weight:500; margin-bottom:6px; display:flex; justify-content:space-between; gap:10px; color:var(--ink-soft); }
  .my-unit-name span:last-child{ color:var(--ink-faint); font-variant-numeric:tabular-nums; flex-shrink:0; }
  .my-bar{ height:5px; background:var(--line-soft); border-radius:3px; overflow:hidden; }
  .my-bar-fill{ height:100%; background:var(--subj, var(--navy)); border-radius:3px; }
  .reset-btn{
    display:block; margin:18px 16px 24px; width:calc(100% - 32px); padding:13px; text-align:center;
    border:1px solid var(--border); border-radius:12px; background:transparent; color:var(--red);
    font-size:13px; font-weight:600; cursor:pointer;
  }

  /* ---------- QUIZ: 시험지 ---------- */
  .quiz-back{ display:inline-flex; align-items:center; gap:4px; margin:12px 12px 0; padding:8px 10px; background:none; border:none; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer; border-radius:8px; }
  .quiz-back:active{ background:var(--card); }
  .paper{ margin:8px 12px 0; background:var(--card); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow); padding-bottom:18px; }
  .quiz-header{ padding:16px 18px 14px; border-bottom:3px double var(--ink); margin:0 0 14px; }
  .quiz-crumb{ font-size:11.5px; color:var(--ink-faint); font-weight:600; margin-bottom:5px; }
  .quiz-settitle{ font-family:var(--serif); font-size:17px; font-weight:700; letter-spacing:-0.02em; line-height:1.4; }
  .track{ display:grid; grid-template-columns:repeat(10,1fr); gap:6px; padding:0 18px; margin-bottom:18px; }
  .track .cell{
    height:26px; border:1.4px solid var(--border); border-radius:50%;
    display:flex; align-items:center; justify-content:center; justify-self:center; width:19px;
    font-size:10.5px; font-weight:700; color:var(--ink-faint); font-variant-numeric:tabular-nums;
  }
  .track .cell.now{ border-color:var(--ink); color:var(--ink); }
  .track .cell.correct{ background:var(--mark); border-color:var(--mark); color:transparent; }
  .track .cell.wrong{ border-color:var(--red); color:var(--red); background:var(--red-soft); text-decoration:none; }

  #top3Box{ margin:0 18px 16px; padding:12px 14px; border-radius:10px; background:var(--bg); border:none; }
  .top3-badge{ font-size:12px; font-weight:700; color:var(--ink); margin-bottom:6px; }
  .top3-list{ margin:0; padding-left:0; list-style:none; }
  .top3-list li{ font-size:12.5px; color:var(--ink-soft); line-height:1.65; padding-left:14px; position:relative; }
  .top3-list li::before{ content:""; position:absolute; left:0; top:.62em; width:7px; height:7px; border-radius:2px; background:var(--hl); }
  .hot-badge{ display:inline-block; background:var(--red-soft); color:var(--red); font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:8px; vertical-align:middle; font-family:var(--sans); }

  .qnum{ padding:0 18px; margin-bottom:6px; display:flex; align-items:baseline; gap:6px; }
  .qnum .qn{ font-family:var(--serif); font-size:26px; font-weight:700; line-height:1; color:var(--ink); }
  .qnum .qof{ font-size:12px; color:var(--ink-faint); font-weight:600; }
  .qstem{ padding:0 18px; font-family:var(--serif); font-size:16.5px; font-weight:500; line-height:1.72; margin-bottom:18px; letter-spacing:-0.01em; word-break:keep-all; }

  .mat-wrap{ margin-top:12px; border:1px solid var(--ink-soft); border-radius:2px; background:var(--card); font-weight:400; overflow:hidden; font-family:var(--serif); }
  .mat-label{ display:inline-block; margin:10px 0 0 12px; padding:1px 8px; border:1px solid var(--ink-soft); border-radius:2px; font-size:11.5px; font-weight:700; color:var(--ink); font-family:var(--sans); }
  .mat-box{ padding:10px 13px 12px; font-size:14px; line-height:1.75; color:var(--ink); word-break:keep-all; }
  .mat-box + .mat-box{ border-top:1px dashed var(--border); }
  .mat-wrap .mat-table{ margin:10px 0 0; }
  .mat-table{ width:100%; border-collapse:collapse; font-size:13px; }
  .mat-table th, .mat-table td{ border:1px solid var(--border); padding:8px 8px; text-align:center; line-height:1.45; word-break:keep-all; }
  .mat-table tr > *:first-child{ border-left:none; } .mat-table tr > *:last-child{ border-right:none; }
  .mat-table tr:last-child td{ border-bottom:none; }
  .mat-table th{ background:var(--bg); font-weight:700; color:var(--ink); font-family:var(--sans); font-size:12.5px; }
  .mat-table td{ background:var(--card); }
  .mat-wrap > .mat-table{ overflow-x:auto; display:table; }

  .choices{ padding:0 12px; display:flex; flex-direction:column; gap:2px; }
  .choice{
    display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left;
    background:transparent; border:1px solid transparent; border-radius:10px;
    padding:11px 8px; font-family:var(--serif); font-size:15.5px; line-height:1.55; color:var(--ink); cursor:pointer; word-break:keep-all;
  }
  .choice:hover:not(:disabled){ background:var(--bg); }
  .choice:active:not(:disabled){ background:var(--blue-soft); }
  .choice .num{ flex:0 0 26px; height:26px; margin-top:-1px; font-weight:500; color:var(--ink); font-size:17px; position:relative; display:flex; align-items:center; justify-content:center; }
  .choice .num svg{ position:absolute; inset:-9px; width:calc(100% + 18px); height:calc(100% + 18px); overflow:visible; pointer-events:none; }
  .choice .num svg path{ fill:none; stroke:var(--red); stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:140; stroke-dashoffset:140; animation:draw .45s cubic-bezier(.4,.1,.3,1) forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  .choice:disabled{ cursor:default; }
  .choice.pick-correct .ctext{ background:linear-gradient(transparent 58%, var(--hl) 58%); }
  .choice.pick-wrong{ color:var(--ink-faint); text-decoration:none; }
  .choice.pick-wrong .ctext{ text-decoration:line-through; text-decoration-color:var(--red); }
  .choice.dim{ opacity:.45; }

  .feedback{ margin:16px 18px 0; padding:14px 15px; border-radius:10px; background:var(--bg); display:none; border-left:3px solid var(--ink-faint); }
  .feedback.show{ display:block; }
  .feedback .stamp{ font-size:14px; font-weight:700; display:block; margin-bottom:6px; }
  .feedback.is-correct{ border-left-color:var(--mark); }
  .feedback.is-correct .stamp{ color:var(--ink); }
  .feedback.is-wrong{ border-left-color:var(--red); }
  .feedback.is-wrong .stamp{ color:var(--red); }
  .feedback p{ margin:0; font-size:14px; line-height:1.75; color:var(--ink-soft); word-break:keep-all; }

  .quiz-controls{ padding:18px 18px 0; display:flex; justify-content:stretch; }
  .quiz-controls .btn{ width:100%; }
  .btn{
    font-weight:700; font-size:15px; background:var(--navy); color:#fff; border:none;
    padding:14px 22px; border-radius:12px; cursor:pointer; min-height:50px; letter-spacing:-0.01em;
  }
  :root[data-theme="dark"] .btn{ background:var(--blue); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{ background:var(--blue); } }
  .btn:active{ transform:translateY(1px); }
  .btn.ghost{ background:var(--card); color:var(--ink); border:1px solid var(--border); }

  .result{ text-align:center; padding:28px 18px 10px; }
  .result .score-line{ font-size:12.5px; color:var(--ink-faint); font-weight:600; }
  .result .score{ font-family:var(--serif); color:var(--red); font-weight:700; line-height:1; margin:10px 0 2px; display:inline-flex; align-items:baseline; gap:2px; position:relative; }
  .result .score b{ font-size:78px; letter-spacing:-0.05em; }
  .result .score span{ font-size:26px; }
  .result .score svg{ position:absolute; left:-6%; bottom:-14px; width:112%; height:18px; overflow:visible; }
  .result .score svg path{ fill:none; stroke:var(--red); stroke-width:2.4; stroke-linecap:round; stroke-dasharray:260; stroke-dashoffset:260; animation:draw .6s .25s ease-out forwards; }
  .result h2{ margin:26px 0 6px; font-size:18px; font-weight:700; letter-spacing:-0.02em; }
  .result .msg{ color:var(--ink-soft); font-size:13.5px; line-height:1.7; margin:0 0 22px; }
  .result .row{ display:flex; flex-direction:column; gap:8px; }
  .result .row .btn{ width:100%; }
  .big-stamp{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .choice .num svg path, .result .score svg path{ animation:none; stroke-dashoffset:0; }
    .drawer, .drawer-dim{ transition:none !important; }
  }

  /* ---------- bottom nav ---------- */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:970;
    max-width:520px; margin:0 auto;
    background:color-mix(in srgb, var(--card) 94%, transparent);

  .nt-lead{ font-size:13.5px; line-height:1.65; background:var(--bg); border-radius:10px; padding:10px 12px; margin:4px 0 6px; }
  .nt-sec p{ font-size:14px; line-height:1.7; margin:6px 0; word-break:keep-all; }
  .nt-sec ul, .nt-sec ol{ margin:6px 0; padding-left:18px; }
  .nt-sec li{ font-size:14px; line-height:1.7; margin:3px 0; word-break:keep-all; }
  .nt-sec li b{ background:linear-gradient(transparent 62%, var(--hl) 62%); }
  .nt-sec ul ul, .nt-sec ul ol{ margin:2px 0 4px; padding-left:16px; }
  .nt-sec ul ul li, .nt-sec ul ol li{ font-size:13.5px; color:var(--ink-soft); }
  .nt-tbl{ overflow-x:auto; margin:10px 0; border:1px solid var(--border); border-radius:10px; }
  .nt-tbl table{ border-collapse:collapse; width:100%; min-width:440px; font-size:12.5px; }
  .nt-tbl th, .nt-tbl td{ border-bottom:1px solid var(--line-soft); padding:8px 9px; text-align:left; vertical-align:top; line-height:1.55; word-break:keep-all; }
  .nt-tbl th{ background:var(--bg); font-weight:700; white-space:nowrap; }
  .nt-tbl tr:last-child td{ border-bottom:none; }
  .nt-tbl td:first-child{ font-weight:600; white-space:nowrap; }
  .nt-formula{ margin:10px 0; padding:10px 12px; border-radius:10px; background:var(--bg); font-family:var(--serif); font-size:14.5px; text-align:center; }

  /* ---------- D-day / 오답노트 / 모의고사 ---------- */
  .dday{ margin:16px 16px 0; padding:16px 18px; border-radius:18px; background:var(--navy); color:#fff; display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px; position:relative; box-shadow:var(--shadow); }
  .dday.today{ background:var(--red); }
  .dd-main{ flex:1; min-width:0; }
  .dd-label{ font-size:15px; font-weight:700; }
  .dd-date{ font-size:12.5px; color:#AEBBD6; margin-top:2px; }
  .dday.today .dd-date{ color:#fff; }
  .dd-num{ font-family:var(--serif); font-size:34px; font-weight:700; letter-spacing:-0.03em; line-height:1; }
  .dd-edit{ position:absolute; top:8px; right:10px; background:none; border:none; color:#AEBBD6; font-size:11px; cursor:pointer; padding:4px; }
  .dd-num{ margin-top:10px; }
  .dd-form{ width:100%; display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .dd-form input{ flex:1; min-width:120px; padding:9px 10px; border-radius:9px; border:none; font-size:14px; color:#15213A; background:#fff; }
  .dd-form .btn{ min-height:38px; padding:8px 14px; background:#fff; color:var(--navy); }
  .actions2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:12px 16px 0; }
  .act-card{ text-align:left; padding:15px 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--ink); cursor:pointer; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:4px; }
  .act-card.dark{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .ac-t{ font-size:15.5px; font-weight:700; letter-spacing:-0.02em; }
  .ac-s{ font-size:12px; opacity:.7; }
  .wr-head{ display:flex; align-items:center; gap:14px; margin:16px 16px 0; padding:14px 16px; border-radius:var(--radius); background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow); }
  .wr-big{ font-family:var(--serif); font-size:34px; font-weight:700; color:var(--red); line-height:1; }
  .wr-big small{ font-size:13px; margin-left:2px; color:var(--ink-soft); font-family:var(--sans); }
  .wr-head p{ margin:0; font-size:12.5px; line-height:1.6; color:var(--ink-soft); }
  .wr-actions{ display:flex; gap:8px; margin:12px 16px 0; }
  .wr-actions .btn{ flex:1; }
  .wr-list{ margin:12px 16px 20px; display:flex; flex-direction:column; gap:8px; }
  .wr-item{ position:relative; padding:12px 60px 12px 14px; border-radius:12px; background:var(--card); border:1px solid var(--border); border-left:3px solid var(--subj); }
  .wr-meta{ font-size:11.5px; color:var(--ink-faint); margin-bottom:4px; }
  .wr-meta b{ color:var(--green); }
  .wr-sub{ font-weight:700; color:var(--subj); margin-right:6px; }
  .wr-stem{ font-size:13.5px; line-height:1.55; word-break:keep-all; }
  .wr-del{ position:absolute; right:10px; top:50%; transform:translateY(-50%); background:var(--bg); border:none; border-radius:8px; padding:6px 9px; font-size:11.5px; color:var(--ink-soft); cursor:pointer; }
  .mk-card{ margin:16px; padding:6px 16px 18px; border-radius:18px; background:var(--card); border:1px solid var(--border); box-shadow:var(--shadow); }
  .mk-row-t{ font-size:13px; font-weight:700; margin:16px 0 8px; }
  .mk-row-t small{ font-weight:500; color:var(--ink-faint); font-size:11.5px; }
  .mk-chips{ padding:0 !important; flex-wrap:wrap; }
  .mk-seg{ display:flex; gap:6px; }
  .mk-seg button{ flex:1; padding:10px 6px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--ink-soft); font-weight:700; font-size:13px; cursor:pointer; }
  .mk-seg button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .mk-note{ font-size:12.5px; color:var(--ink-soft); line-height:1.65; margin:14px 0; }
  .mk-start{ width:100%; }
  .mk-hist{ margin:0 16px 20px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .mk-h{ display:flex; justify-content:space-between; padding:11px 14px; font-size:13px; border-top:1px solid var(--line-soft); }
  .mk-h:first-child{ border-top:none; }
  .mk-h b{ color:var(--red); font-family:var(--serif); }
  .mock-timer{ margin-top:10px; display:inline-block; padding:5px 10px; border-radius:8px; background:var(--bg); font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; }
  .mock-timer.urgent{ background:var(--red-soft); color:var(--red); }
  .track .cell.jump{ cursor:pointer; }
  .track .cell.answered{ background:var(--mark); border-color:var(--mark); color:transparent; }
  .choice.picked{ background:var(--blue-soft); border-color:var(--blue); }
  .choice.picked .num{ color:var(--blue); font-weight:700; }
  .mk-units{ margin:0 18px; display:flex; flex-direction:column; gap:12px; }
  .mk-u-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px; gap:10px; }
  .mk-review{ margin:0 18px; display:flex; flex-direction:column; gap:8px; }
  .mk-rv{ border:1px solid var(--border); border-radius:10px; padding:10px 12px; background:var(--card); }
  .mk-rv summary{ font-size:13px; font-weight:600; cursor:pointer; line-height:1.5; }
  .mk-rv-q{ font-family:var(--serif); font-size:14px; line-height:1.7; margin-top:10px; }
  .mk-rv-c{ margin:10px 0; padding-left:20px; font-size:13.5px; line-height:1.6; }
  .mk-rv-c li.ok{ color:var(--green); }
  .mk-rv-c li.mine{ color:var(--red); }
  .mk-rv-e{ font-size:13px; color:var(--ink-soft); line-height:1.7; margin:6px 0 0; }
  .mk-na{ font-size:12px; color:var(--red); margin:4px 0; }
  .dd-form[hidden], .mock-timer[hidden]{ display:none !important; }
  .dd-num{ margin-top:0 !important; margin-right:34px; }

  /* ================= 족보 스타일 리모델 ================= */
  :root, :root[data-theme="light"]{
    --bg:#F4F5F7; --card:#FFFFFF; --border:#E6E8EC; --line-soft:#F0F1F4;
    --ink:#111317; --ink-soft:#5B6270; --ink-faint:#9AA0AB;
    --navy:#1E6FF1; --navy-2:#155BD0; --mark:#1E6FF1;
    --blue:#1E6FF1; --blue-soft:#EAF1FE; --blue-dark:#155BD0;
    --orange:#F26A21; --orange-soft:#FFF0E6;
    --radius:12px; --shadow:none;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#3D84FF; --mark:#3D84FF; --blue:#5B96FF; --orange:#FF8A4C; --orange-soft:#3A2415; --shadow:none; } }
  :root[data-theme="dark"]{ --navy:#3D84FF; --mark:#3D84FF; --blue:#5B96FF; --orange:#FF8A4C; --orange-soft:#3A2415; --shadow:none; }
  body{ font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  .topbar{ background:var(--card); backdrop-filter:none; -webkit-backdrop-filter:none; border-bottom:1px solid var(--border); padding:8px 8px 8px 6px; }
  .topbar .left{ gap:4px; }
  .topbar .title{ font-size:16px; }
  .zb-top{ border-bottom:none; }
  .zb-logo{ font-size:19px !important; font-weight:800 !important; letter-spacing:-0.01em !important; font-family:'IBM Plex Sans KR',sans-serif; }
  .icon-btn.bell{ position:relative; }
  .bell-dot{ position:absolute; top:8px; right:9px; width:7px; height:7px; border-radius:50%; background:#F0433A; }
  .bell-dot[hidden]{ display:none; }
  /* hero */
  .zb-hero{ margin:0; padding:16px 18px; background:linear-gradient(120deg,#0B1A33 0%,#16294D 60%,#243B66 100%); color:#fff; display:flex; align-items:center; gap:12px; position:relative; }
  .zb-hero.today{ background:linear-gradient(120deg,#8E1B12,#D9372B); }
  .zb-hero .dd-main{ flex:1; min-width:0; }
  .zb-hero .dd-label{ font-size:15px; font-weight:700; }
  .zb-hero .dd-label em{ font-style:normal; color:#FFD84A; font-weight:700; margin-left:4px; font-size:12.5px; }
  .zb-hero .dd-date{ font-size:12.5px; color:#C9D3E6; margin-top:4px; line-height:1.5; }
  .zb-hero .dd-num{ flex-shrink:0; background:var(--blue); color:#fff; border:none; border-radius:10px; padding:10px 14px; font-family:'IBM Plex Sans KR',sans-serif; font-size:20px; font-weight:800; letter-spacing:-0.02em; cursor:pointer; margin:0 !important; }
  .zb-hero.today .dd-num{ background:#fff; color:#D9372B; }
  .zb-live{ display:flex; align-items:center; gap:10px; padding:11px 16px; background:#16181D; color:#E8EAEE; font-size:12.5px; min-height:42px; overflow:hidden; }
  .live-pill{ flex-shrink:0; background:#F0433A; color:#fff; font-size:10.5px; font-weight:800; padding:3px 9px 3px 16px; border-radius:99px; position:relative; letter-spacing:.02em; }
  .live-pill::before{ content:""; position:absolute; left:7px; top:50%; width:5px; height:5px; margin-top:-2.5px; border-radius:50%; background:#fff; animation:blink 1.2s infinite; }
  @keyframes blink{ 50%{ opacity:.2; } }
  .live-text{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .live-text b{ color:#FFD84A; font-weight:700; }
  .live-text.in{ animation:livein .35s ease; }
  @keyframes livein{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  /* sections */
  .zb-sec{ padding:20px 16px 4px; }
  .zb-h{ font-size:16.5px; font-weight:700; letter-spacing:-0.02em; display:flex; align-items:center; gap:8px; }
  .zb-h-row{ justify-content:space-between; }
  .zb-more{ background:none; border:none; color:var(--ink-faint); font-size:12.5px; cursor:pointer; }
  .zb-tag{ font-size:11px; font-weight:600; color:var(--orange); background:var(--orange-soft); padding:3px 8px; border-radius:6px; letter-spacing:0; }
  .zb-sub{ font-size:12.5px; color:var(--ink-soft); margin:4px 0 0; }
  .zb-noti{ position:relative; display:block; width:100%; text-align:left; margin-top:10px; padding:14px 40px 14px 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--ink); cursor:pointer; }
  .zb-noti b{ display:block; font-size:14.5px; font-weight:700; margin-bottom:5px; }
  .zb-noti span{ display:block; font-size:12.5px; color:var(--ink-soft); line-height:1.55; }
  .noti-badge{ position:absolute; top:12px; right:12px; min-width:20px; height:20px; padding:0 6px; border-radius:10px; background:#D8262B; color:#fff; font-size:11px; font-weight:700; font-style:normal; display:flex; align-items:center; justify-content:center; }
  .tt-days{ display:flex; gap:6px; margin-top:12px; overflow-x:auto; scrollbar-width:none; }
  .tt-days::-webkit-scrollbar{ display:none; }
  .tt-days button{ flex:1 0 74px; padding:9px 6px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .tt-days button b{ font-size:13.5px; }
  .tt-days button small{ font-size:11px; color:var(--orange); font-weight:700; }
  .tt-days button.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .tt-days button.on small{ color:#FFE38A; }
  .tt-days button.past{ opacity:.45; }
  .tt-list{ margin-top:8px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); overflow:hidden; }
  .tt-row{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-top:1px solid var(--line-soft); }
  .tt-row:first-child{ border-top:none; }
  .tt-row.go{ cursor:pointer; }
  .tt-row.go:active{ background:var(--bg); }
  .tt-p{ width:58px; flex-shrink:0; display:flex; flex-direction:column; }
  .tt-p b{ font-size:14px; }
  .tt-p small, .tt-m small{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .tt-m{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .tt-m b{ font-size:15px; }
  .tt-go{ flex-shrink:0; font-size:12px; font-weight:700; color:var(--blue); background:var(--blue-soft); padding:6px 10px; border-radius:8px; }
  .tt-none{ flex-shrink:0; font-size:12px; color:var(--ink-faint); }
  .tt-foot{ margin:0; padding:9px 14px; font-size:11px; color:var(--ink-faint); background:var(--bg); border-top:1px solid var(--line-soft); }
  .zb-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .zb-link{ display:flex; align-items:center; justify-content:space-between; gap:6px; padding:14px 14px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--ink); font-size:14px; font-weight:600; cursor:pointer; text-align:left; }
  .zb-link i{ font-style:normal; color:var(--ink-faint); }
  .zb-link:active{ background:var(--bg); }
  .zb-open{ font-style:normal; font-size:10px; font-weight:700; color:var(--blue); margin-left:4px; }
  .zb-open[hidden]{ display:none; }
  #homeWrongCount{ color:#fff; background:#D8262B; border-radius:8px; padding:1px 6px; }
  .zb-resume{ display:flex; align-items:center; gap:10px; width:100%; margin-top:8px; padding:13px 14px; border-radius:10px; border:none; background:var(--blue); color:#fff; cursor:pointer; text-align:left; }
  .zr-tag{ font-size:11px; font-weight:700; background:rgba(255,255,255,.2); padding:3px 8px; border-radius:6px; flex-shrink:0; }
  .zr-text{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .zr-text b{ font-size:14px; } .zr-text small{ font-size:11.5px; opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .zb-resume i{ font-style:normal; }
  .zb-subjtabs{ display:flex; margin-top:12px; border:1px solid var(--border); border-radius:10px; background:var(--card); overflow-x:auto; scrollbar-width:none; }
  .zb-subjtabs::-webkit-scrollbar{ display:none; }
  .zb-subjtabs button{ flex:1 0 auto; min-width:72px; padding:12px 10px; border:none; background:none; color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .zb-subjtabs button b{ font-size:14px; font-weight:600; }
  .zb-subjtabs button small{ font-size:10.5px; color:var(--orange); font-weight:600; white-space:nowrap; }
  .zb-sec .omr{ margin:12px 0 0; border-radius:var(--radius); }
  .omr-head{ background:var(--card); color:var(--ink); border-bottom:1px solid var(--border); }
  .omr-head .oh-sub{ color:var(--ink-faint); }
  .oh-pct{ color:var(--blue) !important; font-family:'IBM Plex Sans KR',sans-serif !important; font-weight:800 !important; }
  .oh-pct small{ color:var(--ink-faint) !important; }
  .zb-notice{ margin-top:10px; border:1px solid var(--border); border-radius:var(--radius); background:var(--card); overflow:hidden; }
  .zb-notice button{ display:block; width:100%; text-align:left; padding:12px 14px; border:none; border-top:1px solid var(--line-soft); background:none; color:var(--ink); font-size:13px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .zb-notice button:first-child{ border-top:none; }
  .nt-c{ color:var(--ink-soft); }
  .zb-foot{ text-align:center; font-size:11px; color:var(--ink-faint); padding:24px 0 120px; }
  .zb-fire{ font-size:11.5px; font-weight:700; color:var(--orange); background:var(--orange-soft); padding:4px 8px; border-radius:7px; vertical-align:middle; margin-left:6px; letter-spacing:0; }
  /* floating promo */
  .zb-float{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(74px + env(safe-area-inset-bottom,0px)); width:min(calc(100% - 20px), 500px); z-index:960; border-radius:14px; overflow:hidden; box-shadow:0 8px 24px rgba(20,40,120,.28); }
  .zb-float[hidden]{ display:none; }
  .zf-top{ background:linear-gradient(90deg,#1133F5,#1E6FF1 55%,#1AA3F2); color:#fff; text-align:center; padding:12px 30px 11px; }
  .zf-top b{ display:block; color:#FFE14D; font-size:15px; font-weight:800; }
  .zf-top span{ font-size:11.5px; opacity:.92; }
  .zf-btns{ display:grid; grid-template-columns:1fr 1fr; }
  .zf-btns button{ display:flex; justify-content:space-between; align-items:center; padding:11px 12px; border:none; font-size:13px; font-weight:700; cursor:pointer; }
  .zf-btns button:first-child{ background:#fff; color:#1133F5; }
  .zf-btns button:last-child{ background:#2A22F0; color:#fff; }
  .zf-btns i{ font-style:normal; }
  .zf-x{ position:absolute; top:6px; right:8px; background:none; border:none; color:#fff; font-size:14px; cursor:pointer; padding:4px; z-index:1; }
  /* bottom nav */
  .zb-nav{ background:var(--card) !important; border-top:1px solid var(--border); border-radius:18px 18px 0 0; box-shadow:0 -2px 12px rgba(0,0,0,.05); overflow:visible; }
  .zb-nav button{ font-size:10.5px; color:var(--ink-soft); padding-top:9px; }
  .zb-nav button svg{ width:22px; height:22px; }
  .zb-nav button.active{ color:var(--blue); }
  .zb-nav .nav-home{ position:relative; }
  .nh-circle{ width:46px; height:46px; margin-top:-22px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(30,111,241,.4); border:3px solid var(--card); }
  .nh-circle svg{ width:22px !important; height:22px !important; }
  .zb-nav .nav-home.active{ color:var(--blue); }

  .drawer{ left:0; right:auto !important; width:min(100vw, 520px) !important; transform:translateX(-100%); background:var(--card) !important; }

  .drawer-close{ background:none !important; display:flex; align-items:center; justify-content:center; }
  .drawer-close svg{ width:22px; height:22px; }
  .mn-seg{ display:flex; align-items:center; gap:8px; }
  .mn-seg .on{ background:var(--blue); color:#fff; font-size:13px; font-weight:700; padding:6px 16px; border-radius:99px; }
  .mn-seg .dh-sub{ font-size:11.5px; color:var(--ink-faint); margin:0 !important; }
  .mn-chips{ display:flex; gap:6px; justify-content:center; padding:4px 12px 12px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .mn-chips button{ padding:6px 12px; border-radius:99px; border:1px solid var(--border); background:var(--card); color:var(--ink); font-size:12px; font-weight:600; cursor:pointer; }

  .mn-side{ width:92px; flex-shrink:0; background:var(--bg); overflow-y:auto; padding-top:6px; }
  .mn-side button{ display:block; width:100%; padding:15px 8px; border:none; background:none; color:var(--ink-faint); font-size:13.5px; cursor:pointer; }
  .mn-side button.on{ background:var(--card); color:var(--ink); font-weight:700; }
  .mn-main{ flex:1; overflow-y:auto; padding:12px 14px 40px !important; -webkit-overflow-scrolling:touch; }
  .mn-card{ position:relative; display:block; width:100%; text-align:left; padding:10px 32px 11px 12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--ink); cursor:pointer; margin-bottom:6px; }
  .mn-card small{ display:block; font-size:10.5px; color:var(--ink-faint); }
  .mn-card b{ font-size:13.5px; }

  .mn-check{ color:var(--blue); }
  .mn-new{ font-style:normal; font-size:9.5px; color:#fff; background:#F0433A; padding:1px 5px; border-radius:4px; margin-left:3px; vertical-align:middle; }
  .mn-grp{ padding:12px 0 8px; border-bottom:1px solid var(--border); }
  .mn-gh{ display:flex; justify-content:space-between; align-items:center; font-size:14.5px; font-weight:700; padding:6px 2px 8px; cursor:pointer; }
  .mn-gh i{ font-style:normal; color:var(--ink-faint); }
  .mn-it{ display:block; width:100%; text-align:left; padding:9px 12px; border:none; background:none; color:var(--ink); font-size:13.5px; cursor:pointer; border-radius:8px; }
  .mn-it:active{ background:var(--bg); }
  .mn-it.off{ color:var(--ink-faint); cursor:default; }
  .mn-tip{ font-style:normal; font-size:10.5px; font-weight:600; color:var(--orange); background:var(--orange-soft); padding:2px 6px; border-radius:5px; margin-left:4px; }
  /* 실전대비 / 공통 목록 */
  .tabrow{ background:transparent !important; border:none !important; padding:0 !important; margin:4px 16px 0 !important; gap:14px; overflow-x:auto; scrollbar-width:none; }
  .tabrow::-webkit-scrollbar{ display:none; }
  .tabrow button{ flex:0 0 auto !important; background:none !important; color:var(--ink-faint) !important; padding:12px 0 !important; border-radius:0 !important; font-size:14px !important; }
  .tabrow button.active{ color:var(--ink) !important; font-weight:800 !important; }
  .filterrow select{ border-radius:99px !important; background-color:var(--card) !important; padding:9px 30px 9px 14px !important; }
  .acc-item{ border-radius:10px !important; box-shadow:none !important; }
  .sub-toggle{ gap:0 !important; margin:12px 16px 0; padding:0 !important; border:1px solid var(--border); border-radius:10px; background:var(--card); }
  .sub-toggle button{ border:none !important; border-radius:0 !important; background:none !important; color:var(--ink-faint) !important; padding:12px 14px !important; }
  .sub-toggle button.active{ color:var(--ink) !important; font-weight:800 !important; box-shadow:inset 0 -2px 0 var(--blue); }
  .mk-chips{ border:none !important; margin:0 !important; background:none !important; gap:6px !important; }
  .mk-chips button{ border:1px solid var(--border) !important; border-radius:99px !important; }
  .mk-chips button.active{ background:var(--blue) !important; color:#fff !important; box-shadow:none; border-color:var(--blue) !important; }
  .btn{ border-radius:10px; }
  .dday, .actions2{ display:none; }

  /* ================= 시험지(족보) 모드 ================= */
  [data-view="quiz"] .paper{ position:relative; }
  .ink-layer{ position:absolute; inset:0; width:100%; height:100%; z-index:30; pointer-events:none; overflow:visible; }
  .ink-layer.active{ pointer-events:auto; touch-action:pan-y; cursor:crosshair; }
  .ink-layer path{ fill:none; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
  .ink-layer.active path{ pointer-events:visibleStroke; }

  body.in-quiz.sheet-mode .app{ max-width:1080px; }
  body.in-quiz.sheet-mode [data-view="quiz"] .paper{ background:transparent; border:0; box-shadow:none; border-radius:0; margin:0 10px; padding-bottom:120px; }
  body.in-quiz.sheet-mode .quiz-header,
  body.in-quiz.sheet-mode #track,
  body.in-quiz.sheet-mode #quizArea{ display:none !important; }
  body.in-quiz.sheet-mode .quiz-back{ margin-left:10px; }
  body.in-quiz.sheet-mode #resultArea{ max-width:600px; margin:0 auto; }
  body.in-quiz.sheet-mode #resultArea .result{ background:var(--card); max-width:560px; margin:0 auto; border-radius:6px; box-shadow:var(--shadow); }

  .sheet{
    --pp:#FFFFFF; --pi:#151515; --pm:#5E636D; --pr:#C9CCD2;
    --red-pen:#D12B2B; --pencil:#474C55;
  }
  :root[data-theme="dark"] .sheet{ --pp:#1B2130; --pi:#E4E8F0; --pm:#A3ACBE; --pr:#3A4459; --red-pen:#FF6A5C; --pencil:#B4BDCD; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .sheet{ --pp:#1B2130; --pi:#E4E8F0; --pm:#A3ACBE; --pr:#3A4459; --red-pen:#FF6A5C; --pencil:#B4BDCD; }
  }

  /* 답안 표시줄 (OMR) */
  .omr{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    display:flex; align-items:center; gap:10px;
    max-width:1000px; margin:0 auto 12px; padding:8px 10px;
    background:color-mix(in srgb, var(--bg) 90%, transparent);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .omr-cells{ display:flex; gap:5px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; padding:2px 1px; }
  .omr-cells::-webkit-scrollbar{ display:none; }
  .omr-c{
    all:unset; box-sizing:border-box; flex:0 0 26px; width:26px; height:26px; border-radius:50%;
    border:1.3px solid var(--ink-faint); display:grid; place-items:center; position:relative;
    font:600 11px/1 var(--sans); color:var(--ink-soft); font-variant-numeric:tabular-nums; cursor:pointer;
  }
  .omr-c:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .omr-c.picked{ background:var(--ink); border-color:var(--ink); color:var(--card); }
  .sheet .omr-c.correct{ border:2px solid var(--red-pen); color:var(--red-pen); }
  .sheet .omr-c.wrong{ border-color:var(--ink-faint); color:var(--ink-faint); }
  .sheet .omr-c.wrong::after{ content:""; position:absolute; left:50%; top:-3px; bottom:-3px; width:2px; background:var(--red-pen); transform:rotate(38deg); border-radius:2px; }
  .omr-meta{ font:600 12.5px var(--sans); color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .omr .mock-timer{ margin:0; padding:5px 9px; }
  .omr-btn{ all:unset; box-sizing:border-box; padding:7px 13px; border-radius:999px; background:var(--ink); color:var(--card); font:700 12.5px var(--sans); cursor:pointer; white-space:nowrap; }
  .omr-btn[hidden]{ display:none; }
  .omr-btn:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  /* 시험지 한 장 */
  .sh-page{
    position:relative; max-width:1000px; margin:0 auto 18px;
    background:var(--pp); color:var(--pi);
    padding:26px 20px 16px;
    box-shadow:0 1px 1px rgba(20,28,45,.06), 0 10px 28px rgba(20,28,45,.08);
  }
  .sh-cols{ display:block; }
  .sh-col + .sh-col{ margin-top:34px; }
  @media (min-width:900px){
    .sh-page{ padding:40px 46px 20px; }
    .sh-cols{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .sh-col:first-child{ padding-right:26px; }
    .sh-col + .sh-col{ margin-top:0; padding-left:26px; border-left:1px solid var(--pi); }
  }
  .sh-foot{ margin-top:30px; padding-top:8px; border-top:1px solid var(--pr); text-align:center; font:500 12px var(--sans); color:var(--pm); font-variant-numeric:tabular-nums; }

  /* 머리글 */
  .sh-head{ margin-bottom:28px; }
  .sh-top{ display:flex; justify-content:space-between; gap:12px; padding-bottom:6px; border-bottom:2px solid var(--pi); font:500 12px var(--sans); color:var(--pm); }
  .sh-title{ margin:16px 0 14px; text-align:center; font:700 24px/1.3 var(--sans); letter-spacing:-0.02em; color:var(--pi); word-break:keep-all; }
  .sh-grade{ display:inline-block; margin-right:10px; padding:3px 9px 2px; border:1.5px solid var(--pi); font-size:13px; font-weight:700; vertical-align:4px; letter-spacing:0; }
  @media (min-width:900px){ .sh-title{ font-size:30px; } }
  .sh-info{ display:grid; grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr); border-top:1.5px solid var(--pi); border-bottom:3px double var(--pi); }
  .sh-info > div{ padding:7px 10px; border-bottom:1px solid var(--pr); font:500 13px/1.5 var(--sans); color:var(--pi); word-break:keep-all; }
  .sh-info > div:nth-last-child(-n+4){ border-bottom:0; }
  .sh-info .k{ text-align:center; font-weight:700; background:color-mix(in srgb, var(--pi) 5%, transparent); border-right:1px solid var(--pr); white-space:nowrap; }
  .sh-info .v + .k{ border-left:1px solid var(--pr); }
  .sh-score{ font:700 22px/1 var(--serif) !important; color:var(--red-pen) !important; padding-top:4px !important; padding-bottom:4px !important; }
  .sh-score small{ font-size:13px; margin-left:2px; }
  .sh-note{ margin-top:14px; padding:10px 14px; border:1px solid var(--pr); font:500 13px/1.7 var(--sans); color:var(--pm); }
  .sh-note b{ color:var(--pi); margin-right:8px; }
  .sh-note span + span::before{ content:"/"; margin:0 7px; color:var(--pr); }

  /* 문항 */
  .sq{ scroll-margin-top:64px; }
  .sh-col .sq + .sq{ margin-top:36px; }
  .sq-head{ display:grid; grid-template-columns:auto minmax(0,1fr); column-gap:7px; }
  .sq-no{ position:relative; font:700 17px/1.8 var(--sans); color:var(--pi); font-variant-numeric:tabular-nums; }
  .sq-grade{ position:absolute; left:-15px; top:-9px; width:46px; height:46px; pointer-events:none; }
  .sq-grade svg{ width:100%; height:100%; overflow:visible; }
  .sq-grade svg path{ fill:none; stroke:var(--red-pen); stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:140; stroke-dashoffset:140; animation:draw .5s cubic-bezier(.4,.1,.3,1) forwards; }
  .sq-stem{ font-family:var(--serif); font-size:15.5px; font-weight:500; line-height:1.8; letter-spacing:-0.01em; word-break:keep-all; color:var(--pi); }
  .sq-stem .mat-wrap{ background:transparent; border-color:var(--pi); }
  .sq-stem .mat-label{ border-color:var(--pi); color:var(--pi); }
  .sq-stem .mat-box{ color:var(--pi); }
  .sq-tag{ display:inline-block; margin-right:6px; padding:0 5px; border:1px solid var(--red-pen); color:var(--red-pen); font:700 11px/1.6 var(--sans); vertical-align:2px; }

  .sq-ch{ list-style:none; margin:12px 0 0; padding:0 0 0 20px; display:grid; gap:2px 8px; }
  .sq-ch.c5{ grid-template-columns:repeat(5, minmax(0,1fr)); }
  .sq-ch.c3{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  @media (max-width:520px){
    .sq-ch.c5{ grid-template-columns:repeat(3, minmax(0,1fr)); }
    .sq-ch.c3{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  .sq-c{
    all:unset; box-sizing:border-box; width:100%; display:flex; align-items:flex-start; gap:7px;
    padding:6px 6px; border-radius:5px; cursor:pointer;
    font-family:var(--serif); font-size:15px; line-height:1.65; color:var(--pi); word-break:keep-all;
    -webkit-tap-highlight-color:transparent;
  }
  .sq-c:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }
  @media (hover:hover){ .sq:not(.done) .sq-c:hover{ background:color-mix(in srgb, var(--pi) 5%, transparent); } }
  .sq:not(.done) .sq-c:active{ background:color-mix(in srgb, var(--pi) 9%, transparent); }
  .sq.done .sq-c{ cursor:default; }
  .sq-cn{ position:relative; flex:0 0 auto; min-width:1.1em; text-align:center; }
  .sq-cn svg{ position:absolute; left:50%; top:50%; width:34px; height:34px; transform:translate(-50%,-52%); overflow:visible; pointer-events:none; }
  .sq-cn svg path{ fill:none; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:140; stroke-dashoffset:140; animation:draw .4s cubic-bezier(.4,.1,.3,1) forwards; }
  .sq-cn .mk-pencil path{ stroke:var(--pencil); }
  .sq-cn .mk-red path{ stroke:var(--red-pen); stroke-width:2.6; }
  .sq.done .sq-c:not(.is-pick):not(.is-answer){ color:color-mix(in srgb, var(--pi) 55%, transparent); }

  .sq-exp{ margin:12px 0 0 20px; padding:10px 13px 11px; border:1px solid var(--pr); border-left:3px solid var(--red-pen); font:400 13.5px/1.75 var(--sans); color:var(--pm); word-break:keep-all; }
  .sq-exp .h{ display:block; margin-bottom:3px; font-weight:700; color:var(--red-pen); }
  .sq-exp.ok{ border-left-color:var(--pr); }
  .sq-exp.ok .h{ color:var(--pi); }

  .sh-end{ margin-top:34px; font:500 12.5px/1.7 var(--sans); color:var(--pm); }
  .sh-submit{ display:block; width:100%; max-width:360px; margin:18px auto 0; }

  @media (prefers-reduced-motion: reduce){
    .sq-cn svg path, .sq-grade svg path{ animation:none; stroke-dashoffset:0; }
  }
</style>
</head>

ices": ["SNS에 올라온 사진과 동영상", "학생별 과목 점수를 정리한 표", "날짜별 기온을 기록한 스프레드시트", "고객 번호와 주문 수량이 정리된 데이터베이스", "행과 열로 정리된 출석부"], "correct": 0, "explain": "비정형 데이터는 정해진 구조 없이 저장된 데이터로 사진, 동영상, 음성, 글 등이 있다. 행과 열로 정리된 표나 데이터베이스는 정형 데이터이다."}, {"q": "자료와 가장 적절한 그래프를 옳게 짝 지은 것은?", "choices": ["1년 동안의 월별 기온 변화 – 꺾은선 그래프", "전교생의 혈액형 비율 – 꺾은선 그래프", "키와 몸무게의 관계 – 원그래프", "월별 기온 변화 – 원그래프", "과목별 선호 비율 – 산점도"], "correct": 0, "explain": "시간에 따른 변화는 꺾은선 그래프, 전체에 대한 비율은 원그래프, 두 변수의 관계는 산점도가 알맞다."}, {"q": "암호화와 압축의 목적을 옳게 비교한 것은?", "choices": ["암호화는 정보를 보호하기 위해, 압축은 데이터의 크기를 줄이기 위해 한다", "암호화와 압축 모두 크기를 줄이기 위해 한다", "암호화는 크기를 줄이기 위해, 압축은 보안을 위해 한다", "압축하면 누구도 내용을 알 수 없게 된다", "암호화하면 항상 데이터 크기가 절반이 된다"], "correct": 0, "explain": "암호화는 허락받지 않은 사람이 내용을 알 수 없도록 보호하는 것이고, 압축은 저장 공간과 전송 시간을 줄이기 위해 크기를 줄이는 것이다."}],
[{"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>print(7 % 3, 7 // 3)</div></div>", "choices": ["1 2", "2 1", "2.33 1", "1 2.33", "7 3"], "correct": 0, "explain": "%는 나머지, //는 몫을 구하는 연산자이다. 7을 3으로 나누면 몫은 2, 나머지는 1이다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>a = &quot;3&quot;\nb = 4\nprint(a * b)</div></div>", "choices": ["3333", "12", "7", "34", "오류가 발생한다"], "correct": 0, "explain": "a는 문자열 \"3\"이므로 a * 4는 문자열을 4번 반복한 \"3333\"이 된다. 숫자 곱셈이 아니다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>x = 10\nx += 5\nx *= 2\nprint(x)</div></div>", "choices": ["30", "25", "20", "15", "17"], "correct": 0, "explain": "x += 5로 x는 15가 되고, x *= 2로 30이 된다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>for i in range(1, 10, 3):\n    print(i, end=&quot; &quot;)</div></div>", "choices": ["1 4 7", "1 2 3", "1 4 7 10", "3 6 9", "0 3 6 9"], "correct": 0, "explain": "range(1, 10, 3)은 1부터 시작해 3씩 증가하며 10 미만까지이므로 1, 4, 7이 출력된다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>n = 15\nif n % 3 == 0 and n % 5 == 0:\n    print(&quot;FizzBuzz&quot;)\nelif n % 3 == 0:\n    print(&quot;Fizz&quot;)\nelse:\n    print(n)</div></div>", "choices": ["FizzBuzz", "Fizz", "15", "Buzz", "아무것도 출력되지 않는다"], "correct": 0, "explain": "15는 3으로도 5로도 나누어떨어지므로 첫 번째 조건이 참이 되어 FizzBuzz를 출력하고, 나머지 조건은 검사하지 않는다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>total = 0\nfor i in range(1, 6):\n    if i % 2 == 0:\n        continue\n    total += i\nprint(total)</div></div>", "choices": ["9", "15", "6", "5", "4"], "correct": 0, "explain": "continue는 짝수일 때 아래 문장을 건너뛰게 한다. 따라서 홀수 1, 3, 5만 더해져 9가 된다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>i = 0\nwhile True:\n    i += 3\n    if i &gt; 7:\n        break\nprint(i)</div></div>", "choices": ["9", "6", "7", "8", "무한히 반복된다"], "correct": 0, "explain": "i는 3, 6, 9로 커지고, 9가 되었을 때 i > 7이 참이 되어 break로 반복을 멈춘다. 그래서 9가 출력된다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>print(int(&quot;12&quot;) + 3)</div></div>", "choices": ["15", "123", "12 3", "오류가 발생한다", "\"15\""], "correct": 0, "explain": "int(\"12\")는 문자열을 정수 12로 바꾸므로 12 + 3 = 15가 출력된다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>print(10 / 4)</div></div>", "choices": ["2.5", "2", "3", "2.0", "0.4"], "correct": 0, "explain": "파이썬에서 / 연산은 실수 나눗셈이므로 결과는 2.5이다. 몫만 구하려면 //를 쓴다."}, {"q": "다음 프로그램의 실행 결과로 옳은 것은?<div class='mat-wrap'><div class='mat-label'>코드</div><div class='mat-box' style='font-family:ui-monospace,Menlo,Consolas,monospace; white-space:pre-wrap; font-size:13px;'>s = &quot;python&quot;\nprint(s[1:4])</div></div>", "choices": ["yth", "pyt", "ytho", "pyth", "tho"], "correct": 0, "explain": "인덱스는 0부터 시작하므로 s[1:4]는 1, 2, 3번 글자인 y, t, h를 잘라 낸다. 끝 인덱스 4는 포함되지 않는다."}],
