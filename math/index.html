<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>수학 학습 · 서익닷컴</title><link rel="stylesheet" href="math.css"><script src="math.js" defer></script></head><body><header><a href="../index.html">← 서익닷컴</a><h1>수학 학습</h1><p>기출 180문항 · 변형 20문항 | 문제를 풀고 풀이 과정을 확인하세요.</p></header><main><nav aria-label="과목"><button data-course="1" aria-pressed="true">공통수학 1</button><button data-course="2" aria-pressed="false">공통수학 2</button></nav><p id="scope"></p><div class="filters"><label>문제 종류<select id="kind"><option value="">전체 문제</option><option value="original">기출문제</option><option value="variant">변형문제</option></select></label><label>시험<select id="exam"><option value="">전체 시험</option></select></label><label>단원<select id="unit"></select></label><label>학습 상태<select id="state"><option value="">전체</option><option value="done">풀었어요</option><option value="review">다시 풀기</option><option value="new">아직 안 푼 문제</option></select></label></div><p id="count" role="status">문제를 불러오는 중입니다.</p><div id="list"></div><section id="viewer" hidden aria-label="문제 풀이"><button id="back">← 목록</button><h2 id="title" tabindex="-1"></h2><div id="question"></div><label class="answer">내 답안 <input id="answer" maxlength="80" placeholder="선택 번호 또는 답을 적으세요" autocomplete="off"></label><p class="note" id="answer-note">답안은 이 기기에 저장됩니다.</p><button id="check-answer" type="button" hidden>정답 확인</button><p id="answer-feedback" role="status"></p><details id="solution"><summary id="solution-summary">풀이 보기</summary><h3>풀이 접근 방법</h3><p id="hint"></p><h3 id="solution-heading">공식 해설</h3><div id="explanation"></div></details><div class="actions"><button id="done">풀었어요</button><button id="review">다시 풀기</button><button id="next">다음 문제 →</button></div></section><p class="note">기출은 업로드한 문제지·해설지의 수식과 그림을 보존했습니다. 변형문제는 기출 유형을 참고해 새로 작성한 문제입니다. 풀이 접근 안내는 단원별 학습 보조 설명이며, 상세 풀이와 정답은 공식 해설에서 확인합니다. 공통수학 2의 집합·명제·함수 단원은 이번 자료에 포함되지 않았습니다.</p></main></body></html>
